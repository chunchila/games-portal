<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>בריחה מהמעבדה</title>
<style>
html,body{margin:0;padding:0;background:#060d0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:15px;background:linear-gradient(180deg,#0e241c,#060d0a)}
#hud b{font-size:17px;color:#6ef0b8}
#cv{flex:1;display:block;width:100%;touch-action:none}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,10,8,.93);text-align:center;padding:24px;z-index:5}
.ovl h1{font-size:30px;margin:0 0 10px;color:#6ef0b8;text-shadow:0 2px 14px #0ec47a66}
.ovl p{font-size:15px;line-height:1.7;color:#c8e8d8;margin:0 0 22px;max-width:330px}
button{background:linear-gradient(180deg,#6ef0b8,#0ec47a);border:0;border-radius:999px;padding:14px 42px;font-size:19px;font-weight:700;color:#02321c;box-shadow:0 4px 18px #0ec47a55;cursor:pointer}
button:active{transform:scale(.96)}
.hide{display:none!important}
#hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#3d6a52;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<div id="hud"><div>ניקוד: <b id="sc">0</b></div><div>חדר <b id="rm">1</b>/9</div><div id="lives">♥♥♥</div></div>
<canvas id="cv"></canvas>
<div id="hint">גררו כדי לזוז - הירי אוטומטי אל הרובוט הקרוב</div>
<div class="ovl" id="startOvl">
<h1>בריחה מהמעבדה</h1>
<p>ד"ר נובה התעוררה במעבדה נעולה ורובוטי האבטחה יצאו משליטה! עברו בין תשעה חדרים, פוצצו את הרובוטים עם אקדח ההלם ומצאו את פתח המילוט. הירי אוטומטי - גררו כדי לברוח!</p>
<button id="startBtn">שחקו</button>
</div>
<div class="ovl hide" id="overOvl">
<h1 id="overT">נגמר המשחק</h1>
<p id="overP"></p>
<button id="againBtn">שחקו שוב</button>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const scEl=document.getElementById('sc'),rmEl=document.getElementById('rm'),livesEl=document.getElementById('lives');
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);x.direction='ltr'}
window.addEventListener('resize',rs);
const RN=9;
let pl,robots,bolts,walls,room,score,lives,run,inv,fireT,roomFlash,exitOpen;
let tx=0,ty=0,dragging=false;
function mkRoom(r){
walls=[];
walls.push({x:W*.08,y:H*.06,w:W*.84,h:10});
walls.push({x:W*.08,y:H*.94,w:W*.84,h:10});
walls.push({x:W*.08,y:H*.06,w:10,h:H*.88});
walls.push({x:W*.92-10,y:H*.06,w:10,h:H*.88});
const seed=r*7+3;
for(let i=0;i<2+(r%3);i++){
const wx=W*(.25+((seed*i*37)%50)/100),wy=H*(.2+((seed*i*53)%55)/100);
walls.push({x:wx,y:wy,w:(i%2?12:W*.18),h:(i%2?H*.16:12)})}
robots=[];
const n=Math.min(2+Math.floor(r/2),5);
for(let i=0;i<n;i++)robots.push({x:W*(.2+.6*Math.random()),y:H*(.15+.7*Math.random()),vx:0,vy:0,sp:40+r*4,wt:Math.random()*2,ph:Math.random()*7});
bolts=[];exitOpen=false;fireT=.5;roomFlash=.8;
pl.x=W*.5;pl.y=H*.88;tx=pl.x;ty=pl.y}
function start(){score=0;lives=3;room=1;run=true;inv=1.5;
pl={x:W/2,y:H*.88,r:11};mkRoom(1);upd()}
function upd(){scEl.textContent=score;rmEl.textContent=room;livesEl.textContent='♥'.repeat(Math.max(0,lives))}
function hitWall(px,py,r){
if(px<W*.08+10+r||px>W*.92-10-r)return false;
if(py<H*.06+10+r||py>H*.94-10-r)return false;
for(const wl of walls.slice(4)){
if(px>wl.x-r&&px<wl.x+wl.w+r&&py>wl.y-r&&py<wl.y+wl.h+r)return false}
return true}
function lose(){if(inv>0)return;lives--;upd();inv=2;
if(lives<=0){run=false;setTimeout(()=>{document.getElementById('overT').textContent='נתפסתם!';document.getElementById('overP').textContent='ד"ר נובה הגיעה לחדר '+room+' עם '+score+' נקודות.';document.getElementById('overOvl').classList.remove('hide')},600)}
else{pl.x=W*.5;pl.y=H*.88;tx=pl.x;ty=pl.y}}
function step(dt){
if(inv>0)inv-=dt;if(roomFlash>0)roomFlash-=dt;
const dx=tx-pl.x,dy=ty-pl.y,d=Math.hypot(dx,dy);
if(d>6){const sp=Math.min(190,d*6);const nx=pl.x+dx/d*sp*dt,ny=pl.y+dy/d*sp*dt;
if(hitWall(nx,pl.y,pl.r))pl.x=nx;
if(hitWall(pl.x,ny,pl.r))pl.y=ny}
for(const rb of robots){
rb.wt-=dt;
if(rb.wt<=0){rb.wt=1.4+Math.random();const a=Math.atan2(pl.y-rb.y,pl.x-rb.x)+(Math.random()-.5);rb.vx=Math.cos(a)*rb.sp;rb.vy=Math.sin(a)*rb.sp}
const nx=rb.x+rb.vx*dt,ny=rb.y+rb.vy*dt;
if(hitWall(nx,rb.y,10))rb.x=nx;else rb.vx*=-1;
if(hitWall(rb.x,ny,10))rb.y=ny;else rb.vy*=-1;
if(Math.abs(rb.x-pl.x)<20&&Math.abs(rb.y-pl.y)<20)lose()}
fireT-=dt;
if(fireT<=0&&robots.length){
fireT=.5;
let best=null,bd=1e9;
for(const rb of robots){const d2=Math.hypot(rb.x-pl.x,rb.y-pl.y);if(d2<bd){bd=d2;best=rb}}
if(best){const a=Math.atan2(best.y-pl.y,best.x-pl.x);
bolts.push({x:pl.x,y:pl.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,t:1})}}
for(const b of bolts){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;
if(!hitWall(b.x,b.y,2))b.t=0;
for(const rb of robots){if(!rb.dead&&Math.abs(b.x-rb.x)<14&&Math.abs(b.y-rb.y)<14){rb.dead=true;b.t=0;score+=50;upd();
for(let i=0;i<8;i++)sparks.push({x:rb.x,y:rb.y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,t:.4})}}}
robots=robots.filter(r2=>!r2.dead);
bolts=bolts.filter(b=>b.t>0);
for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt}
sparks=sparks.filter(s=>s.t>0);
if(robots.length===0)exitOpen=true;
if(exitOpen&&pl.y<H*.06+26&&Math.abs(pl.x-W/2)<40){
score+=200;upd();room++;
if(room>RN){run=false;document.getElementById('overT').textContent='ברחתם!';document.getElementById('overP').textContent='ד"ר נובה מצאה את פתח המילוט! ניקוד סופי: '+score;document.getElementById('overOvl').classList.remove('hide')}
else mkRoom(room)}
}
let sparks=[];
function draw(t){
x.clearRect(0,0,W,H);
x.fillStyle='#08120e';x.fillRect(0,0,W,H);
x.strokeStyle='#0ec47a18';x.lineWidth=1;
for(let gx=W*.08;gx<W*.92;gx+=26){x.beginPath();x.moveTo(gx,H*.06);x.lineTo(gx,H*.94);x.stroke()}
for(let gy=H*.06;gy<H*.94;gy+=26){x.beginPath();x.moveTo(W*.08,gy);x.lineTo(W*.92,gy);x.stroke()}
for(const wl of walls){
const g=x.createLinearGradient(wl.x,wl.y,wl.x,wl.y+Math.max(wl.h,12));
g.addColorStop(0,'#1e5a42');g.addColorStop(1,'#0d3325');
x.fillStyle=g;x.fillRect(wl.x,wl.y,wl.w,wl.h)}
x.strokeStyle='#6ef0b8';x.lineWidth=2;
x.strokeRect(W*.08,H*.06,W*.84,H*.88);
if(exitOpen){
x.fillStyle='#6ef0b8';x.fillRect(W/2-36,H*.06-4,72,14);
const gl=x.createRadialGradient(W/2,H*.06+8,4,W/2,H*.06+8,44);gl.addColorStop(0,'rgba(110,240,184,.5)');gl.addColorStop(1,'rgba(110,240,184,0)');
x.fillStyle=gl;x.beginPath();x.arc(W/2,H*.06+8,44,0,7);x.fill()}
else{x.fillStyle='#ff5a5a';x.fillRect(W/2-36,H*.06-4,72,14)}
for(const rb of robots){
x.save();x.translate(rb.x,rb.y);
x.fillStyle='#8a98ac';x.beginPath();x.ellipse(0,2,10,9,0,0,7);x.fill();
x.fillStyle='#b8c4d4';x.beginPath();x.arc(0,-6,7,0,7);x.fill();
const blink=Math.sin(t*3+rb.ph)>0?1:.3;
x.fillStyle='#ff3a3a';x.globalAlpha=blink;x.beginPath();x.arc(0,-6,3,0,7);x.fill();x.globalAlpha=1;
x.strokeStyle='#8a98ac';x.lineWidth=2;
x.beginPath();x.moveTo(-6,10);x.lineTo(-6,15);x.moveTo(6,10);x.lineTo(6,15);x.stroke();
x.restore()}
for(const b of bolts){
x.strokeStyle='#9bffe0';x.lineWidth=3;x.lineCap='round';
x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);x.stroke()}
for(const s of sparks){x.globalAlpha=Math.max(0,s.t*2);x.fillStyle='#6ef0b8';x.fillRect(s.x-1.5,s.y-1.5,3,3)}
x.globalAlpha=1;
if(!(inv>0&&Math.floor(inv*10)%2===0)){
x.save();x.translate(pl.x,pl.y);
const gl=x.createRadialGradient(0,0,4,0,0,26);gl.addColorStop(0,'rgba(110,240,184,.3)');gl.addColorStop(1,'rgba(110,240,184,0)');
x.fillStyle=gl;x.beginPath();x.arc(0,0,26,0,7);x.fill();
x.fillStyle='#f0f0e8';x.beginPath();x.ellipse(0,2,8,10,0,0,7);x.fill();
x.fillStyle='#f0d0b0';x.beginPath();x.arc(0,-8,5.6,0,7);x.fill();
x.fillStyle='#e8e0d0';x.beginPath();x.arc(0,-11,5,Math.PI,0);x.fill();
x.fillStyle='#20304a';x.fillRect(-4,-9.5,8,2.4);
x.fillStyle='#6ef0b8';x.fillRect(6,-2,7,3);
x.restore()}
if(roomFlash>0){
x.fillStyle='rgba(6,13,10,'+Math.min(1,roomFlash)*.9+')';x.fillRect(0,0,W,H);
x.globalAlpha=Math.min(1,roomFlash*1.6);
x.fillStyle='#6ef0b8';x.font='700 30px system-ui';x.textAlign='center';x.direction='rtl';
x.fillText('חדר '+room,W/2,H*.45);x.globalAlpha=1}
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw(ts/1000);requestAnimationFrame(loop)}
function setT(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;tx=t.clientX-r.left;ty=t.clientY-r.top}
cv.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;setT(e)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)setT(e)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();dragging=false},{passive:false});
window.addEventListener('keydown',e=>{const k=e.key,sp=14;
if(k==='ArrowLeft'){tx=pl.x-60;ty=pl.y}else if(k==='ArrowRight'){tx=pl.x+60;ty=pl.y}
else if(k==='ArrowUp'){ty=pl.y-60;tx=pl.x}else if(k==='ArrowDown'){ty=pl.y+60;tx=pl.x}});
window.setTarget=(nx,ny)=>{tx=nx;ty=ny};
Object.defineProperty(window,'score',{get:()=>score});Object.defineProperty(window,'run',{get:()=>run});
Object.defineProperty(window,'pl',{get:()=>pl});Object.defineProperty(window,'robots',{get:()=>robots});
Object.defineProperty(window,'room',{get:()=>room});Object.defineProperty(window,'exitOpen',{get:()=>exitOpen});
document.getElementById('startBtn').onclick=()=>{document.getElementById('startOvl').classList.add('hide');rs();start()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('overOvl').classList.add('hide');start()};
rs();pl={x:100,y:100,r:11};robots=[];bolts=[];walls=[];score=0;room=1;lives=3;run=false;inv=0;fireT=0;roomFlash=0;exitOpen=false;
requestAnimationFrame(loop);
</script>
</body>
</html>
