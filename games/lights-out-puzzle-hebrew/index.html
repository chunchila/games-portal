<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>כיבוי אורות - פאזל</title><style>*{margin:0;box-sizing:border-box}body{background:#10162b;color:#e9f0ff;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{margin:12px;font-size:24px;color:#ffd86b}#g{display:grid;grid-template-columns:repeat(5,60px);gap:8px;padding:12px;background:#1b2447;border-radius:18px;margin:10px}.l{width:60px;height:60px;border-radius:50%;background:#2a335c;box-shadow:inset 0 4px 8px #0008;cursor:pointer;transition:.15s}.l.on{background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23a 55%,#e69500);box-shadow:0 0 22px #ffd23a,inset 0 -4px 8px #b8650b}button{background:#ffd86b;color:#222;border:0;border-radius:14px;padding:10px 22px;font-size:17px;font-weight:800;margin:6px}p{opacity:.8;font-size:14px;margin:4px;text-align:center;max-width:300px}</style></head><body><h1>כיבוי אורות</h1><div>מהלכים: <b id="mv">0</b> · רמה: <b id="lv">1</b></div><div id="g"></div><p>לחיצה על נורה הופכת אותה ואת ארבע השכנות שלה. כבו את כל הנורות!</p><button id="r">רמה חדשה</button>
<script>
let B,mv=0,lv=1;
function tog(i){const r=i/5|0,c=i%5;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const R=r+a,C=c+b;if(R>=0&&R<5&&C>=0&&C<5)B[R*5+C]^=1})}
function init(){B=Array(25).fill(0);mv=0;const k=Math.min(3+lv,14);const used=new Set();while(used.size<k)used.add(Math.random()*25|0);used.forEach(tog);if(!B.some(v=>v))tog(12);draw()}
function draw(){g.innerHTML='';B.forEach((v,i)=>{const d=document.createElement('div');d.className='l'+(v?' on':'');d.onclick=()=>{tog(i);mv++;draw();if(!B.some(v=>v)){setTimeout(()=>{alert('כל הכבוד! פתרתם ב-'+mv+' מהלכים');lv++;init()},200)}};g.appendChild(d)});document.getElementById('mv').textContent=mv;document.getElementById('lv').textContent=lv}
r.onclick=init;init();
</script></body></html>
