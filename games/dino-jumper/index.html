<script>
(()=>{
'use strict';
/* ================= קבועים ================= */
const T=32,VW=640,VH=352,S=2,ROWS=11,GROUND=9;
const GRAV=0.55,JUMP=12.5,MAXV=3.3;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW*S;cv.height=VH*S;
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const touch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window)||qs.get('touch')==='1';
if(touch)document.body.classList.add('touch');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= שמירה (ArcadiaStorage) ================= */
const SAVE_KEY='dinush-hakfatzan-v1';
function loadSave(){
  const d={high:0,maxLevel:1,bones:0,wins:0,games:0};
  try{Object.assign(d,JSON.parse(ArcadiaStorage.getItem(SAVE_KEY)||'{}'));}catch(e){}
  return d;
}
let save=loadSave();
function persist(){try{ArcadiaStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ================= סאונד (נוצר בקוד, מקורי) ================= */
let AC=null,muted=false,gesture=false;
function ac(){
  if(!gesture)return null;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,vol,slide,delay){
  if(muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const sfx={
  jump:()=>tone(300,.2,'square',.04,420),
  coin:()=>{tone(988,.07,'square',.04);tone(1319,.16,'square',.04,0,.06)},
  bone:()=>{tone(523,.1,'triangle',.08);tone(784,.1,'triangle',.08,0,.09);tone(1047,.2,'triangle',.08,0,.18)},
  stomp:()=>tone(240,.14,'sawtooth',.06,-150),
  brick:()=>{tone(120,.12,'sawtooth',.07,-60);tone(80,.14,'square',.05,-30,.03)},
  bump:()=>tone(160,.08,'square',.05,-40),
  power:()=>{[392,494,587,784].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.07))},
  hurt:()=>tone(300,.3,'sawtooth',.07,-220),
  die:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.2,'square',.06,0,i*.14))},
  win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,0,i*.11))},
  boss:()=>{tone(110,.25,'sawtooth',.09,-40);tone(180,.2,'square',.06,200,.05)},
  life:()=>{[659,784,1319].forEach((f,i)=>tone(f,.12,'triangle',.08,0,i*.09))},
  throw:()=>tone(500,.12,'triangle',.04,-300)
};
/* מוזיקת רקע קצרה ומקורית */
const MEL=[392,0,494,0,587,494,0,392, 330,0,392,0,523,440,0,330, 294,0,370,0,440,370,0,294, 392,494,587,0,784,0,587,0];
const BAS=[196,196,165,165,147,147,196,196];
let mstep=0,musicOn=true;
setInterval(()=>{
  if(muted||!musicOn||!AC||state!=='play'||H&&H.mode!=='run')return;
  const n=MEL[mstep%MEL.length];
  if(n)tone(n,.17,'triangle',.028);
  if(mstep%4===0)tone(BAS[(mstep>>2)%BAS.length]/2,.4,'sine',.05);
  mstep++;
},170);

/* ================= קלט ================= */
const keys={left:false,right:false,jump:false};
let jumpBuf=0;
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'jump'};
addEventListener('keydown',e=>{
  gesture=true;
  const k=KMAP[e.code];
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();e.preventDefault();return;}
  if(e.code==='KeyM'){toggleMute();return;}
  if(state!=='play'&&state!=='pause'&&(e.code==='Enter'||e.code==='Space')){if(ovPrimary)ovPrimary();e.preventDefault();return;}
  if(state==='pause'&&(e.code==='Enter')){togglePause();return;}
  if(k){e.preventDefault();if(k==='jump'&&!keys.jump)jumpBuf=8;keys[k]=true;}
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k){keys[k]=false;e.preventDefault();}});
addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false;if(state==='play')togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
function bindBtn(id,k){
  const el=$(id);
  const on=e=>{e.preventDefault();gesture=true;try{el.setPointerCapture(e.pointerId);}catch(_){}if(k==='jump'&&!keys.jump)jumpBuf=8;keys[k]=true;el.classList.add('on');};
  const off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('tL','left');bindBtn('tR','right');bindBtn('tJ','jump');
addEventListener('pointerdown',()=>{gesture=true;},{passive:true});
$('bPause').onclick=()=>togglePause();
$('bMute').onclick=()=>toggleMute();
function toggleMute(){muted=!muted;$('bMute').textContent=muted?'צליל: כבוי':'צליל: פעיל';}

/* ================= בניית שלבים ================= */
function Lv(W,theme,o){
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(W).fill('.'));
  return Object.assign({W,g,theme,en:[],signs:[],cp:-1,flag:W-5,flagOpen:true},o||{});
}
function ground(l,gaps){
  for(let x=0;x<l.W;x++){
    if(gaps.some(([a,n])=>x>=a&&x<a+n))continue;
    l.g[9][x]='#';l.g[10][x]='#';
  }
}
function put(l,x,y,c){if(x>=0&&x<l.W&&y>=0&&y<ROWS)l.g[y][x]=c;}
function plat(l,x,y,s){[...s].forEach((c,i)=>{if(c!==' ')put(l,x+i,y,c);});}
function pipe(l,x,h){for(let i=0;i<h;i++){put(l,x,8-i,'P');put(l,x+1,8-i,'P');}}
function stairs(l,x,n,dir){for(let i=0;i<n;i++)for(let j=0;j<=i;j++)put(l,x+(dir<0?n-1-i:i),8-j,'X');}
function coins(l,x,y,n){for(let i=0;i<n;i++)put(l,x+i,y,'c');}
function arc(l,x,y,n){for(let i=0;i<n;i++){const k=i-(n-1)/2;put(l,x+i,Math.round(y+Math.abs(k)*0.9),'c');}}
function en(l,t,x,y){l.en.push({t,x,y:y===undefined?8:y});}
function sign(l,x,text){l.signs.push({x,text});}

const LEVELS=[
{ name:'גן הפלאפל', tag:'הכול מטוגן, כלום לא קל', tip:'פלאפלון נראה רגוע, אבל הוא על סף סיר. דרכו עליו מלמעלה!',
  build(){
    const l=Lv(100,0,{cp:50,flag:96});
    ground(l,[[28,3],[55,3],[76,3]]);
    sign(l,6,'חצים לזוז · רווח לקפוץ');
    sign(l,14,'קפצו על הפלאפלון, לא להיפך!');
    sign(l,22,'לבנים נשברים מלמטה');
    plat(l,10,6,'B?B?B');coins(l,10,5,5);
    en(l,'e',18);en(l,'e',25);
    arc(l,28,7,3);
    plat(l,33,6,'?S?');
    en(l,'e',38);en(l,'e',42);
    pipe(l,45,2);en(l,'e',49);
    plat(l,52,6,'B');
    put(l,56,5,'b');            // עצם 1 מעל הבור
    coins(l,54,7,1);coins(l,58,7,1);
    plat(l,62,6,'BBB');plat(l,66,3,'XXX');put(l,67,2,'b'); // עצם 2
    en(l,'e',61);en(l,'e',70);en(l,'e',73);
    arc(l,76,7,3);
    plat(l,80,6,'B?B');coins(l,80,5,3);
    en(l,'e',83);
    pipe(l,85,3);put(l,86,5,'b'); // עצם 3
    stairs(l,89,4);
    return l;
  }},
{ name:'מערת הבירוקרטים', tag:'כאן כל פתח דורש אישור משלוש חותמות', tip:'קיפוד שניצל דוקרני מכל כיוון: לא לדרוך! יתושי בירוקרטיה אפשר לדרוך. הם יחזרו מחר.',
  build(){
    const l=Lv(130,1,{cp:62,flag:126});
    ground(l,[[16,3],[40,4],[64,4],[92,6]]);
    sign(l,5,'אזהרה: קיפוד שניצל. לא לדרוך!');
    sign(l,30,'יתוש בירוקרט: "תחזור מחר"');
    en(l,'e',10);en(l,'k',13);
    plat(l,20,6,'B?B');coins(l,20,5,3);
    en(l,'k',24);en(l,'e',28);
    plat(l,26,6,'?S?B');
    en(l,'f',33,5);
    plat(l,36,6,'BBB');plat(l,41,6,'XX');put(l,41,5,'b'); // עצם 1 מעל הבור
    en(l,'e',47);en(l,'k',50);en(l,'e',52);
    pipe(l,54,2);pipe(l,58,3);
    en(l,'f',56,4);
    arc(l,64,7,4);
    plat(l,68,6,'B?B?B');coins(l,68,5,5);
    en(l,'k',70);en(l,'e',74);en(l,'f',77,5);
    plat(l,80,6,'BB');plat(l,83,4,'XXX');plat(l,87,6,'BB');put(l,84,3,'b'); // עצם 2
    en(l,'e',82);en(l,'k',85);
    plat(l,95,7,'XX');plat(l,99,6,'XX');
    coins(l,95,6,2);coins(l,99,5,2);
    plat(l,103,6,'?');put(l,102,3,'b'); // עצם 3 גבוה
    plat(l,101,5,'X');
    en(l,'e',106);en(l,'k',109);en(l,'f',112,5);en(l,'e',115);
    pipe(l,117,2);en(l,'e',120);
    stairs(l,121,3);
    return l;
  }},
{ name:'הר הגעש של השווארמה', tag:'חם פה. אפילו השיפוד לא מאמין', tip:'לבה שורפת. פלטפורמות קטנות, בורות רחבים, וכל האויבים מגיעים בבת אחת.',
  build(){
    const l=Lv(150,2,{cp:70,flag:146});
    ground(l,[[14,3],[34,4],[52,5],[72,4],[96,6],[118,4]]);
    sign(l,4,'הלבה אמיתית. אל תנסו בבית');
    en(l,'e',8);en(l,'k',11);
    plat(l,17,6,'B?B');
    en(l,'e',20);en(l,'k',24);en(l,'f',27,5);
    plat(l,28,6,'?S?');
    arc(l,34,7,4);

const ENEMY={e:{w:26,h:24,sp:.8,stomp:true},k:{w:28,h:22,sp:.6,stomp:false},f:{w:26,h:20,sp:0,stomp:true}};

/* ================= فيזיקה ================= */
function solidAt(tx,ty){
  if(tx<0||tx>=L.W)return true;
  if(ty<0||ty>=ROWS)return false;
  const c=L.g[ty][tx];
  return c==='#'||c==='B'||c==='?'||c==='S'||c==='U'||c==='X'||c==='P';
}
function moveX(b){
  b.hitX=0;b.x+=b.vx;
  const y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-.01)/T);
  if(b.vx>0){const tx=Math.floor((b.x+b.w-.01)/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){b.x=tx*T-b.w;b.vx=0;b.hitX=1;break;}}
  else if(b.vx<0){const tx=Math.floor(b.x/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){b.x=(tx+1)*T;b.vx=0;b.hitX=-1;break;}}
}
function moveY(b,isHero){
  b.y+=b.vy;b.onGround=false;
  const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-.01)/T);
  if(b.vy>=0){
    const ty=Math.floor((b.y+b.h-.01)/T);
    for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)&&b.y+b.h-b.vy<=ty*T+.5+Math.max(0,b.vy)){b.y=ty*T-b.h;b.vy=0;b.onGround=true;break;}
  }else{
    const ty=Math.floor(b.y/T);let best=-1,bd=1e9;
    for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){const d=Math.abs(tx*T+T/2-(b.x+b.w/2));if(d<bd){bd=d;best=tx;}}
    if(best>=0){b.y=(ty+1)*T;b.vy=0;if(isHero)bumpTile(best,ty);}
  }
}
function overlap(a,b,p){p=p||0;return a.x+p<b.x+b.w&&a.x+a.w-p>b.x&&a.y+p<b.y+b.h&&a.y+a.h-p>b.y;}

/* ================= אפקטים ================= */
function burst(x,y,col,n,sp){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-1,1)*(sp||3),vy:rnd(-1,.2)*(sp||3)-1,life:rnd(25,50),max:50,col:Array.isArray(col)?pick(col):col,s:rnd(2,5)});}
function say(x,y,txt,col){texts.push({x,y,txt,col:col||'#fff',t:0});}
let toastT=0;
function toast(txt,ms){const el=$('toast');el.textContent=txt;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms||1400);}
const STOMP_TXT=['פוצץ!','בתאבון!','וואלה!','בום טישו','שוקה!','קפוץ-קפוץ!','עוד אחד נשבר','סחתיין!'];
const DEATH_TXT=['אאוץ\'! זה היה פלאפל קשוח','אפילו טירנוזאורוס נפל פעם','נפלנו. נקום. נקפוץ','הדינוש מתנצל. ננסה שוב','זה לא באג, זה אתגר אישי'];

function scoreAdd(n){G.score+=n;}

function bumpTile(tx,ty){
  const c=L.g[ty][tx];
  bumps.push({x:tx,y:ty,t:0});
  if(c==='?'){L.g[ty][tx]='U';parts.push({x:tx*T+16,y:ty*T-4,vx:0,vy:-7,life:22,max:22,col:'#ffd23f',s:7,coin:true});addCoin();sfx.bump();killOn(tx,ty);}
  else if(c==='S'){L.g[ty][tx]='U';items.push({t:'pw',x:tx*T+4,y:(ty-1)*T+4,w:24,h:24,vx:1.1,vy:-3.5,spawn:0,onGround:false,ph:0});sfx.bump();say(tx*T+16,ty*T-10,'סופגנייה!','#ffe58a');killOn(tx,ty);}
  else if(c==='B'){L.g[ty][tx]='.';burst(tx*T+16,ty*T+16,['#d9722f','#a9501b','#f3a15a'],14,4);scoreAdd(50);sfx.brick();killOn(tx,ty);}

function killOn(tx,ty){
  enemies.forEach(e=>{if(!e.dead&&e.x+e.w>tx*T&&e.x<tx*T+T&&Math.abs(e.y+e.h-ty*T)<6)killEnemy(e,'bump');});
}
function killEnemy(e,how){

}
function hurt(){

function die(){

function updateHero(){
  const h=H;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  const acc=h.onGround?.6:.38;
  if(dir){h.vx+=dir*acc;h.face=dir;}
  else{h.vx*=h.onGround?.78:.96;if(Math.abs(h.vx)<.05)h.vx=0;}
  h.vx=clamp(h.vx,-MAXV,MAXV);
  if(h.onGround)h.coy=7;else if(h.coy>0)h.coy--;
  if(jumpBuf>0)jumpBuf--;
  if(jumpBuf>0&&h.coy>0){h.vy=-JUMP;h.coy=0;jumpBuf=0;h.jumping=true;h.onGround=false;sfx.jump();}
  if(h.jumping&&!keys.jump&&h.vy<-4.5)h.vy=-4.5;
  if(h.vy>=0)h.jumping=false;
  h.vy=Math.min(h.vy+GRAV,13);
  moveX(h);moveY(h,true);
  if(L.locked&&h.x<L.camMin+T*1.2&&false){}
  if(h.onGround)h.anim+=Math.abs(h.vx)*.2;
  if(h.inv>0)h.inv--;
  h.blink=(h.blink+1)%240;
  if(h.y>VH+60)die();
  if(!cpReached&&L.cp>0&&h.x>L.cp*T){cpReached=true;toast('נקודת ביקורת!',900);sfx.life();}
  if(L.boss&&!L.locked&&h.x>(L.arena+2)*T){
    L.locked=true;L.camMin=(L.arena-1)*T;
    for(let y=0;y<=8;y++)L.g[y][L.arena-1]='X';
    toast('הפקיד הראשי: "חסר לך טופס 17!"',2200);sfx.boss();
  }
  // דגל
  if(L.flagOpen&&h.x+h.w>L.flag*T+8&&h.x<L.flag*T+22&&h.mode==='run')levelClear();
}
function updateEnemies(){
  for(const e of enemies){
    if(e.dead){e.deadT++;if(e.how==='bump'){e.vy+=.5;e.y+=e.vy;e.x+=e.vx;}continue;}
    if(!e.act){if(e.x<cam.x+VW+60)e.act=true;else continue;}
    e.anim+=.15;e.t0++;
    if(e.t==='f'){
      const px=e.x;e.x=e.x0+Math.sin(e.t0*.02)*80;e.y=e.y0+Math.sin(e.t0*.07)*16+4;e.dir=e.x>px?1:-1;continue;
    }
    e.vx=e.dir*e.sp;e.vy=Math.min(e.vy+GRAV,10);
    moveX(e);if(e.hitX)e.dir=-e.dir;
    moveY(e,false);
    if(e.onGround){
      const fx=e.dir>0?e.x+e.w+2:e.x-2,ty=Math.floor((e.y+e.h+2)/T);
      if(!solidAt(Math.floor(fx/T),ty)&&e.t!=='x')e.dir=-e.dir;
    }
    if(e.y>VH+80)e.dead=true,e.deadT=99;
  }
  enemies=enemies.filter(e=>!(e.dead&&e.deadT>(e.how==='bump'?90:28)));
}
function heroVsEnemies(){
  if(H.mode!=='run')return;
  for(const e of enemies){
    if(e.dead||!e.act)continue;
    if(!overlap(H,e,3))continue;
    const falling=H.vy>0.5&&(H.y+H.h)-e.y<22;
    if(falling&&e.stomp){
      killEnemy(e,'stomp');H.vy=keys.jump?-11.5:-8;H.jumping=keys.jump;sfx.stomp();
    }else if(falling&&!e.stomp){
      hurt();
    }else hurt();
  }
}
function updateItems(){
  for(const it of items){
    if(it.got)continue;
    if(it.t==='pw'){
      it.vy=Math.min(it.vy+GRAV*.7,8);it.x+=it.vx;
      const b={x:it.x,y:it.y,w:it.w,h:it.h,vx:it.vx,vy:it.vy};
      const ty0=Math.floor(b.y/T),ty1=Math.floor((b.y+b.h-.01)/T);
      const tx=Math.floor((it.vx>0?b.x+b.w:b.x)/T);
      for(let ty=ty0;ty<=ty1;ty++)if(solidAt(tx,ty)){it.vx=-it.vx;it.x+=it.vx*2;break;}
      it.y+=it.vy;
      const x0=Math.floor(it.x/T),x1=Math.floor((it.x+it.w-.01)/T),fy=Math.floor((it.y+it.h)/T);
      for(let x=x0;x<=x1;x++)if(solidAt(x,fy)&&it.vy>=0){it.y=fy*T-it.h;it.vy=0;break;}
      if(it.y>VH+50)it.got=true;
    }
    if(H.mode==='run'&&overlap(H,it,-2)){
      it.got=true;
      if(it.t==='c')addCoin();
      else if(it.t==='b'){bonesGot++;scoreAdd(500);sfx.bone();say(it.x,it.y-6,'עצם! '+bonesGot+'/'+levelBones,'#fff');burst(it.x+10,it.y+10,['#fff','#ffe58a'],10,3);}
      else if(it.t==='pw'){H.shield=true;scoreAdd(500);sfx.power();say(H.x,H.y-14,'מתוק! מגן סוכר','#ffe58a');burst(H.x+10,H.y+10,['#fff','#ffb6d0','#ffe58a'],14,3);}
    }
  }
  items=items.filter(i=>!i.got);
}
function updateBoss(){
  const b=boss;if(!b)return;
  if(b.dead){b.deadT++;if(b.deadT%5===0)burst(b.x+rnd(0,b.w),b.y+rnd(0,b.h),['#fff','#f4f0d8','#c8c0a0'],4,4);if(b.deadT>80)boss=null;return;}
  if(!L.locked)return;
  b.t++;if(b.inv>0)b.inv--;
  const rage=3-b.hp;
  const dir=Math.sign((H.x+H.w/2)-(b.x+b.w/2))||b.face;
  if(b.stun>0){b.stun--;b.vx*=.8;}
  else{
    b.vx=dir*(.9+rage*.55);b.face=dir;
    if(b.onGround&&b.t%(210-rage*35)===0){b.vy=-11.5;b.vx=dir*(2+rage*.5);}
    b.throwT--;
    if(b.throwT<=0&&H.mode==='run'){
      b.throwT=150-rage*30;sfx.throw();
      const hi=Math.random()<.4;
      projs.push({x:b.x+(b.face>0?b.w:-18),y:hi?b.y+8:b.y+b.h-26,w:18,h:22,vx:b.face*(2.4+rage*.5),rot:0});
    }
  }
  b.vy=Math.min(b.vy+GRAV,12);
  moveX(b);moveY(b,false);
  if(H.mode==='run'&&overlap(H,b,4)){
    if(H.vy>0.5&&(H.y+H.h)-b.y<30&&b.inv===0){

  if(state!=='play')return;

  }

  // רגליים
  ctx.fillStyle='#2f8f48';
  ctx.beginPath();ctx.ellipse(-5+sw,-3,5,5,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(5-sw,-3,5,5,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-5+sw+3,-1,3,2);ctx.fillRect(5-sw+3,-1,3,2);
  // גוף
  ctx.fillStyle='#4cc86a';ctx.beginPath();ctx.ellipse(0,-17,14,13,0,0,7);ctx.fill();
  ctx.fillStyle='#d3f5a8';ctx.beginPath();ctx.ellipse(4,-14,8,9,0,0,7);ctx.fill();
  // קוצים
  ctx.fillStyle='#ff9a2e';
  for(let i=0;i<4;i++){const a=2.6-i*.35,bx=Math.cos(a)*13,by=-17-Math.sin(a)*12;ctx.beginPath();ctx.moveTo(bx-3,by+2);ctx.lineTo(bx-1+(i-1.5)*.6,by-8);ctx.lineTo(bx+4,by+1);ctx.fill();}
  // יד
  ctx.fillStyle='#3fae5a';ctx.beginPath();ctx.ellipse(8,-15+Math.sin(anim)*1.5,4,3,0,0,7);ctx.fill();
  // ראש
  ctx.fillStyle='#4cc86a';ctx.beginPath();ctx.ellipse(9,-27,12,10,0,0,7);ctx.fill();
  ctx.fillStyle='#6ee08a';ctx.beginPath();ctx.ellipse(16,-24,7,5,0,0,7);ctx.fill();
  // סרט ראש
  ctx.fillStyle='#e8344e';ctx.beginPath();ctx.moveTo(-1,-31);ctx.quadraticCurveTo(8,-40,19,-32);ctx.lineTo(18,-29);ctx.quadraticCurveTo(8,-36,0,-28);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(-8,-27);ctx.lineTo(-5,-32);ctx.lineTo(-9,-34);ctx.fill();
  // עין
  const bl=(blink<6);
  if(bl){ctx.strokeStyle='#123';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(8,-29);ctx.lineTo(15,-29);ctx.stroke();}
  else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(11.5,-29,4.8,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(13.2,-28.6,2.4,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(13.5,-30,1.4,1.4);}
  if(dead){ctx.strokeStyle='#111';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(8,-32);ctx.lineTo(15,-26);ctx.moveTo(15,-32);ctx.lineTo(8,-26);ctx.stroke();}
  // חיוך ואף
  ctx.strokeStyle='#17512a';ctx.lineWidth=1.6;ctx.beginPath();
  if(airborne){ctx.ellipse(18,-22,2.5,3,0,0,7);}else{ctx.arc(15,-23.5,4.5,.2,2.4);}
  ctx.stroke();
  ctx.fillStyle='#17512a';ctx.fillRect(21,-27,2,2);
  ctx.fillStyle='#ff8aa8aa';ctx.beginPath();ctx.ellipse(8,-23,3,2,0,0,7);ctx.fill();
  ctx.restore();
}
function drawBoss(b,cx){
  const x=b.x-cx+b.w/2,y=b.y+b.h;
  ctx.save();ctx.translate(x,y);
  if(b.dead){ctx.globalAlpha=Math.max(0,1-b.deadT/80);ctx.rotate(Math.sin(b.deadT*.4)*.1);}
  if(b.inv>0&&Math.floor(b.inv/5)%2===0)ctx.globalAlpha=.45;
  ctx.scale(b.face<0?1:-1,1);
  const w=Math.sin(b.t*.2)*(b.onGround&&Math.abs(b.vx)>.1?4:0);
  // רגליים
  ctx.fillStyle='#1f2433';ctx.fillRect(-20+w,-14,16,14);ctx.fillRect(4-w,-14,16,14);
  ctx.fillStyle='#10131e';ctx.fillRect(-24+w,-5,22,5);ctx.fillRect(2-w,-5,22,5);
  // חליפה
  ctx.fillStyle='#5a6882';ctx.beginPath();ctx.moveTo(-26,-12);ctx.lineTo(-22,-56);ctx.quadraticCurveTo(0,-62,22,-56);ctx.lineTo(26,-12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-7,-58);ctx.lineTo(7,-58);ctx.lineTo(0,-30);ctx.fill();
  ctx.fillStyle='#d12b2b';ctx.beginPath();ctx.moveTo(-3,-55);ctx.lineTo(3,-55);ctx.lineTo(5,-36);ctx.lineTo(0,-30);ctx.lineTo(-5,-36);ctx.fill();
  ctx.fillStyle='#ffffff25';ctx.fillRect(-20,-52,6,34);
  // כפתורים
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(-14,-30,2,0,7);ctx.arc(-14,-22,2,0,7);ctx.fill();
  // זרוע וחותמת
  ctx.save();ctx.translate(-26,-44);ctx.rotate(-.5+Math.sin(b.t*.12)*.3);
  ctx.fillStyle='#5a6882';ctx.fillRect(-16,-5,18,10);
  ctx.fillStyle='#f0c7a0';ctx.beginPath();ctx.arc(-18,0,6,0,7);ctx.fill();
  ctx.fillStyle='#7a2020';ctx.fillRect(-26,-18,16,10);ctx.fillStyle='#3a1010';ctx.fillRect(-23,-8,10,6);
  ctx.restore();
  // ראש
  ctx.fillStyle='#f0c7a0';ctx.beginPath();ctx.ellipse(0,-72,20,19,0,0,7);ctx.fill();
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.moveTo(-18,-78);ctx.quadraticCurveTo(-4,-96,18,-80);ctx.quadraticCurveTo(0,-86,-18,-78);ctx.fill();
  ctx.strokeStyle='#3a2a1a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-14,-82);ctx.quadraticCurveTo(0,-92,14,-83);ctx.stroke();
  // משקפיים
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-73,7,0,7);ctx.arc(8,-73,7,0,7);ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-8,-73,7,0,7);ctx.moveTo(1,-73);ctx.lineTo(1,-73);ctx.arc(8,-73,7,0,7);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-9.5,-72,2.5,0,7);ctx.arc(6.5,-72,2.5,0,7);ctx.fill();
  const angry=b.stun>0;
  ctx.strokeStyle='#2a1a0a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-16,angry?-84:-82);ctx.lineTo(-3,angry?-79:-77);ctx.moveTo(16,angry?-84:-82);ctx.lineTo(3,angry?-79:-77);ctx.stroke();
  // שפם ופה
  ctx.fillStyle='#3a2a1a';ctx.beginPath();ctx.ellipse(-6,-62,7,3,.2,0,7);ctx.ellipse(6,-62,7,3,-.2,0,7);ctx.fill();
  ctx.strokeStyle='#7a2020';ctx.lineWidth=2;ctx.beginPath();
  if(angry)ctx.arc(0,-52,6,0,Math.PI);else ctx.arc(0,-50,6,Math.PI+.4,-.4);
  ctx.stroke();
  ctx.restore();
}
function drawProj(p,cx){
  ctx.save();ctx.translate(p.x-cx+p.w/2,p.y+p.h/2);ctx.rotate(p.rot);
  ctx.fillStyle='#fff';ctx.fillRect(-9,-11,18,22);ctx.strokeStyle='#8a8a9a';ctx.lineWidth=1;ctx.strokeRect(-9,-11,18,22);
  ctx.fillStyle='#8a8aa0';for(let i=0;i<4;i++)ctx.fillRect(-6,-7+i*5,12,1.5);
  ctx.fillStyle='#d12b2b';ctx.fillRect(-6,6,5,3);
  ctx.restore();
}
function drawSign(s,cx){
  const px=s.x*T-cx+T/2,py=GROUND*T;
  if(px<-200||px>VW+200)return;
  ctx.font='bold 11px "Rubik",system-ui,sans-serif';ctx.direction='rtl';ctx.textAlign='center';
  const w=Math.max(46,ctx.measureText(s.text).width+14);
  ctx.fillStyle='#6a4318';ctx.fillRect(px-3,py-22,6,22);
  ctx.fillStyle='#c98f46';ctx.fillRect(px-w/2,py-50,w,28);
  ctx.strokeStyle='#6a4318';ctx.lineWidth=2;ctx.strokeRect(px-w/2,py-50,w,28);
  ctx.fillStyle='#3a2208';ctx.fillText(s.text,px,py-32);
}
function drawFlag(cx){
  const px=L.flag*T-cx+T/2-2,py=GROUND*T;
  if(px<-60||px>VW+60)return;
  if(!L.flagOpen){ctx.fillStyle='#ffffff30';ctx.fillRect(px-2,py-150,4,150);return;}
  ctx.fillStyle='#d8dcee';ctx.fillRect(px,py-150,4,150);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(px+2,py-152,5,0,7);ctx.fill();
  const fy=py-142+flagAnim*100;
  ctx.fillStyle='#e8344e';ctx.beginPath();ctx.moveTo(px+4,fy);ctx.lineTo(px+46,fy+14+Math.sin(frameN*.1)*2);ctx.lineTo(px+4,fy+30);ctx.fill();
  ctx.fillStyle='#fff';ctx.save();ctx.translate(px+20,fy+15);ctx.rotate(-.5);ctx.fillRect(-8,-1.5,16,3);
  [[-9,-2],[-9,2],[9,-2],[9,2]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,2.4,0,7);ctx.fill();});ctx.restore();
}
function drawCp(cx){
  if(L.cp<0)return;
  const px=L.cp*T-cx+T/2,py=GROUND*T;
  if(px<-40||px>VW+40)return;
  ctx.fillStyle='#d8dcee';ctx.fillRect(px-2,py-60,4,60);
  ctx.fillStyle=cpReached?'#4cc86a':'#ffd23f';ctx.beginPath();ctx.moveTo(px+2,py-60);ctx.lineTo(px+26,py-52);ctx.lineTo(px+2,py-42);ctx.fill();
}
function render(){
  ctx.setTransform(S,0,0,S,0,0);
  ctx.imageSmoothingEnabled=true;
  const cx=state==='title'?titleCam:Math.round(cam.x);
  if(!L)return;
  drawBG(L.theme,cx);
  drawTiles(L.theme,cx);
  L.signs.forEach(s=>drawSign(s,cx));
  drawCp(cx);drawFlag(cx);
  items.forEach(i=>drawItem(i,cx));
  enemies.forEach(e=>{if(e.x-cx>-60&&e.x-cx<VW+60)drawEnemy(e,cx);});
  if(boss)drawBoss(boss,cx);
  projs.forEach(p=>drawProj(p,cx));
  if(state==='title'){drawDino(150,H.y+28,1,H.anim,false,true,0,false,100);}
  else drawDino(H.x+H.w/2-cx,H.y+H.h,H.face,H.anim,!H.onGround,H.shield,H.inv,H.mode==='dead',H.blink);
  parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.col;
    if(p.coin){ctx.beginPath();ctx.ellipse(p.x-cx,p.y,5,7,0,0,7);ctx.fill();}
    else ctx.fillRect(p.x-cx,p.y,p.s,p.s);ctx.globalAlpha=1;});
  ctx.font='bold 13px "Rubik",system-ui,sans-serif';ctx.direction='rtl';ctx.textAlign='center';
  texts.forEach(t=>{ctx.globalAlpha=Math.min(1,(55-t.t)/20);ctx.lineWidth=3;ctx.strokeStyle='#000b';ctx.strokeText(t.txt,t.x-cx,t.y);ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x-cx,t.y);ctx.globalAlpha=1;});
  // בר חיים לבוס
  if(boss&&L.locked&&!boss.dead&&state!=='title'){
    const w=200,x=VW/2-w/2,y=VH-26;
    ctx.fillStyle='#000a';ctx.fillRect(x-3,y-3,w+6,18);
    for(let i=0;i<3;i++){ctx.fillStyle=i<boss.hp?'#e8344e':'#442';ctx.fillRect(x+i*(w/3)+2,y,w/3-4,12);}
    ctx.font='bold 11px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('הפקיד הראשי',VW/2,y-7);
  }
  // תנועת מצלמה בכותרת
  if(state==='title')ctx.fillStyle='#0000';
}
function drawTitleHero(){}

/* ================= לולאה ראשית ================= */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  render();
  requestAnimationFrame(frame);
}
function resize(){
  const w=innerWidth,h=innerHeight,portrait=h>w;
  document.body.classList.toggle('portrait',portrait);
  const ctrl=touch&&portrait?Math.min(190,Math.round(h*.27)):0;
  let sc=Math.min(w/VW,(h-ctrl)/VH);sc=Math.max(.3,sc);
  const sw=Math.floor(VW*sc),sh=Math.floor(VH*sc);
  cv.style.width=sw+'px';cv.style.height=sh+'px';
  const st=$('stage');st.style.width=sw+'px';st.style.height=sh+'px';
  st.style.top=Math.max(0,Math.floor((h-ctrl-sh)/2))+'px';
  document.documentElement.style.setProperty('--u',sc+'px');
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();
G={level:0,lives:3,score:0,coins:0};
showTitle();
$('hud').style.visibility='hidden';
requestAnimationFrame(frame);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* עזרי בדיקה (לא משפיעים על המשחק) */
window.__dino={
  get state(){return state;},get G(){return G;},get H(){return H;},get L(){return L;},
  get enemies(){return enemies;},get items(){return items;},get boss(){return boss;},get save(){return save;},
  keys,update,loadLevel:(i)=>{G.level=i;loadLevel(i,false);state='play';hideOv();},
  start:(i)=>{newGame(i||0);hideOv();loadLevel(G.level,false);state='play';},
  press:()=>{jumpBuf=8;keys.jump=true;},
  cam
};
})();
