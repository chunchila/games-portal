<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>אסטרואידים</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#05070f;color:#e8eeff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;user-select:none}
header{width:100%;max-width:520px;padding:11px 16px 2px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
h1{font-size:20px;color:#93c5fd}
#hud{font-size:12px;background:#ffffff14;padding:6px 10px;border-radius:14px;display:flex;gap:8px;font-weight:700;flex-wrap:wrap}
#msg{font-size:13.5px;color:#8b98b8;min-height:19px;padding:2px 8px}
#wrap{width:100%;max-width:520px;padding:0 8px}
canvas{width:100%;display:block;border-radius:14px;background:#070b18;touch-action:none}
#ctl{width:100%;max-width:520px;display:flex;gap:8px;padding:8px}
#ctl button{flex:1;padding:14px 0;font-size:16px;font-weight:800;border:none;border-radius:14px;cursor:pointer;color:#fff}
#rotL{background:#1e3a8a}#rotR{background:#1e3a8a}
#thrustB{background:linear-gradient(135deg,#f97316,#ea580c);color:#431407}
#fireB{background:linear-gradient(135deg,#ef4444,#b91c1c)}
#ctl button:active{filter:brightness(1.2)}
.ov{position:fixed;inset:0;background:#05070fe8;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.card{background:#101830;border:2px solid #60a5fa55;border-radius:22px;padding:26px 22px;text-align:center;max-width:340px;width:100%}
.card h2{color:#93c5fd;font-size:26px;margin-bottom:10px}
.card p{color:#c3cee8;font-size:14px;line-height:1.6;margin-bottom:18px}
.card button{padding:14px 40px;font-size:17px;font-weight:800;border:none;border-radius:14px;background:linear-gradient(135deg,#60a5fa,#2563eb);color:#0b1c3f;cursor:pointer}
.hide{display:none!important}
</style>
</head>
<body>
<header><h1>אסטרואידים</h1><div id="hud"><span id="score">0</span><span id="lives">♥♥♥</span><span id="wave">גל 1</span><span id="best">שיא: 0</span></div></header>
<div id="msg">סובבו, האיצו וירו באסטרואידים לפני שהם פוגעים בכם</div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ctl"><button id="rotL">⟲</button><button id="thrustB">מנוע</button><button id="rotR">⟳</button><button id="fireB">ירי</button></div>
<div class="ov" id="ovS"><div class="card"><h2>אסטרואידים</h2><p>החזיקו מנוע כדי להאיץ, החצים כדי לסובב, וירי כדי לפוצץ אסטרואידים. אסטרואידים גדולים מתפצלים לקטנים. נקו את כל הגל!</p><button id="startBtn">התחל</button></div></div>
<div class="ov hide" id="ovE"><div class="card"><h2>נגמר המשחק</h2><p id="ovP"></p><button id="againB">שחקו שוב</button></div></div>
<script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d');x.direction='ltr';
const W=390,H=520;c.width=W;c.height=H;
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');
let best=+(localStorage.getItem('asteroids_best')||0);bestEl.textContent='שיא: '+best;
let ship,rocks,bullets,parts,score,lives,wave,run,invuln,keys,stars;
const rnd=(a,b)=>a+Math.random()*(b-a);
function mkStars(){stars=[];for(let i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.4})}
function spawnWave(n){
  rocks=[];
  for(let i=0;i<3+n;i++){
    const sz=rnd(34,46);let rx,ry;
    do{rx=rnd(0,W);ry=rnd(0,H)}while(Math.hypot(rx-ship.x,ry-ship.y)<120);
    const verts=[];const nv=9+Math.floor(Math.random()*4);
    for(let v=0;v<nv;v++)verts.push(rnd(0.72,1.25));
    rocks.push({x:rx,y:ry,vx:rnd(-0.8,0.8),vy:rnd(-0.8,0.8),sz,verts,rot:rnd(0,6),vr:rnd(-0.02,0.02)});
  }
}
function reset(){
  ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2};
  rocks=[];bullets=[];parts=[];score=0;lives=3;wave=1;invuln=120;
  keys={l:false,r:false,t:false};
  spawnWave(1);mkStars();
  scoreEl.textContent='0';livesEl.textContent='♥♥♥';waveEl.textContent='גל 1';
}
function wrap(o){if(o.x<-50)o.x+=W+100;if(o.x>W+50)o.x-=W+100;if(o.y<-50)o.y+=H+100;if(o.y>H+50)o.y-=H+100}
function boom(r){for(let i=0;i<12;i++)parts.push({x:r.x,y:r.y,vx:rnd(-2.4,2.4),vy:rnd(-2.4,2.4),life:30,col:'#fbbf24'})}
function split(r){
  score+=r.sz>30?20:r.sz>16?50:100;scoreEl.textContent=score;
  if(score>best){best=score;localStorage.setItem('asteroids_best',best);bestEl.textContent='שיא: '+best}
  boom(r);
  if(r.sz>16){
    for(let k=0;k<2;k++){
      const verts=[];const nv=8+Math.floor(Math.random()*3);
      for(let v=0;v<nv;v++)verts.push(rnd(0.72,1.25));
      rocks.push({x:r.x,y:r.y,vx:r.vx+rnd(-1,1),vy:r.vy+rnd(-1,1),sz:r.sz/2.1,verts,rot:rnd(0,6),vr:rnd(-0.03,0.03)});
    }
  }
}
function hitShip(){
  if(invuln>0)return;
  for(let i=0;i<16;i++)parts.push({x:ship.x,y:ship.y,vx:rnd(-3,3),vy:rnd(-3,3),life:34,col:'#f87171'});
  lives--;livesEl.textContent='♥'.repeat(Math.max(0,lives))||'-';
  if(lives<=0){gameOver();return}
  ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;invuln=140;
}
function gameOver(){run=false;
  document.getElementById('ovP').textContent='צברתם '+score+' נקודות ב-'+wave+' גלים. שיא: '+best+'.';
  document.getElementById('ovE').classList.remove('hide');msg.textContent='שחקו שוב כדי לשבור את השיא'}
function drawShip(){
  x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);
  const blink=invuln>0&&Math.floor(invuln/6)%2===0;
  x.globalAlpha=blink?0.35:1;
  if(keys.t){x.fillStyle='#fb923c';x.beginPath();x.moveTo(-6,8);x.lineTo(0,14+Math.random()*7);x.lineTo(6,8);x.fill()}
  x.fillStyle='#60a5fa';x.beginPath();x.moveTo(16,0);x.lineTo(-10,-10);x.lineTo(-6,0);x.lineTo(-10,10);x.closePath();x.fill();
  x.fillStyle='#dbeafe';x.beginPath();x.arc(2,0,3.6,0,7);x.fill();
  x.globalAlpha=1;x.restore();
}
function loop(){
  if(!run)return;
  if(keys.l)ship.a-=0.07;if(keys.r)ship.a+=0.07;
  if(keys.t){ship.vx+=Math.cos(ship.a)*0.09;ship.vy+=Math.sin(ship.a)*0.09}
  ship.vx*=0.995;ship.vy*=0.995;ship.x+=ship.vx;ship.y+=ship.vy;wrap(ship);
  if(invuln>0)invuln--;
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);if(b.life<=0)bullets.splice(i,1)}
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];r.x+=r.vx;r.y+=r.vy;r.rot+=r.vr;wrap(r);
    if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.sz*0.85+10){hitShip()}
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.hypot(r.x-b.x,r.y-b.y)<r.sz*0.9){bullets.splice(j,1);split(r);rocks.splice(i,1);break}
    }
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)parts.splice(i,1)}
  if(run&&rocks.length===0){wave++;waveEl.textContent='גל '+wave;msg.textContent='גל '+wave+'!';spawnWave(wave);invuln=Math.max(invuln,90)}
  // draw
  x.fillStyle='#070b18';x.fillRect(0,0,W,H);
  x.fillStyle='#cbd5e1';for(const s of stars){x.globalAlpha=s.s/2;x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;
  for(const p of parts){x.globalAlpha=p.life/34;x.fillStyle=p.col;x.fillRect(p.x-2,p.y-2,4,4)}x.globalAlpha=1;
  for(const r of rocks){
    x.save();x.translate(r.x,r.y);x.rotate(r.rot);
    x.beginPath();
    for(let v=0;v<r.verts.length;v++){const a=v/r.verts.length*Math.PI*2;const rr=r.sz*r.verts[v];v?x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):x.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}
    x.closePath();x.fillStyle='#475569';x.fill();x.strokeStyle='#94a3b8';x.lineWidth=2;x.stroke();
    x.restore();
  }
  x.fillStyle='#f8fafc';for(const b of bullets){x.beginPath();x.arc(b.x,b.y,2.6,0,7);x.fill()}
  drawShip();
  requestAnimationFrame(loop);
}
let lastFire=0;
function fire(){if(!run)return;const now=Date.now();if(now-lastFire<180)return;lastFire=now;
  bullets.push({x:ship.x+Math.cos(ship.a)*16,y:ship.y+Math.sin(ship.a)*16,vx:Math.cos(ship.a)*5+ship.vx,vy:Math.sin(ship.a)*5+ship.vy,life:70})}
function start(){document.getElementById('ovS').classList.add('hide');document.getElementById('ovE').classList.add('hide');reset();msg.textContent='סובבו, האיצו וירו באסטרואידים';run=true;loop()}
function bindHold(id,down,up){const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();down()},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();up&&up()},{passive:false});
  el.addEventListener('mousedown',down);el.addEventListener('mouseup',()=>up&&up());el.addEventListener('mouseleave',()=>up&&up());}
bindHold('rotL',()=>keys.l=true,()=>keys.l=false);
bindHold('rotR',()=>keys.r=true,()=>keys.r=false);
bindHold('thrustB',()=>keys.t=true,()=>keys.t=false);
document.getElementById('fireB').addEventListener('touchstart',e=>{e.preventDefault();fire()},{passive:false});
document.getElementById('fireB').addEventListener('mousedown',fire);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key==='ArrowUp')keys.t=true;if(e.key===' ')fire()});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false;if(e.key==='ArrowUp')keys.t=false});
document.getElementById('startBtn').onclick=start;
document.getElementById('againB').onclick=start;
mkStars();reset();x.fillStyle='#070b18';x.fillRect(0,0,W,H);drawShip();
</script>
</body>
</html>
