const TOTAL=60;
const $=id=>document.getElementById(id);
let deck=[],qi=0,score=0,streak=0,bestStreak=0,correct=0,wrong=0,timeLeft=TOTAL,timer=null,lock=false;
const best=+ArcadiaStorage.getItem('blitz_best')||0;
$('bestTop').textContent=best;
if(best)$('bestChip').textContent='השיא שלכם: '+best+' נקודות';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function start(){
  deck=shuffle([...QUESTIONS]);qi=0;score=0;streak=0;bestStreak=0;correct=0;wrong=0;timeLeft=TOTAL;lock=false;
  $('score').textContent=0;$('streak').textContent=0;$('time').textContent=timeLeft;$('tbar').style.width='100%';$('tbar').classList.remove('low');
  show('scrGame');ask();
  clearInterval(timer);timer=setInterval(()=>{timeLeft--;$('time').textContent=timeLeft;
    $('tbar').style.width=(timeLeft/TOTAL*100)+'%';$('tbar').classList.toggle('low',timeLeft<=10);
    if(timeLeft<=0){clearInterval(timer);end();}},1000);
}
function ask(){
  lock=false;
  if(qi>=deck.length)deck=shuffle([...QUESTIONS]),qi=0;
  const c=deck[qi++];
  $('cat').textContent=c.c;
  $('q').textContent=c.q;
  const box=$('answers');box.innerHTML='';
  const order=shuffle([0,1,2,3]);
  order.forEach(idx=>{
    const b=document.createElement('button');b.className='ans';b.textContent=c.a[idx];
    b.onclick=()=>pick(b,idx===c.i);box.appendChild(b);
  });
}
function pick(btn,ok){
  if(lock)return;lock=true;
  [...$('answers').children].forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('correct');
    streak++;bestStreak=Math.max(bestStreak,streak);correct++;
    const mult=streak>0&&streak%5===0?2:1;
    const pts=10*mult;score+=pts;
    if(mult===2){const cb=$('combo');cb.textContent='🔥 רצף '+streak+'! ×2';cb.classList.add('show');setTimeout(()=>cb.classList.remove('show'),900);}
    flash('good');
    setTimeout(ask,450);
  }else{
    btn.classList.add('wrong');
    streak=0;wrong++;
    timeLeft=Math.max(0,timeLeft-3);$('time').textContent=timeLeft;
    $('tbar').style.width=(timeLeft/TOTAL*100)+'%';
    const tb=$('tbar');tb.classList.remove('penalty');void tb.offsetWidth;tb.classList.add('penalty');
    flash('bad');
    if(timeLeft<=0){clearInterval(timer);setTimeout(end,450);return;}
    setTimeout(ask,450);
  }
  $('score').textContent=score;$('streak').textContent=streak;
}
function flash(kind){const f=$('flash');f.className='flash '+kind;f.style.opacity=1;setTimeout(()=>f.style.opacity=0,180);}
function end(){
  clearInterval(timer);
  $('finalScore').textContent=score;
  $('stCorrect').textContent=correct;$('stWrong').textContent=wrong;
  $('stStreak').textContent=bestStreak;
  $('stAcc').textContent=Math.round(correct/Math.max(correct+wrong,1)*100)+'%';
  const nb=score>best;if(nb){ArcadiaStorage.setItem('blitz_best',score);$('bestTop').textContent=score;}
  $('newBest').hidden=!nb;
  $('endTitle').textContent=correct>=20?'🧠 גאון טריוויה!':correct>=12?'⚡ מרשים מאוד!':correct>=6?'👏 יפה מאוד!':'💪 בעוד סיבוב תשתפרו!';
  show('scrEnd');
}
$('btnStart').onclick=start;
$('btnAgain').onclick=start;
$('btnShare').onclick=async()=>{
  const txt='עניתי נכון על '+correct+' שאלות ב-60 שניות בבזק טריוויה! הניקוד: '+score+' ⚡ מי מנצח אותי?';
  if(navigator.share){try{await navigator.share({text:txt,url:location.href});}catch(e){}}
  else{try{await navigator.clipboard.writeText(txt+' '+location.href);$('btnShare').textContent='הועתק! ✅';setTimeout(()=>$('btnShare').textContent='שתפו 📤',1800);}catch(e){}}
};
