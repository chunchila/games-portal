<style>
:root{--bg:#0b1220;--card:#131f33;--accent:#5eead4;--accent2:#fbbf24;--good:#34d399;--text:#eef7ff;--muted:#8fa8c4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;height:100%;}
body{font-family:'Rubik',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1000px 700px at 85% -10%,#5eead422,transparent),
             radial-gradient(800px 600px at -10% 110%,#fbbf2415,transparent),var(--bg);
  display:flex;flex-direction:column;align-items:center;min-height:100%;
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 6px;}
.logo{font-weight:900;font-size:24px;background:linear-gradient(90deg,var(--accent),#a7f3d0,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.pill{background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px;}
.screen{display:none;flex-direction:column;flex:1;animation:fade .3s ease;}
.screen.active{display:flex;}

.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:20px 0 40px;}
.hero h1{font-size:56px;margin:0;background:linear-gradient(135deg,var(--accent),#a7f3d0 50%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px #5eead433);}
.hero p{color:var(--muted);font-size:17px;max-width:330px;margin:0;line-height:1.6;}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:16px;color:#06231d;

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px;margin-top:8px;}
.lvl{background:var(--card);border:1.5px solid #ffffff16;border-radius:14px;padding:12px 0;font-size:17px;font-weight:800;color:var(--text);cursor:pointer;font-family:inherit;transition:all .15s;position:relative;}
.lvl:active{transform:scale(.94);}
.lvl .st{position:absolute;top:4px;left:6px;font-size:10px;color:var(--accent2);}
.lvl.locked{opacity:.35;pointer-events:none;}
.lvl small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:2px;}
.hud{display:flex;gap:8px;margin:8px 0;}
.hud .pill{flex:1;text-align:center;}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0;}
#board{position:relative;touch-action:none;border-radius:18px;background:#0e1a2e;border:1px solid #ffffff10;box-shadow:0 14px 40px #00000066,inset 0 0 0 1px #ffffff08;}
#board canvas{display:block;border-radius:18px;}
.controls{display:flex;gap:10px;justify-content:center;padding:14px 0 22px;}
.controls .btn{padding:13px 22px;font-size:16px;flex:1;max-width:160px;}
.controls .btn.sec{background:var(--card);color:var(--text);box-shadow:0 4px 0 #00000055;border:1px solid #ffffff1c;}

.win-overlay.show{display:flex;}
.win-card{background:linear-gradient(160deg,#12233a,#0d1a2e);border:1px solid #ffffff1a;border-radius:24px;padding:30px 34px;text-align:center;max-width:320px;box-shadow:0 24px 60px #000000aa;}
.win-card h2{margin:0 0 4px;font-size:28px;}
.win-card .stars{font-size:34px;letter-spacing:6px;margin:8px 0;}
.win-card p{color:var(--muted);margin:4px 0 16px;}
.win-card .row{display:flex;gap:10px;justify-content:center;}
.win-card .btn{padding:12px 20px;font-size:15px;}
.section-title{color:var(--muted);font-weight:700;font-size:14px;margin:14px 0 6px;align-self:flex-start;}

<body>
<div class="wrap">
  <header>
    <div class="logo">🌊 זרימה</div>
    <div class="pill">⭐ <span id="totalStars">0</span></div>
  </header>

  <section id="scrStart" class="screen active">
    <div class="hero">
      <h1>🌊 זרימה</h1>
      <p>חברו כל זוג נקודות באותו צבע בקו רציף. הקווים לא יכולים להצטלב, וכל המשבצות חייבות להתמלא. גררו מאיזו נקודה שתרצו!</p>
      <div class="section-title">בחרו שלב</div>
      <div class="levels" id="levels"></div>
    </div>
  </section>

  <section id="scrGame" class="screen">
    <div class="hud">
      <div class="pill">שלב <span id="lvlNum">1</span></div>
      <div class="pill">מהלכים <span id="moves">0</span></div>
      <div class="pill">✅ <span id="done">0/0</span></div>
    </div>
    <div class="board-wrap"><div id="board"><canvas id="cv"></canvas></div></div>
    <div class="controls">
      <button class="btn sec" id="btnBack">🏠 שלבים</button>
      <button class="btn sec" id="btnReset">↺ איפוס</button>
    </div>
  </section>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h2>שלב הושלם! 🎉</h2>
    <div class="stars" id="winStars">★★★</div>
    <p id="winText"></p>
    <div class="row">
      <button class="btn ghost" id="btnHome">🏠</button>
      <button class="btn ghost" id="btnReplay">↺</button>
      <button class="btn" id="btnNext">הבא ◀</button>
    </div>
  </div>
</div>

<script>
"use strict";
const LEVELS = [{"size":5,"endpoints":[[[3,0],[2,3]],[[1,0],[0,0]],[[1,3],[4,0]],[[2,2],[2,0]]]},{"size":5,"endpoints":[[[4,4],[4,1]],[[3,4],[2,3]],[[1,3],[2,0]],[[1,1],[4,0]]]},{"size":5,"endpoints":[[[4,4],[0,2]],[[0,1],[0,0]],[[1,0],[2,0]],[[3,0],[3,1]]]},{"size":5,"endpoints":[[[2,0],[4,1]],[[2,2],[0,4]],[[4,0],[3,0]],[[1,1],[0,1]]]},{"size":5,"endpoints":[[[4,3],[4,4]],[[2,4],[2,1]],[[1,1],[4,0]],[[1,3],[1,4]]]},{"size":5,"endpoints":[[[3,4],[2,4]],[[0,4],[0,2]],[[2,1],[4,4]],[[2,2],[1,4]]]},{"size":6,"endpoints":[[[1,2],[0,4]],[[3,0],[2,3]],[[0,3],[0,2]],[[3,4],[5,5]],[[1,1],[2,0]]]},{"size":6,"endpoints":[[[2,0],[4,4]],[[3,0],[4,0]],[[3,4],[1,2]],[[1,0],[1,1]],[[0,2],[5,4]]]},{"size":6,"endpoints":[[[4,4],[5,0]],[[3,3],[1,2]],[[3,5],[2,1]],[[0,0],[2,5]],[[4,5],[5,3]]]},{"size":6,"endpoints":[[[5,5],[5,4]],[[2,0],[3,0]],[[1,2],[3,5]],[[0,5],[1,1]],[[4,1],[4,0]]]},{"size":6,"endpoints":[[[5,4],[4,5]],[[3,4],[2,4]],[[2,1],[1,1]],[[3,0],[3,3]],[[4,4],[4,2]]]},{"size":6,"endpoints":[[[1,1],[0,4]],[[2,0],[5,0]],[[5,4],[0,5]],[[5,3],[2,1]],[[2,3],[4,4]]]},{"size":7,"endpoints":[[[5,4],[6,4]],[[4,2],[4,4]],[[3,6],[1,6]],[[5,1],[1,3]],[[6,6],[5,6]],[[4,6],[4,1]]]},{"size":7,"endpoints":[[[0,0],[0,4]],[[4,2],[3,0]],[[5,1],[5,2]],[[5,3],[2,3]],[[6,0],[4,1]],[[1,5],[4,5]]]},{"size":7,"endpoints":[[[3,6],[1,5]],[[3,5],[6,6]],[[3,3],[4,0]],[[5,3],[6,5]],[[0,3],[3,2]],[[0,1],[0,0]]]},{"size":7,"endpoints":[[[6,4],[5,3]],[[5,1],[1,1]],[[3,4],[0,4]],[[6,0],[0,1]],[[6,1],[6,3]],[[6,6],[5,6]]]},{"size":7,"endpoints":[[[1,2],[0,0]],[[4,6],[4,0]],[[1,4],[2,6]],[[3,6],[2,4]],[[5,1],[2,1]],[[5,6],[6,6]]]}];
const COLORS = ['#fb7185','#fbbf24','#34d399','#60a5fa','#c084fc','#fb923c','#f472b6','#22d3ee'];
const $=id=>document.getElementById(id);
let li=0, size=0, endpoints=[], paths=[], moves=0, drawing=null, doneCount=0;
let cell=0, pad=10, cv=$('cv'), cx=cv.getContext('2d');
const progress=JSON.parse(ArcadiaStorage.getItem('flow_prog')||'{}');
function saveProg(){ArcadiaStorage.setItem('flow_prog',JSON.stringify(progress));renderLevels();}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}

function renderLevels(){
  const box=$('levels');box.innerHTML='';
  let stars=0;
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button');b.className='lvl';
    const st=progress[i]?.stars||0; stars+=st;
    b.innerHTML=(st?`<span class="st">${'★'.repeat(st)}</span>`:'')+(i+1)+`<small>${L.size}×${L.size}</small>`;
    if(i>0 && !progress[i-1] && !progress[i])b.classList.add('locked');
    b.onclick=()=>startLevel(i);
    box.appendChild(b);
  });
  $('totalStars').textContent=stars;
}
function startLevel(i){
  li=i; const L=LEVELS[i];
  size=L.size; endpoints=L.endpoints;
  paths=endpoints.map(()=>[]);
  moves=0;doneCount=0;drawing=null;
  $('lvlNum').textContent=i+1;$('moves').textContent=0;updateDone();
  const w=Math.min(innerWidth-40,460);
  cell=Math.floor((w-pad*2)/size);
  const dim=cell*size+pad*2;
  cv.width=dim*2;cv.height=dim*2;cv.style.width=dim+'px';cv.style.height=dim+'px';
  cx.setTransform(2,0,0,2,0,0);
  show('scrGame');draw();
}
function updateDone(){$('done').textContent=doneCount+'/'+endpoints.length;}
function cellAt(x,y){
  const r=cv.getBoundingClientRect();
  const cxp=Math.floor((x-r.left-pad)/cell), cyp=Math.floor((y-r.top-pad)/cell);
  if(cxp<0||cyp<0||cxp>=size||cyp>=size)return null;
  return [cyp,cxp];
}
function endpointAt(pos){
  for(let i=0;i<endpoints.length;i++)
    for(const e of endpoints[i])
      if(e[0]===pos[0]&&e[1]===pos[1])return i;
  return -1;
}
function pathAt(pos){
  for(let i=0;i<paths.length;i++){
    const idx=paths[i].findIndex(p=>p[0]===pos[0]&&p[1]===pos[1]);
    if(idx>=0)return [i,idx];
  }
  return null;
}
function isEndpointCellOf(color,pos){return endpoints[color].some(e=>e[0]===pos[0]&&e[1]===pos[1]);}
function complete(color){
  if(paths[color].length<2)return false;
  const last=paths[color][paths[color].length-1];
  const start=paths[color][0];
  const both=endpoints[color];
  const covers=(a,b)=>(a[0]===b[0]&&a[1]===b[1]);
  return (covers(start,both[0])&&covers(last,both[1]))||(covers(start,both[1])&&covers(last,both[0]));
}
cv.addEventListener('pointerdown',e=>{
  const pos=cellAt(e.clientX,e.clientY);if(!pos)return;
  cv.setPointerCapture(e.pointerId);
  const c=endpointAt(pos);
  if(c>=0){
    // start from endpoint: clear that color's path, keep the endpoint
    paths[c]=[endpoints[c].find(ep=>ep[0]===pos[0]&&ep[1]===pos[1])];
    drawing=c;recalc();return;
  }
  const pa=pathAt(pos);
  if(pa){ // grab middle of path: truncate to there
    const [i,idx]=pa; paths[i]=paths[i].slice(0,idx+1); drawing=i;recalc();return;}
});
cv.addEventListener('pointermove',e=>{
  if(drawing===null)return;
  const pos=cellAt(e.clientX,e.clientY);if(!pos)return;
  const path=paths[drawing];
  const last=path[path.length-1];
  if(last[0]===pos[0]&&last[1]===pos[1])return;
  // backtrack one
  if(path.length>1){const prev=path[path.length-2];if(prev[0]===pos[0]&&prev[1]===pos[1]){path.pop();draw();return;}}
  // must be adjacent
  if(Math.abs(last[0]-pos[0])+Math.abs(last[1]-pos[1])!==1)return;
  // hit endpoint of same color (and not the start)
  const c=endpointAt(pos);
  if(c===drawing&&!isStart(pos)){path.push(pos);drawing=null;recalc();moves++;$('moves').textContent=moves;checkWin();return;}
  if(c>=0)return; // endpoint of other color blocks
  // hit another path: cut it
  const pa=pathAt(pos);
  if(pa){const [i,idx]=pa;paths[i]=paths[i].slice(0,idx);}
  path.push(pos);draw();
});
cv.addEventListener('pointerup',()=>{if(drawing!==null){drawing=null;recalc();}});
function isStart(pos){const s=paths[drawing][0];return s[0]===pos[0]&&s[1]===pos[1];}
function recalc(){
  doneCount=0;for(let i=0;i<paths.length;i++)if(complete(i))doneCount++;
  updateDone();draw();
}
function checkWin(){
  recalc();
  const full=paths.every((p,i)=>complete(i)) && new Set(paths.flat().map(p=>p.join(','))).size===size*size;
  if(!full)return;
  const stars=moves<=endpoints.length?3:moves<=endpoints.length*2?2:1;
  const prev=progress[li]?.stars||0;
  progress[li]={stars:Math.max(stars,prev)};saveProg();
  $('winStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('winText').textContent='מהלכים: '+moves+(stars===3?' - מושלם!':'');
  $('btnNext').style.display=li<LEVELS.length-1?'':'none';
  setTimeout(()=>$('winOverlay').classList.add('show'),350);
}
function draw(){
  const dim=cell*size+pad*2;
  cx.clearRect(0,0,dim,dim);
  // grid
  cx.strokeStyle='#ffffff0d';cx.lineWidth=1;
  for(let i=0;i<=size;i++){
    cx.beginPath();cx.moveTo(pad+i*cell,pad);cx.lineTo(pad+i*cell,dim-pad);cx.stroke();
    cx.beginPath();cx.moveTo(pad,pad+i*cell);cx.lineTo(dim-pad,pad+i*cell);cx.stroke();
  }
  // paths
  paths.forEach((p,i)=>{
    if(p.length<2)return;
    cx.strokeStyle=COLORS[i]+'cc';cx.lineWidth=cell*.34;cx.lineCap='round';cx.lineJoin='round';
    cx.beginPath();
    p.forEach((pos,k)=>{
      const x=pad+pos[1]*cell+cell/2,y=pad+pos[0]*cell+cell/2;
      k?cx.lineTo(x,y):cx.moveTo(x,y);
    });
    cx.stroke();
  });
  // endpoints
  endpoints.forEach((ep,i)=>{
    ep.forEach(pos=>{
      const x=pad+pos[1]*cell+cell/2,y=pad+pos[0]*cell+cell/2;
      cx.fillStyle=COLORS[i];
      cx.beginPath();cx.arc(x,y,cell*.36,0,7);cx.fill();
      cx.fillStyle='#ffffff22';
      cx.beginPath();cx.arc(x-cell*.09,y-cell*.09,cell*.13,0,7);cx.fill();
      if(complete(i)){cx.strokeStyle='#fff';cx.lineWidth=2.5;cx.beginPath();cx.arc(x,y,cell*.42,0,7);cx.stroke();}
    });
  });
}
$('btnBack').onclick=()=>{renderLevels();show('scrStart');};
$('btnReset').onclick=()=>startLevel(li);
$('btnHome').onclick=()=>{$('winOverlay').classList.remove('show');renderLevels();show('scrStart');};
$('btnReplay').onclick=()=>{$('winOverlay').classList.remove('show');startLevel(li);};
$('btnNext').onclick=()=>{$('winOverlay').classList.remove('show');startLevel(li+1);};
renderLevels();
</script>
