<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>רוכבי היונקים</title>
<style>
html,body{margin:0;padding:0;background:#071224;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:15px;background:linear-gradient(180deg,#0d2340,#071224)}
#hud b{font-size:17px;color:#9be8ff}
#cv{flex:1;display:block;width:100%;touch-action:none}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,14,28,.92);text-align:center;padding:24px;z-index:5}
.ovl h1{font-size:30px;margin:0 0 10px;color:#9be8ff;text-shadow:0 2px 14px #00c3ff55}
.ovl p{font-size:15px;line-height:1.7;color:#d4e6f7;margin:0 0 22px;max-width:330px}
button{background:linear-gradient(180deg,#9be8ff,#2aa8e8);border:0;border-radius:999px;padding:14px 42px;font-size:19px;font-weight:700;color:#062a3d;box-shadow:0 4px 18px #2aa8e855;cursor:pointer}
button:active{transform:scale(.96)}
.hide{display:none!important}
#hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#4d6a8a;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<div id="hud"><div>ניקוד: <b id="sc">0</b></div><div>גל <b id="wv">1</b></div><div id="lives">♥♥♥</div></div>
<canvas id="cv"></canvas>
<div id="hint">געו שמאלה או ימינה כדי לפרפר - מי שגבוה יותר מנצח במגע</div>
<div class="ovl" id="startOvl">
<h1>רוכבי היונקים</h1>
<p>דהרו על גב יונק-דבש ענק מעל עמקי העננים. התנגשו ברוכבים יריבים כשאתם גבוהים מהם כדי להפיל אותם לביצה, ואספו את הביצים לפני שבוקעים! געו בצד שמאל או ימין של המסך כדי לפרפר לשם.</p>
<button id="startBtn">שחקו</button>
</div>
<div class="ovl hide" id="overOvl">
<h1 id="overT">נגמר המשחק</h1>
<p id="overP"></p>
<button id="againBtn">שחקו שוב</button>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const scEl=document.getElementById('sc'),wvEl=document.getElementById('wv'),livesEl=document.getElementById('lives');
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);x.direction='ltr'}
window.addEventListener('resize',rs);
const G=900,FLAP=-300,MOVE=190;
let pl,foes,eggs,plats,score,wave,lives,run,inv,respT;
function mkPlats(){plats=[{x:.08,y:.72,w:.26},{x:.66,y:.72,w:.26},{x:.3,y:.42,w:.4},{x:0,y:.985,w:1}]}
function spawnFoes(){foes=[];eggs=[];const n=Math.min(2+wave,5);
for(let i=0;i<n;i++){foes.push({x:W*(.15+.7*Math.random()),y:H*.15,vx:0,vy:0,dir:Math.random()<.5?-1:1,fl:0,alive:true,at:Math.random()})}}
function start(){score=0;wave=1;lives=3;run=true;inv=2;respT=0;mkPlats();
pl={x:W/2,y:H*.55,vx:0,vy:0,dir:1,fl:0};spawnFoes();upd()}
function upd(){scEl.textContent=score;wvEl.textContent=wave;livesEl.textContent='♥'.repeat(Math.max(0,lives))}
function collidePlats(o,dt){
for(const p of plats){const px=p.x*W,py=p.y*H,pw=p.w*W;
if(o.x>px-8&&o.x<px+pw+8&&o.y>py-6&&o.y<py+14&&o.vy>0){o.y=py-6;o.vy=0;o.ground=true;return}}
o.ground=false}
function flapTo(side){if(!run||respT>0)return;pl.vy=FLAP;pl.vx+=side*MOVE*.55;pl.dir=side||pl.dir;pl.fl=1}
function killPl(){if(inv>0)return;lives--;upd();shakeF=.5;
if(lives<=0){run=false;setTimeout(()=>{document.getElementById('overT').textContent='נגמר המשחק';document.getElementById('overP').textContent='אספתם '+score+' נקודות בשמי העמק.';document.getElementById('overOvl').classList.remove('hide')},600)}
else{respT=1.4}}
let shakeF=0;
function step(dt){
if(shakeF>0)shakeF-=dt;
if(inv>0)inv-=dt;
if(respT>0){respT-=dt;if(respT<=0){pl={x:W/2,y:H*.2,vx:0,vy:0,dir:1,fl:0};inv=2}else return}
pl.vy+=G*dt;pl.vx*=(1-1.6*dt);pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;
if(pl.x<-14)pl.x=W+14;if(pl.x>W+14)pl.x=-14;
if(pl.y>H-10){pl.y=H-10;pl.vy=0}
collidePlats(pl,dt);
if(pl.fl>0)pl.fl-=dt*3;
for(const f of foes){if(!f.alive)continue;
f.at-=dt;if(f.at<=0){f.vy=FLAP*(0.8+Math.random()*.4);f.fl=1;f.at=.5+Math.random()*.9;
if(Math.random()<.55)f.dir=Math.sign(pl.x-f.x)||1}
f.vy+=G*dt;f.vx+=(f.dir*130-f.vx)*dt*2;f.x+=f.vx*dt;f.y+=f.vy*dt;
if(f.x<-14)f.x=W+14;if(f.x>W+14)f.x=-14;
if(f.y>H-10){f.y=H-10;f.vy=0}
collidePlats(f,dt);
if(f.fl>0)f.fl-=dt*3;
const dx=f.x-pl.x,dy=f.y-pl.y;
if(dx*dx+dy*dy<520){
if(pl.y<f.y-8||pl.vy>f.vy+40){
f.alive=false;score+=150;upd();pl.vy=FLAP*.5;
eggs.push({x:f.x,y:f.y,vy:60,t:7})}
else killPl()}}
for(const e of eggs){e.vy+=G*dt*.6;e.y+=e.vy*dt;e.t-=dt;
for(const p of plats){const px=p.x*W,py=p.y*H,pw=p.w*W;
if(e.x>px&&e.x<px+pw&&e.y>py-8&&e.y<py+12&&e.vy>0){e.y=py-8;e.vy=0}}
if(e.y>H-14){e.y=H-14;e.vy=0}
const dxe=e.x-pl.x,dye=e.y-pl.y;
if(dxe*dxe+dye*dye<480){e.t=0;score+=100;upd()}}
eggs=eggs.filter(e=>{if(e.t>0)return true;
if(e.t<=-0){foes.push({x:e.x,y:e.y-10,vx:0,vy:-80,dir:Math.random()<.5?-1:1,fl:0,alive:true,at:0});return false}});
if(foes.every(f=>!f.alive)&&eggs.length===0){wave++;score+=200;upd();inv=1.5;spawnFoes()}
}
function drawBird(o,t,body,wing,rider){
x.save();x.translate(o.x,o.y);x.scale(o.dir,1);
const flap=Math.sin(t*26)*(o.fl>0?1:.3);
x.strokeStyle=wing;x.lineWidth=5;x.lineCap='round';
x.beginPath();x.moveTo(-2,-4);x.quadraticCurveTo(-14,-16-8*flap,-24,-10-10*flap);x.stroke();
x.fillStyle=body;x.beginPath();x.ellipse(0,0,15,9,0,0,7);x.fill();
x.beginPath();x.moveTo(-13,0);x.quadraticCurveTo(-26,-4,-30,2);x.quadraticCurveTo(-22,5,-13,4);x.fill();
x.fillStyle=body;x.beginPath();x.arc(13,-4,6,0,7);x.fill();
x.strokeStyle='#e8b45a';x.lineWidth=2.4;x.beginPath();x.moveTo(18,-5);x.lineTo(28,-4);x.stroke();
x.fillStyle='#fff';x.beginPath();x.arc(14.5,-5.5,2,0,7);x.fill();
x.fillStyle='#123';x.beginPath();x.arc(15,-5.5,1,0,7);x.fill();
x.fillStyle=rider;x.beginPath();x.arc(2,-13,4,0,7);x.fill();
x.fillRect(-1,-11,6,7);
x.fillStyle='#ffd75e';x.beginPath();x.arc(2,-15.5,2.6,Math.PI,0);x.fill();
x.restore()}
function draw(t){
x.clearRect(0,0,W,H);
const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#123a6b');bg.addColorStop(.6,'#0a2140');bg.addColorStop(1,'#071224');
x.fillStyle=bg;x.fillRect(0,0,W,H);
x.fillStyle='#ffffff22';
for(let i=0;i<4;i++){const cx=((i*230+t*14)%(W+120))-60,cy=H*(.12+i*.09);
x.beginPath();x.ellipse(cx,cy,44,13,0,0,7);x.ellipse(cx+26,cy+4,32,10,0,0,7);x.fill()}
x.save();if(shakeF>0)x.translate((Math.random()-.5)*8*shakeF,(Math.random()-.5)*8*shakeF);
for(const p of plats){const px=p.x*W,py=p.y*H,pw=p.w*W;
x.fillStyle='#3d2b52';x.beginPath();x.moveTo(px,py);x.lineTo(px+pw,py);x.lineTo(px+pw-14,py+16);x.lineTo(px+14,py+16);x.closePath();x.fill();
x.fillStyle='#59c96f';x.fillRect(px,py-4,pw,6)}
for(const e of eggs){
x.save();x.translate(e.x,e.y);
const g=x.createLinearGradient(0,-8,0,8);g.addColorStop(0,'#fff3c4');g.addColorStop(1,'#e8b45a');
x.fillStyle=g;x.beginPath();x.ellipse(0,0,7,9,0,0,7);x.fill();
x.fillStyle='#8a5a2e';x.fillRect(-4,-2,8,2);x.restore()}
for(const f of foes)if(f.alive)drawBird(f,t,'#c45a4a','#8a352a','#4a1f6b');
if(respT<=0&&!(inv>0&&Math.floor(inv*10)%2===0))drawBird(pl,t,'#4ac4a8','#2a8a76','#1f4a6b');
x.restore()}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw(ts/1000);requestAnimationFrame(loop)}
cv.addEventListener('touchstart',e=>{e.preventDefault();
const r=cv.getBoundingClientRect(),t=e.changedTouches[0];
flapTo((t.clientX-r.left)<r.width/2?-1:1)},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flapTo(-1);else if(e.key==='ArrowRight')flapTo(1);else if(e.key===' ')flapTo(0)});
window.flap=flapTo;
Object.defineProperty(window,'score',{get:()=>score});Object.defineProperty(window,'run',{get:()=>run});
Object.defineProperty(window,'foes',{get:()=>foes});Object.defineProperty(window,'eggs',{get:()=>eggs});
Object.defineProperty(window,'pl',{get:()=>pl});
document.getElementById('startBtn').onclick=()=>{document.getElementById('startOvl').classList.add('hide');rs();start()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('overOvl').classList.add('hide');start()};
rs();mkPlats();pl={x:200,y:200,vx:0,vy:0,dir:1,fl:0};foes=[];eggs=[];score=0;wave=1;lives=3;run=false;inv=0;respT=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
