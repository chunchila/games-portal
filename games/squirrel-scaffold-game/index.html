<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>פיסטוק והפיגומים</title>
<style>
html,body{margin:0;padding:0;background:#170d06;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:15px;background:linear-gradient(180deg,#33200e,#170d06)}
#hud b{font-size:17px;color:#ffb35e}
#cv{flex:1;display:block;width:100%;touch-action:none}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,11,4,.93);text-align:center;padding:24px;z-index:5}
.ovl h1{font-size:30px;margin:0 0 10px;color:#ffb35e;text-shadow:0 2px 14px #e87c1e66}
.ovl p{font-size:15px;line-height:1.7;color:#f0e0c8;margin:0 0 22px;max-width:330px}
button{background:linear-gradient(180deg,#ffb35e,#e87c1e);border:0;border-radius:999px;padding:14px 42px;font-size:19px;font-weight:700;color:#3d1f00;box-shadow:0 4px 18px #e87c1e55;cursor:pointer}
button:active{transform:scale(.96)}
.hide{display:none!important}
#hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#8a6a42;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<div id="hud"><div>ניקוד: <b id="sc">0</b></div><div>שלב <b id="lv">1</b></div><div id="lives">♥♥♥</div></div>
<canvas id="cv"></canvas>
<div id="hint">החזיקו ימינה-שמאלה ללכת, החליקו בסולם לטפס, געו לקפוץ</div>
<div class="ovl" id="startOvl">
<h1>פיסטוק והפיגומים</h1>
<p>פיסטוק הסנאי ראה את האגוז הכי גדול בעולם בראש הפיגומים - אבל דב-הנהר הזקן גולש גזעי עץ במורד! טפסו בסולמות, קפצו מעל הגזעים והגיעו לאגוז.</p>
<button id="startBtn">שחקו</button>
</div>
<div class="ovl hide" id="overOvl">
<h1 id="overT">נגמר המשחק</h1>
<p id="overP"></p>
<button id="againBtn">שחקו שוב</button>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const scEl=document.getElementById('sc'),lvEl=document.getElementById('lv'),livesEl=document.getElementById('lives');
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);x.direction='ltr'}
window.addEventListener('resize',rs);
const FLOORS=5;
let pl,logs,score,level,lives,run,inv,spawnT,beaverT;
let keys={l:0,r:0};
function floorY(i){return H-50-i*(H-110)/(FLOORS-1)}
const LADDERS=[{f:0,x:.72},{f:1,x:.18},{f:2,x:.55},{f:3,x:.3}];
function start(){score=0;level=1;lives=3;run=true;logs=[];inv=1.5;spawnT=1.5;beaverT=0;
pl={x:W*.5,y:floorY(0)-16,vx:0,vy:0,fl:0,onLad:false,face:1};upd()}
function upd(){scEl.textContent=score;lvEl.textContent=level;livesEl.textContent='♥'.repeat(Math.max(0,lives))}
function curFloor(){let best=0,bd=1e9;for(let i=0;i<FLOORS;i++){const d=Math.abs(pl.y+16-floorY(i));if(d<bd){bd=d;best=i}}return bd<10?best:-1}
function onLadder(){const f=curFloor();if(f<0)return null;
for(const L of LADDERS){if(L.f===f&&Math.abs(pl.x-L.x*W)<16)return{f,up:true}}
for(const L of LADDERS){if(L.f===f-1&&Math.abs(pl.x-L.x*W)<16)return{f:f-1,up:false,top:true}}
return null}
function jump(){if(!run||inv===null)return;const f=curFloor();if(f>=0&&!pl.onLad){pl.vy=-430;pl.onLad=false}}
function climb(dy){if(!run)return;const lad=onLadder();
if(lad&&(dy<0&&lad.up||dy>0&&!lad.top||dy>0&&curFloor()>=0)){pl.onLad=true;pl.ladDir=dy;
const L=LADDERS.find(L2=>Math.abs(pl.x-L2.x*W)<16&&(L2.f===curFloor()||L2.f===curFloor()-1));
if(L)pl.x=L.x*W}}
function lose(){if(inv>0)return;lives--;upd();
if(lives<=0){run=false;setTimeout(()=>{document.getElementById('overT').textContent='נגמר המשחק';document.getElementById('overP').textContent='פיסטוק הגיע לשלב '+level+' עם '+score+' נקודות.';document.getElementById('overOvl').classList.remove('hide')},600)}
else{pl={x:W*.5,y:floorY(0)-16,vx:0,vy:0,fl:0,onLad:false,face:1};inv=2}}
function step(dt){
if(inv>0)inv-=dt;
beaverT+=dt;
spawnT-=dt;
if(spawnT<=0){spawnT=Math.max(1.1,2.4-level*.2);
logs.push({x:W*.28,y:floorY(FLOORS-1)-10,f:FLOORS-1,dir:1,sp:95+level*18,rot:0})}
if(pl.onLad){
const lad=LADDERS.find(L=>Math.abs(pl.x-L.x*W)<18&&(Math.abs(pl.y+16-floorY(L.f))<90||Math.abs(pl.y+16-floorY(L.f+1))<90));
pl.vy=(pl.ladDir||0)*130;pl.y+=pl.vy*dt;
const f=curFloor();
if(pl.ladDir<0&&Math.abs(pl.y+16-floorY((lad?lad.f:0)+1))<6){pl.onLad=false;pl.y=floorY((lad?lad.f:0)+1)-16}
if(pl.ladDir>0&&f>=0){pl.onLad=false;pl.y=floorY(f)-16}
pl.vx=0;
}else{
pl.vx=((keys.r?1:0)-(keys.l?1:0))*170;
if(pl.vx)pl.face=Math.sign(pl.vx);
pl.vy+=950*dt;pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;
pl.x=Math.max(14,Math.min(W-14,pl.x));
const f=curFloor();
if(f>=0&&pl.vy>=0){pl.y=floorY(f)-16;pl.vy=0}
if(pl.y>H+30)lose()}
if(pl.y+16<floorY(FLOORS-1)+6&&pl.x>W*.82&&curFloor()===FLOORS-1){
score+=500+level*100;upd();level++;
if(level>3){run=false;document.getElementById('overT').textContent='כל הכבוד!';document.getElementById('overP').textContent='פיסטוק השיג את האגוז הענק! ניקוד סופי: '+score;document.getElementById('overOvl').classList.remove('hide')}
else{pl={x:W*.5,y:floorY(0)-16,vx:0,vy:0,fl:0,onLad:false,face:1};logs=[];inv=1.5}}
for(const g of logs){g.x+=g.dir*g.sp*dt;g.rot+=g.dir*dt*4;
const gapSide=g.f%2===0?1:-1;
if((gapSide===1&&g.x>W-8)||(gapSide===-1&&g.x<8)){
if(g.f>0){g.f--;g.y=floorY(g.f)-10;g.dir=gapSide===1?-1:1;g.x=gapSide===1?W-8:8}
else g.dead=true}
const dx=g.x-pl.x,dy=(g.y+6)-(pl.y);
if(!g.dead&&Math.abs(dx)<20&&Math.abs(dy)<26)lose();
if(!g.dead&&Math.abs(dx)<26&&dy<-20&&dy>-70&&pl.vy>0&&!g.counted){g.counted=true;score+=100;upd()}}
logs=logs.filter(g=>!g.dead);
}
function drawSquirrel(px,py,t){
x.save();x.translate(px,py);x.scale(pl.face,1);
x.fillStyle='#e8732a';
x.beginPath();x.moveTo(-6,8);x.quadraticCurveTo(-24,2,-20,-14);x.quadraticCurveTo(-12,-20,-8,-8);x.quadraticCurveTo(-14,0,-6,8);x.fill();
const g=x.createLinearGradient(0,-10,0,12);g.addColorStop(0,'#ff9a4a');g.addColorStop(1,'#d8621a');
x.fillStyle=g;x.beginPath();x.ellipse(0,2,9,10.5,0,0,7);x.fill();
x.fillStyle='#ffe0c0';x.beginPath();x.ellipse(1,6,5,5.5,0,0,7);x.fill();
x.fillStyle='#ff9a4a';x.beginPath();x.arc(4,-9,5.6,0,7);x.fill();
x.beginPath();x.moveTo(1,-13);x.lineTo(2,-19);x.lineTo(5,-14);x.closePath();x.fill();
x.beginPath();x.moveTo(7,-13);x.lineTo(8,-19);x.lineTo(10.5,-13);x.closePath();x.fill();
x.fillStyle='#fff';x.beginPath();x.arc(5.5,-10,2.4,0,7);x.fill();
x.fillStyle='#221';x.beginPath();x.arc(6.2,-10,1.2,0,7);x.fill();
x.fillStyle='#5a2d10';x.fillRect(-5,11,3.4,4);x.fillRect(3,11,3.4,4);
x.restore()}
function drawBeaver(bx,by,t){
x.save();x.translate(bx,by);
x.fillStyle='#7a4a26';x.beginPath();x.ellipse(0,0,14,11,0,0,7);x.fill();
x.beginPath();x.ellipse(-16,6,10,4,.4,0,7);x.fill();
x.fillStyle='#8a5a30';x.beginPath();x.arc(10,-6,7,0,7);x.fill();
x.fillStyle='#3a2210';x.beginPath();x.arc(6,-14,2.6,0,7);x.arc(13,-14,2.6,0,7);x.fill();
x.fillStyle='#fff';x.fillRect(8,-1,4,5);
x.fillStyle='#221';x.beginPath();x.arc(12,-7,1.4,0,7);x.fill();
if(Math.sin(beaverT*4)>0){x.strokeStyle='#7a4a26';x.lineWidth=3;x.beginPath();x.moveTo(2,6);x.lineTo(-4,14);x.stroke()}
x.restore()}
function draw(t){
x.clearRect(0,0,W,H);
const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2a1608');bg.addColorStop(.7,'#170d06');bg.addColorStop(1,'#0d0703');
x.fillStyle=bg;x.fillRect(0,0,W,H);
x.fillStyle='#ff9a3a18';x.beginPath();x.arc(W*.82,70,44,0,7);x.fill();
x.fillStyle='#ffce8a33';x.beginPath();x.arc(W*.82,70,26,0,7);x.fill();
for(let i=0;i<FLOORS;i++){const y=floorY(i);
const g=x.createLinearGradient(0,y-4,0,y+8);g.addColorStop(0,'#a8642e');g.addColorStop(1,'#6b3d16');
x.fillStyle=g;x.fillRect(0,y,W,10);
x.fillStyle='#4a2a0e';
for(let rx=10;rx<W;rx+=34)x.fillRect(rx,y+3,3,3);
}
for(const L of LADDERS){const lx=L.x*W,y1=floorY(L.f),y2=floorY(L.f+1);
x.strokeStyle='#e8c84a';x.lineWidth=3.4;
x.beginPath();x.moveTo(lx-7,y2);x.lineTo(lx-7,y1+8);x.moveTo(lx+7,y2);x.lineTo(lx+7,y1+8);x.stroke();
x.lineWidth=2.4;
for(let ry=y2-8;ry>y1+8;ry-=13){x.beginPath();x.moveTo(lx-7,ry);x.lineTo(lx+7,ry);x.stroke()}}
const ay=floorY(FLOORS-1)-26,axx=W*.9;
x.save();x.translate(axx,ay);
const ag=x.createRadialGradient(-3,-3,2,0,0,16);ag.addColorStop(0,'#ffd98a');ag.addColorStop(1,'#b87a20');
x.fillStyle=ag;x.beginPath();x.ellipse(0,0,11,14,0,0,7);x.fill();
x.fillStyle='#8a5a10';x.beginPath();x.ellipse(0,-13,7,4,0,0,7);x.fill();
const gl=x.createRadialGradient(0,0,4,0,0,30+Math.sin(t*3)*6);gl.addColorStop(0,'rgba(255,200,100,.4)');gl.addColorStop(1,'rgba(255,200,100,0)');
x.fillStyle=gl;x.beginPath();x.arc(0,0,34,0,7);x.fill();
x.restore();
drawBeaver(W*.13,floorY(FLOORS-1)-22,t);
for(const g2 of logs){
x.save();x.translate(g2.x,g2.y);x.rotate(g2.rot);
const lg=x.createLinearGradient(0,-9,0,9);lg.addColorStop(0,'#9a6a34');lg.addColorStop(1,'#5d3a14');
x.fillStyle=lg;x.beginPath();x.arc(0,0,9,0,7);x.fill();
x.strokeStyle='#3d2408';x.lineWidth=1.6;x.beginPath();x.arc(0,0,5,0,7);x.stroke();
x.beginPath();x.moveTo(0,-9);x.lineTo(0,9);x.stroke();
x.restore()}
if(!(inv>0&&Math.floor(inv*10)%2===0))drawSquirrel(pl.x,pl.y,t);
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw(ts/1000);requestAnimationFrame(loop)}
let hold=null,ts0=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();
const r=cv.getBoundingClientRect(),t=e.changedTouches[0];
ts0={x:t.clientX,y:t.clientY,t:Date.now()};
const rx=t.clientX-r.left;
if(rx<r.width*.4){keys.l=1;hold='l'}else if(rx>r.width*.6){keys.r=1;hold='r'}else hold=null},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!ts0)return;
const t=e.changedTouches[0],dy=t.clientY-ts0.y;
if(Math.abs(dy)>30){climb(Math.sign(dy));ts0.y=t.clientY}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();
if(hold==='l')keys.l=0;if(hold==='r')keys.r=0;hold=null;
if(ts0&&Date.now()-ts0.t<250)jump();ts0=null},{passive:false});
window.addEventListener('keydown',e=>{const k=e.key;
if(k==='ArrowLeft')keys.l=1;else if(k==='ArrowRight')keys.r=1;
else if(k==='ArrowUp')climb(-1);else if(k==='ArrowDown')climb(1);else if(k===' ')jump()});
window.addEventListener('keyup',e=>{const k=e.key;
if(k==='ArrowLeft')keys.l=0;else if(k==='ArrowRight')keys.r=0});
window.keys=keys;window.jump=jump;window.climb=climb;
Object.defineProperty(window,'score',{get:()=>score});Object.defineProperty(window,'run',{get:()=>run});
Object.defineProperty(window,'pl',{get:()=>pl});Object.defineProperty(window,'logs',{get:()=>logs});
document.getElementById('startBtn').onclick=()=>{document.getElementById('startOvl').classList.add('hide');rs();start()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('overOvl').classList.add('hide');start()};
rs();pl={x:100,y:100,vx:0,vy:0,fl:0,onLad:false,face:1};logs=[];score=0;level=1;lives=3;run=false;inv=0;spawnT=1;beaverT=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
