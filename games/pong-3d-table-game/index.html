<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>פונג 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0f0a;color:#e2e8f0;font-family:'Heebo',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:520px;padding:11px 16px 2px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
h1{font-size:22px;color:#a3e635}
.pill{background:#14210f;border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.sub{font-size:13px;color:#94a3b8;padding:2px 16px 6px;max-width:520px}
#wrap{width:100%;max-width:520px;padding:0 8px}
canvas{width:100%;display:block;border-radius:14px;background:#0a0f0a;touch-action:none}
#ctl{width:100%;max-width:520px;display:flex;gap:8px;padding:8px}
#ctl button{flex:1;background:#365314;border:none;border-radius:14px;color:#d9f99d;font-size:22px;padding:14px;user-select:none;touch-action:none}
#ctl button:active{background:#3f6212}
.overlay{position:fixed;inset:0;background:#0a0f0ad9;display:flex;align-items:center;justify-content:center;z-index:10}
.card{background:#14210f;border:2px solid #a3e63555;border-radius:22px;padding:26px 22px;text-align:center;max-width:340px;width:88%}
.card h2{font-size:26px;margin-bottom:10px;color:#a3e635}
.card p{font-size:15px;color:#cbd5e1;line-height:1.6;margin-bottom:16px}
.card button{background:#a3e635;color:#14210f;border:none;border-radius:999px;padding:12px 34px;font-size:17px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><h1>פונג 3D</h1><div class="pill">אתם <span id="me">0</span> : <span id="ai">0</span> מחשב &nbsp;שיא: <span id="best">0</span></div></header>
<div class="sub">גררו את המחבת ימינה ושמאלה - ראשון ל-7 נקודות מנצח</div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ctl"><button id="leftB">▶</button><button id="rightB">◀</button></div>
<div class="overlay" id="start"><div class="card"><h2>פונג 3D</h2><p>המשחק הראשון בהיסטוריה, עכשיו עם עומק! החזירו את הכדור לצד של המחשב.</p><button id="startBtn">שחקו</button></div></div>
<div class="overlay" id="over" style="display:none"><div class="card"><h2 id="overTitle"></h2><p id="finalText"></p><button id="againBtn">שחקו שוב</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=390,H=540;c.width=W;c.height=H;
const F=420,CAM={x:0,y:9,z:-18};
const meEl=document.getElementById('me'),aiEl=document.getElementById('ai'),bestEl=document.getElementById('best');
let best=+localStorage.getItem('pong3d_best')||0;bestEl.textContent=best;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return `rgb(${r},${g},${b})`}
function proj(px,py,pz){const dz=pz-CAM.z;if(dz<0.5)return null;const s=F/dz;return [W/2+(px-CAM.x)*s,H*0.40-(py-CAM.y)*s,s]}
function box3(faces,px,py,pz,s,col){const h=s/2,x0=px-h,x1=px+h,y0=py-h,y1=py+h,z0=pz-h,z1=pz+h;
  faces.push({z:pz,pts:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],col});
  faces.push({z:pz,pts:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],col:shade(col,40)});
  if(px>0.2)faces.push({z:pz,pts:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],col:shade(col,-40)});
  else if(px<-0.2)faces.push({z:pz,pts:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],col:shade(col,-40)});}
const TW=16,TZ0=2,TZ1=42; // table extents
let pz_,ball,me,me2,ai,run,t,faces,rally,speed;
const keys={};
function serve(dir){ball={x:(Math.random()-0.5)*6,y:1.2,z:20,dx:(Math.random()-0.5)*0.14,dy:0,dz:0.3*dir};rally=0;speed=0.3}
function reset(){me=0;ai=0;px=0;aix=0;run=true;t=0;serve(Math.random()<0.5?1:-1);hud()}
let px=0,aix=0;
function hud(){meEl.textContent=me;aiEl.textContent=ai}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});
function bindHold(id,on,off){const b=document.getElementById(id);
  const s=e=>{e.preventDefault();on()},e2=e=>{e.preventDefault();off()};
  b.addEventListener('touchstart',s,{passive:false});b.addEventListener('touchend',e2);
  b.addEventListener('mousedown',s);b.addEventListener('mouseup',e2);b.addEventListener('mouseleave',e2)}
bindHold('leftB',()=>keys.l=true,()=>keys.l=false);
bindHold('rightB',()=>keys.r=true,()=>keys.r=false);
c.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();const mx=(e.changedTouches[0].clientX-r.left)/r.width;px=Math.max(-6.5,Math.min(6.5,(mx-0.5)*20))},{passive:false});
function point(who){
  if(who==='me'){me++;if(me>best){best=me;localStorage.setItem('pong3d_best',best);bestEl.textContent=best}}
  else ai++;
  hud();
  if(me>=7||ai>=7){run=false;
    document.getElementById('overTitle').textContent=me>=7?'ניצחתם!':'המחשב ניצח';
    document.getElementById('finalText').textContent=`תוצאה: ${me} : ${ai}.`;
    document.getElementById('over').style.display='flex'}
  else serve(who==='me'?-1:1);}
function update(){
  if(!run)return;
  t++;
  if(keys.l)px-=0.4;if(keys.r)px+=0.4;px=Math.max(-6.5,Math.min(6.5,px));
  // AI tracks ball when it approaches
  const target=ball.dz>0?ball.x*0.9:0;
  const diff=target-aix;aix+=Math.max(-0.24-Math.min(0.1,rally*0.01),Math.min(0.24+Math.min(0.1,rally*0.01),diff));
  aix=Math.max(-6.5,Math.min(6.5,aix));
  // ball
  ball.x+=ball.dx;ball.z+=ball.dz;
  // bounce off side walls
  if(ball.x>7.4){ball.x=7.4;ball.dx=-Math.abs(ball.dx)}
  if(ball.x<-7.4){ball.x=-7.4;ball.dx=Math.abs(ball.dx)}
  // player paddle (near, z=4)
  if(ball.dz<0&&ball.z<=4.6&&ball.z>=3.2){
    if(Math.abs(ball.x-px)<2.2){ball.z=4.6;ball.dz=Math.abs(ball.dz)+0.012;rally++;
      ball.dx+=(ball.x-px)*0.06;ball.dx=Math.max(-0.35,Math.min(0.35,ball.dx))}
  }
  // AI paddle (far, z=40)
  if(ball.dz>0&&ball.z>=39.4&&ball.z<=40.8){
    if(Math.abs(ball.x-aix)<2.2){ball.z=39.4;ball.dz=-Math.abs(ball.dz)-0.012;
      ball.dx+=(ball.x-aix)*0.05;ball.dx=Math.max(-0.3,Math.min(0.3,ball.dx))}
  }
  if(ball.z<2.4)point('ai');
  if(ball.z>42.5)point('me');
}
function draw(){
  faces=[];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0f0a');g.addColorStop(1,'#14210f');x.fillStyle=g;x.fillRect(0,0,W,H);
  // table floor
  const f1=proj(-8,0,TZ0),f2=proj(8,0,TZ0),f3=proj(8,0,TZ1),f4=proj(-8,0,TZ1);
  x.fillStyle='#101a0e';x.beginPath();x.moveTo(f1[0],f1[1]);x.lineTo(f2[0],f2[1]);x.lineTo(f3[0],f3[1]);x.lineTo(f4[0],f4[1]);x.closePath();x.fill();
  // court lines
  x.strokeStyle='#a3e63544';x.lineWidth=1.5;
  const L=(a,b)=>{if(a&&b){x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}};
  L(proj(-8,0.02,TZ0),proj(-8,0.02,TZ1));L(proj(8,0.02,TZ0),proj(8,0.02,TZ1));
  L(proj(-8,0.02,22),proj(8,0.02,22));
  // net across middle
  for(let nx=-8;nx<8;nx+=0.8){const a=proj(nx,0,22),b=proj(nx,1.6,22);L(a,b)}
  const nt=proj(-8,1.6,22),nt2=proj(8,1.6,22);x.strokeStyle='#a3e635aa';L(nt,nt2);
  // ball shadow
  const sh=proj(ball.x,0.02,ball.z);if(sh){x.fillStyle='#0008';x.beginPath();x.ellipse(sh[0],sh[1],sh[2]*0.5,sh[2]*0.2,0,0,7);x.fill()}
  // ball
  box3(faces,ball.x,ball.y,ball.z,0.9,'#f8fafc');
  // paddles
  box3(faces,px,1,4,1.2,'#a3e635');
  box3(faces,px-1.1,1,4,1.2,'#a3e635');
  box3(faces,px+1.1,1,4,1.2,'#a3e635');
  box3(faces,aix,1,40,1.2,'#f87171');
  box3(faces,aix-1.1,1,40,1.2,'#f87171');
  box3(faces,aix+1.1,1,40,1.2,'#f87171');
  faces.sort((a,b)=>b.z-a.z);
  for(const f of faces){const ps=f.pts.map(p=>proj(p[0],p[1],p[2]));if(ps.some(p=>!p))continue;
    x.fillStyle=f.col;x.beginPath();x.moveTo(ps[0][0],ps[0][1]);for(let i=1;i<4;i++)x.lineTo(ps[i][0],ps[i][1]);x.closePath();x.fill()}
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();run=false;draw();
document.getElementById('startBtn').onclick=()=>{document.getElementById('start').style.display='none';reset();loop()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('over').style.display='none';reset();loop()};
</script>
</body>
</html>
