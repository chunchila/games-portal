<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>קוקו ומלחמת הבלונים</title>
<style>
html,body{margin:0;padding:0;background:#0d1420;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:15px;background:linear-gradient(180deg,#16233a,#0d1420)}
#hud b{font-size:17px;color:#8ad4ff}
#cv{flex:1;display:block;width:100%;touch-action:none}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,20,32,.93);text-align:center;padding:24px;z-index:5}
.ovl h1{font-size:28px;margin:0 0 10px;color:#8ad4ff;text-shadow:0 2px 14px #2a78c066}
.ovl p{font-size:15px;line-height:1.7;color:#d8e8f4;margin:0 0 22px;max-width:330px}
button{background:linear-gradient(180deg,#8ad4ff,#2a78c0);border:0;border-radius:999px;padding:14px 42px;font-size:19px;font-weight:700;color:#062038;box-shadow:0 4px 18px #2a78c055;cursor:pointer}
button:active{transform:scale(.96)}
.hide{display:none!important}
#hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#4a6a8a;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<div id="hud"><div>ניקוד: <b id="sc">0</b></div><div>שלב <b id="st">1</b>/3</div><div id="lives">♥♥♥</div></div>
<canvas id="cv"></canvas>
<div id="hint">החזיקו את הצדדים כדי לזוז - הקישו כדי לשלוח חץ</div>
<div class="ovl" id="startOvl">
<h1>קוקו ומלחמת הבלונים</h1>
<p>בלונים ענקיים קופצים ביער! קוקו הקוף יורה חצים למעלה: כל פגיעה מפצלת בלון לשניים קטנים יותר, עד שהכי קטנים מתפוצצים. אל תתנו לבלון לגעת בקוקו!</p>
<button id="startBtn">שחקו</button>
</div>
<div class="ovl hide" id="overOvl">
<h1 id="overT">נגמר המשחק</h1>
<p id="overP"></p>
<button id="againBtn">שחקו שוב</button>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const scEl=document.getElementById('sc'),stEl=document.getElementById('st'),livesEl=document.getElementById('lives');
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);x.direction='ltr'}
window.addEventListener('resize',rs);
let pl,balls,darts,score,lives,run,inv,stage,pops;
const keys={l:0,r:0};
const SIZES=[34,24,15,9];
const COLS=[['#ff7a8a','#c03a50'],['#ffb84a','#c07820'],['#6ad48a','#2a8a4a'],['#8ab4ff','#3a5ac0']];
const GY=()=>H*.96;
function spawnStage(){
balls=[];darts=[];pops=[];
const n=1+stage;
for(let i=0;i<n;i++)balls.push({x:W*(.2+.6*i/Math.max(1,n-1)||W/2),y:H*.25+((i*53)%80),vx:(i%2?70:-70),vy:0,r:SIZES[0],c:i%4});
}
function start(){score=0;lives=3;run=true;inv=1.2;stage=1;
pl={x:W/2,y:GY(),vx:0,face:1};
spawnStage();upd()}
function upd(){scEl.textContent=score;stEl.textContent=stage;livesEl.textContent='♥'.repeat(Math.max(0,lives))}
function fire(){if(!run)return;if(darts.length>=2)return;
darts.push({x:pl.x,y:pl.y-14})}
function lose(){if(inv>0)return;lives--;upd();inv=2;
for(let i=0;i<10;i++)pops.push({x:pl.x,y:pl.y-10,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,t:.5,c:'#ff8a8a'});
if(lives<=0){run=false;setTimeout(()=>{document.getElementById('overT').textContent='הבלונים נצחו';document.getElementById('overP').textContent='קוקו צבר '+score+' נקודות והגיע לשלב '+stage+'.';document.getElementById('overOvl').classList.remove('hide')},600)}
else{pl.x=W/2;balls.forEach(b=>{b.y=Math.min(b.y,H*.4)})}}
function step(dt){
if(inv>0)inv-=dt;
pl.vx=((keys.r?1:0)-(keys.l?1:0))*220;
if(pl.vx)pl.face=Math.sign(pl.vx);
pl.x+=pl.vx*dt;pl.x=Math.max(14,Math.min(W-14,pl.x));
for(const d of darts)d.y-=520*dt;
darts=darts.filter(d=>d.y>-10);
for(const b of balls){
b.vy+=680*dt;
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<b.r+6){b.x=b.r+6;b.vx=Math.abs(b.vx)}
if(b.x>W-b.r-6){b.x=W-b.r-6;b.vx=-Math.abs(b.vx)}
if(b.y>GY()-b.r){b.y=GY()-b.r;b.vy=-Math.sqrt(2*680*(H*.42+b.r*2))}
if(b.y<b.r+6){b.y=b.r+6;b.vy=Math.abs(b.vy)*.5}
if(Math.hypot(b.x-pl.x,b.y-(pl.y-8))<b.r+11)lose()}
for(let di=darts.length-1;di>=0;di--){
const d=darts[di];let hit=-1;
for(let bi=0;bi<balls.length;bi++){const b=balls[bi];
if(Math.abs(d.x-b.x)<b.r+3&&d.y<b.y+b.r&&d.y>b.y-b.r-40){hit=bi;break}}
if(hit>=0){const b=balls.splice(hit,1)[0];darts.splice(di,1);
const si=SIZES.indexOf(b.r);
score+=(si+1)*50;upd();
for(let i=0;i<10;i++)pops.push({x:b.x,y:b.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,t:.45,c:COLS[b.c][0]});
if(si<3){for(const dir of[-1,1])balls.push({x:b.x,y:b.y,vx:dir*(80+si*20),vy:-260,r:SIZES[si+1],c:b.c})}}}
for(const p of pops){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}
pops=pops.filter(p=>p.t>0);
if(run&&balls.length===0){
if(stage>=3){run=false;document.getElementById('overT').textContent='כל הכבוד!';document.getElementById('overP').textContent='קוקו פיצץ את כל הבלונים ביער! ניקוד סופי: '+score;document.getElementById('overOvl').classList.remove('hide')}
else{stage++;upd();spawnStage();inv=1.2}}
}
function drawMonkey(t){
x.save();x.translate(pl.x,pl.y);x.scale(pl.face,1);
x.fillStyle='#8a5a30';x.beginPath();x.ellipse(0,-6,8,9,0,0,7);x.fill();
x.fillStyle='#d8a86a';x.beginPath();x.ellipse(0,-4,5,6,0,0,7);x.fill();
x.fillStyle='#8a5a30';x.beginPath();x.arc(1,-16,6,0,7);x.fill();
x.beginPath();x.arc(-4,-20,2.6,0,7);x.arc(6,-20,2.6,0,7);x.fill();
x.fillStyle='#d8a86a';x.beginPath();x.ellipse(2,-15,3.6,3,0,0,7);x.fill();
x.fillStyle='#221';x.beginPath();x.arc(1,-17.5,1,0,7);x.arc(4.5,-17.5,1,0,7);x.fill();
x.strokeStyle='#8a5a30';x.lineWidth=2.4;
const wag=Math.sin(t*6)*3;
x.beginPath();x.moveTo(-7,-2);x.quadraticCurveTo(-14,-6+ wag,-12,-14+wag);x.stroke();
x.fillStyle='#4a2e14';x.fillRect(-5,2,3.4,4);x.fillRect(2,2,3.4,4);
x.restore()}
function draw(t){
x.clearRect(0,0,W,H);
const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101c30');bg.addColorStop(1,'#0d1420');
x.fillStyle=bg;x.fillRect(0,0,W,H);
x.fillStyle='#1a2c44';
for(let i=0;i<8;i++){const tx=(i*67+30)%W,ty=H*.55+((i*41)%60);
x.fillRect(tx-2,ty,4,26);x.beginPath();x.arc(tx,ty,12,0,7);x.fill()}
x.fillStyle='#1e3048';x.fillRect(0,GY(),W,H-GY());
x.fillStyle='#2a4058';x.fillRect(0,GY(),W,3);
for(const b of balls){
const g=x.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,b.r*.15,b.x,b.y,b.r);g.addColorStop(0,COLS[b.c][0]);g.addColorStop(1,COLS[b.c][1]);
x.fillStyle=g;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();
x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(b.x-b.r*.38,b.y-b.r*.42,b.r*.22,b.r*.13,-.6,0,7);x.fill();
x.fillStyle=COLS[b.c][1];x.beginPath();x.moveTo(b.x-3,b.y+b.r);x.lineTo(b.x+3,b.y+b.r);x.lineTo(b.x,b.y+b.r+5);x.fill()}
for(const d of darts){
x.strokeStyle='#d8ecff';x.lineWidth=2.6;
x.beginPath();x.moveTo(d.x,GY());x.lineTo(d.x,d.y);x.stroke();
x.fillStyle='#8ad4ff';x.beginPath();x.moveTo(d.x,d.y-6);x.lineTo(d.x-4,d.y+3);x.lineTo(d.x+4,d.y+3);x.fill()}
for(const p of pops){x.globalAlpha=Math.max(0,p.t*2);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.6,0,7);x.fill()}
x.globalAlpha=1;
if(!(inv>0&&Math.floor(inv*10)%2===0))drawMonkey(t);
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw(ts/1000);requestAnimationFrame(loop)}
let hold=null,ts0=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();
const r=cv.getBoundingClientRect(),t=e.changedTouches[0];
ts0={x:t.clientX,y:t.clientY,t:Date.now()};
const rx=t.clientX-r.left;
if(rx<r.width*.35){keys.l=1;hold='l'}else if(rx>r.width*.65){keys.r=1;hold='r'}else hold=null},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();
if(hold==='l')keys.l=0;if(hold==='r')keys.r=0;hold=null;
if(ts0&&Date.now()-ts0.t<250)fire();ts0=null},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{const k=e.key;
if(k==='ArrowLeft')keys.l=1;else if(k==='ArrowRight')keys.r=1;else if(k===' ')fire()});
window.addEventListener('keyup',e=>{const k=e.key;
if(k==='ArrowLeft')keys.l=0;else if(k==='ArrowRight')keys.r=0});
window.keys=keys;window.fire=fire;
Object.defineProperty(window,'score',{get:()=>score});Object.defineProperty(window,'run',{get:()=>run});
Object.defineProperty(window,'pl',{get:()=>pl});Object.defineProperty(window,'balls',{get:()=>balls});
Object.defineProperty(window,'stage',{get:()=>stage});
document.getElementById('startBtn').onclick=()=>{document.getElementById('startOvl').classList.add('hide');rs();start()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('overOvl').classList.add('hide');start()};
rs();pl={x:100,y:100,vx:0,face:1};balls=[];darts=[];pops=[];score=0;lives=3;run=false;inv=0;stage=1;
requestAnimationFrame(loop);
</script>
</body>
</html>
