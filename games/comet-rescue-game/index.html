<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>משמר הזוהר</title>
<style>
html,body{margin:0;padding:0;background:#04060f;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:15px;background:linear-gradient(180deg,#0c1230,#04060f)}
#hud b{font-size:17px;color:#ffe89b}
#cv{flex:1;display:block;width:100%;touch-action:none}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,15,.93);text-align:center;padding:24px;z-index:5}
.ovl h1{font-size:30px;margin:0 0 10px;color:#ffe89b;text-shadow:0 2px 16px #ffb30066}
.ovl p{font-size:15px;line-height:1.7;color:#ccd6f0;margin:0 0 22px;max-width:330px}
button{background:linear-gradient(180deg,#ffe89b,#f0a500);border:0;border-radius:999px;padding:14px 42px;font-size:19px;font-weight:700;color:#3a2800;box-shadow:0 4px 18px #f0a50055;cursor:pointer}
button:active{transform:scale(.96)}
.hide{display:none!important}
#hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#4a5578;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<div id="hud"><div>ניקוד: <b id="sc">0</b></div><div>גורי-זוהר: <b id="pp">8</b></div><div id="lives">♥♥♥</div></div>
<canvas id="cv"></canvas>
<div id="hint">גררו כדי להוביל את הספינה - הירי אוטומטי. תפסו גורים שנופלים!</div>
<div class="ovl" id="startOvl">
<h1>משמר הזוהר</h1>
<p>עטלפי שביט יורדים מהלילה לחטוף את גורי הזוהר מהעמק. הובילו את ספינת הגחלילית, פוצצו את החוטפים באוויר, ואם גור נופל - תפסו אותו בעדינות והחזירו אותו לאדמה!</p>
<button id="startBtn">שחקו</button>
</div>
<div class="ovl hide" id="overOvl">
<h1 id="overT">נגמר המשחק</h1>
<p id="overP"></p>
<button id="againBtn">שחקו שוב</button>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const scEl=document.getElementById('sc'),ppEl=document.getElementById('pp'),livesEl=document.getElementById('lives');
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);x.direction='ltr'}
window.addEventListener('resize',rs);
const WW=1600;
let ship,pups,bats,bolts,wave,score,lives,run,cam,inv,carry,spawnT,fireT,tx,ty,waveMsg;
function start(){score=0;lives=3;wave=1;run=true;cam=0;inv=1.5;carry=null;bolts=[];bats=[];
ship={x:WW/2,y:200,dir:1};
pups=[];for(let i=0;i<8;i++)pups.push({x:120+i*(WW-240)/7,taken:false,lost:false});
tx=ship.x;ty=ship.y;spawnT=1;fireT=0;waveMsg=2;upd()}
function upd(){scEl.textContent=score;ppEl.textContent=pups.filter(p=>!p.lost).length;livesEl.textContent='♥'.repeat(Math.max(0,lives))}
function spawnBat(){const free=pups.filter(p=>!p.taken&&!p.lost);
const tx2=free.length?free[Math.floor(Math.random()*free.length)]:null;
bats.push({x:Math.random()*WW,y:-30,vy:26+wave*5,vx:(Math.random()-.5)*40,state:'dive',pup:tx2,fl:Math.random()*7})}
function lose(){if(inv>0)return;lives--;upd();inv=2;
if(lives<=0){run=false;setTimeout(()=>{document.getElementById('overT').textContent='נגמר המשחק';document.getElementById('overP').textContent='הגנתם על העמק עד גל '+wave+' עם '+score+' נקודות.';document.getElementById('overOvl').classList.remove('hide')},600)}}
function boom(bx,by,n){for(let i=0;i<n;i++)sparks.push({x:bx,y:by,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,t:.5+Math.random()*.3})}
let sparks=[];
function step(dt){
if(inv>0)inv-=dt;if(waveMsg>0)waveMsg-=dt;
const dx=tx-ship.x,dy=ty-ship.y,d=Math.hypot(dx,dy);
if(d>4){const sp=Math.min(340,d*5);ship.x+=dx/d*sp*dt;ship.y+=dy/d*sp*dt;ship.dir=dx>=0?1:-1}
ship.x=Math.max(20,Math.min(WW-20,ship.x));ship.y=Math.max(30,Math.min(H*.7,ship.y));
spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.7,2.2-wave*.15);if(bats.length<4+wave)spawnBat()}
fireT-=dt;if(fireT<=0){fireT=.28;bolts.push({x:ship.x+ship.dir*16,y:ship.y,vx:ship.dir*560,life:1.2})}
for(const b of bats){b.fl+=dt*10;
if(b.state==='dive'){
if(b.pup&&!b.pup.lost&&!b.pup.taken){
const dx2=b.pup.x-b.x;b.x+=Math.sign(dx2)*Math.min(Math.abs(dx2),70*dt)*2;b.y+=b.vy*dt*1.4;
if(Math.abs(dx2)<16&&b.y>H*.82){b.pup.taken=true;b.state='rise'}}
else b.y+=b.vy*dt;
if(b.y>H*.9&&b.state==='dive'){b.state='rise'}}
else{b.y-=60*dt;b.x+=b.vx*dt;
if(b.y<-40){if(b.pup)b.pup.lost=true;b.dead=true;upd();
if(pups.every(p=>p.lost)){run=false;document.getElementById('overT').textContent='העמק התרוקן';document.getElementById('overP').textContent='כל גורי הזוהר נלקחו... ניקוד: '+score;document.getElementById('overOvl').classList.remove('hide')}}}}
for(const bo of bolts){bo.x+=bo.vx*dt;bo.life-=dt;
for(const b of bats){if(b.dead)continue;
if(Math.abs(bo.x-b.x)<20&&Math.abs(bo.y-b.y)<16){
b.dead=true;bo.life=0;score+=100;upd();boom(b.x,b.y,10);
if(b.pup&&b.pup.taken&&!b.pup.lost){carry={pup:b.pup,x:b.x,y:b.y,vy:40};b.pup=null}}}}
bolts=bolts.filter(b=>b.life>0&&b.x>0&&b.x<WW);
bats=bats.filter(b=>!b.dead);
if(carry){carry.vy+=240*dt;carry.y+=carry.vy*dt;
if(Math.abs(carry.x-ship.x)<26&&Math.abs(carry.y-ship.y)<22){
carry.pup.taken=false;carry.pup.lost=false;carry.pup.x=Math.max(60,Math.min(WW-60,carry.x));carry=null;score+=250;upd()}
else if(carry.y>H*.9){carry.pup.taken=false;carry.pup.x=Math.max(60,Math.min(WW-60,carry.x));carry=null}}
for(const b of bats){if(Math.abs(b.x-ship.x)<24&&Math.abs(b.y-ship.y)<20){b.dead=true;boom(b.x,b.y,8);lose()}}
for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt}
sparks=sparks.filter(s=>s.t>0);
if(bats.length===0&&spawnT>1.2&&!pups.every(p=>p.lost)){
const danger=pups.some(p=>p.taken);
if(!danger){wave++;score+=150;upd();waveMsg=2;spawnT=1}}
const tcx=Math.max(0,Math.min(WW-W,ship.x-W/2));cam+=(tcx-cam)*dt*4;
}
function drawPup(px,py,t){
x.save();x.translate(px,py);
x.fillStyle='#ffe89b';x.beginPath();x.ellipse(0,0,7,6,0,0,7);x.fill();
x.beginPath();x.moveTo(-5,-4);x.lineTo(-8,-10);x.lineTo(-2,-6);x.closePath();x.fill();
x.beginPath();x.moveTo(5,-4);x.lineTo(8,-10);x.lineTo(2,-6);x.closePath();x.fill();
const gl=x.createRadialGradient(0,0,2,0,0,16+Math.sin(t*4+px)*3);
gl.addColorStop(0,'rgba(255,232,155,.5)');gl.addColorStop(1,'rgba(255,232,155,0)');
x.fillStyle=gl;x.beginPath();x.arc(0,0,18,0,7);x.fill();
x.fillStyle='#5a4200';x.fillRect(-3,-1.5,1.8,1.8);x.fillRect(1.4,-1.5,1.8,1.8);
x.restore()}
function draw(t){
x.clearRect(0,0,W,H);
const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a1030');bg.addColorStop(.7,'#101a3d');bg.addColorStop(1,'#04060f');
x.fillStyle=bg;x.fillRect(0,0,W,H);
x.fillStyle='#fff';
for(let i=0;i<40;i++){const sx=(i*173-cam*.3)%(W+40),sy=(i*61)%(H*.6);
x.globalAlpha=.3+.4*Math.abs(Math.sin(t+i));x.fillRect((sx+W+40)%(W+40)-20,sy,1.6,1.6)}
x.globalAlpha=1;
x.save();x.translate(W-60-cam*.05,70);
const mg=x.createRadialGradient(0,0,10,0,0,50);mg.addColorStop(0,'#fff8e0');mg.addColorStop(.4,'#ffe89b44');mg.addColorStop(1,'#ffe89b00');
x.fillStyle=mg;x.beginPath();x.arc(0,0,50,0,7);x.fill();
x.fillStyle='#fff8e0';x.beginPath();x.arc(0,0,18,0,7);x.fill();x.restore();
x.save();x.translate(-cam,0);
x.fillStyle='#0d1533';
x.beginPath();x.moveTo(-50,H*.95);
for(let i=0;i<=16;i++){x.lineTo(i*WW/16,H*.95-((i*97)%70)-20)}
x.lineTo(WW+50,H*.95);x.closePath();x.fill();
x.fillStyle='#13204a';x.fillRect(-50,H*.93,WW+100,H*.1);
x.fillStyle='#1a2c5e';x.fillRect(-50,H*.93,WW+100,4);
for(const p of pups)if(!p.lost&&!p.taken)drawPup(p.x,H*.93-10,t);
if(carry)drawPup(carry.x,carry.y,t);
for(const b of bats){
x.save();x.translate(b.x,b.y);
const fl=Math.sin(b.fl)*6;
x.fillStyle='#2a3550';
x.beginPath();x.ellipse(0,0,9,7,0,0,7);x.fill();
x.beginPath();x.moveTo(-7,-2);x.quadraticCurveTo(-20,-10-fl,-26,2);x.quadraticCurveTo(-15,2,-7,4);x.fill();
x.beginPath();x.moveTo(7,-2);x.quadraticCurveTo(20,-10-fl,26,2);x.quadraticCurveTo(15,2,7,4);x.fill();
x.fillStyle='#ff5a5a';x.fillRect(-4,-2.5,2.6,2.6);x.fillRect(1.6,-2.5,2.6,2.6);
x.strokeStyle='#ff5a5a55';x.lineWidth=2;x.beginPath();x.moveTo(0,7);x.lineTo(0,18+fl);x.stroke();
if(b.pup&&b.pup.taken)drawPup(0,16,t);
x.restore()}
if(!(inv>0&&Math.floor(inv*10)%2===0)){
x.save();x.translate(ship.x,ship.y);x.scale(ship.dir,1);
const gg=x.createRadialGradient(0,0,4,0,0,34);gg.addColorStop(0,'rgba(150,255,190,.35)');gg.addColorStop(1,'rgba(150,255,190,0)');
x.fillStyle=gg;x.beginPath();x.arc(0,0,34,0,7);x.fill();
x.fillStyle='#3fae7f';x.beginPath();x.moveTo(18,0);x.lineTo(-10,-8);x.lineTo(-14,0);x.lineTo(-10,8);x.closePath();x.fill();
x.fillStyle='#66d9a5';x.beginPath();x.ellipse(2,-2,7,4,0,0,7);x.fill();
x.fillStyle='#bfefff';x.beginPath();x.arc(6,-3,2.6,0,7);x.fill();
x.fillStyle='#ffe89b';x.beginPath();x.arc(-14,0,3+Math.sin(t*30)*1.2,0,7);x.fill();
x.restore()}
for(const bo of bolts){
x.strokeStyle='#9bffe8';x.lineWidth=3;x.lineCap='round';
x.beginPath();x.moveTo(bo.x,bo.y);x.lineTo(bo.x-Math.sign(bo.vx)*14,bo.y);x.stroke()}
for(const s of sparks){x.globalAlpha=Math.max(0,s.t*1.6);x.fillStyle='#ffb35a';x.fillRect(s.x-1.5,s.y-1.5,3,3)}
x.globalAlpha=1;
x.restore();
if(waveMsg>0){x.fillStyle='rgba(255,232,155,'+Math.min(1,waveMsg)+')';x.font='700 26px system-ui';x.textAlign='center';x.direction='rtl';x.fillText('גל '+wave,W/2,H*.4)}
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw(ts/1000);requestAnimationFrame(loop)}
function setT(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
tx=cam+(t.clientX-r.left);ty=t.clientY-r.top}
cv.addEventListener('touchstart',e=>{e.preventDefault();setT(e)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();setT(e)},{passive:false});
window.addEventListener('mousemove',e=>{if(run)setT(e)});
window.setTarget=(nx,ny)=>{tx=nx;ty=ny};
Object.defineProperty(window,'score',{get:()=>score});Object.defineProperty(window,'run',{get:()=>run});
Object.defineProperty(window,'bats',{get:()=>bats});Object.defineProperty(window,'pups',{get:()=>pups});
Object.defineProperty(window,'ship',{get:()=>ship});
document.getElementById('startBtn').onclick=()=>{document.getElementById('startOvl').classList.add('hide');rs();start()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('overOvl').classList.add('hide');start()};
rs();pups=[];bats=[];bolts=[];sparks=[];ship={x:200,y:200,dir:1};cam=0;score=0;lives=3;wave=1;run=false;inv=0;carry=null;tx=200;ty=200;waveMsg=0;spawnT=1;fireT=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
