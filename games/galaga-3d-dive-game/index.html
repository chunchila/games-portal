<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>גלקסי 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#030712;color:#e2e8f0;font-family:'Heebo',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:520px;padding:11px 16px 2px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
h1{font-size:22px;color:#67e8f9}
.pill{background:#0f172a;border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.sub{font-size:13px;color:#94a3b8;padding:2px 16px 6px;max-width:520px}
#wrap{width:100%;max-width:520px;padding:0 8px}
canvas{width:100%;display:block;border-radius:14px;background:#030712;touch-action:none}
#ctl{width:100%;max-width:520px;display:flex;gap:8px;padding:8px}
#ctl button{flex:1;background:#164e63;border:none;border-radius:14px;color:#a5f3fc;font-size:22px;padding:14px;user-select:none;touch-action:none}
#ctl button:active{background:#155e75}
.overlay{position:fixed;inset:0;background:#030712d9;display:flex;align-items:center;justify-content:center;z-index:10}
.card{background:#082f3a;border:2px solid #67e8f955;border-radius:22px;padding:26px 22px;text-align:center;max-width:340px;width:88%}
.card h2{font-size:26px;margin-bottom:10px;color:#67e8f9}
.card p{font-size:15px;color:#cbd5e1;line-height:1.6;margin-bottom:16px}
.card button{background:#22d3ee;color:#082f3a;border:none;border-radius:999px;padding:12px 34px;font-size:17px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><h1>גלקסי 3D</h1><div class="pill">גל <span id="wave">1</span> &nbsp;<span id="lives">♥♥♥</span> &nbsp;<span id="score">0</span> &nbsp;שיא: <span id="best">0</span></div></header>
<div class="sub">הזיזו את הספינה וירו - רוחשים צוללים אליכם!</div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ctl"><button id="leftB">▶</button><button id="fireB">ירי</button><button id="rightB">◀</button></div>
<div class="overlay" id="start"><div class="card"><h2>גלקסי 3D</h2><p>מבנה האויב מצטבר מעליכם בתלת-מימד, ואז הם צוללים לתקוף. פוצצו אותם לפני שיגיעו!</p><button id="startBtn">שחקו</button></div></div>
<div class="overlay" id="over" style="display:none"><div class="card"><h2>נגמר!</h2><p id="finalText"></p><button id="againBtn">שחקו שוב</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=390,H=560;c.width=W;c.height=H;
const F=380,CAM={x:0,y:7,z:-12};
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave');
let best=+localStorage.getItem('gal3d_best')||0;bestEl.textContent=best;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return `rgb(${r},${g},${b})`}
function proj(px,py,pz){const dz=pz-CAM.z;if(dz<0.5)return null;const s=F/dz;return [W/2+(px-CAM.x)*s,H*0.6-(py-CAM.y)*s,s]}
function box3(faces,px,py,pz,s,col){const h=s/2,x0=px-h,x1=px+h,y0=py-h,y1=py+h,z0=pz-h,z1=pz+h;
  faces.push({z:pz,pts:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],col});
  faces.push({z:pz,pts:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],col:shade(col,40)});
  if(px>0.2)faces.push({z:pz,pts:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],col:shade(col,-40)});
  else if(px<-0.2)faces.push({z:pz,pts:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],col:shade(col,-40)});}
let px,bolts,ebul,enemies,score,lives,wave,run,t,shake,faces;
const keys={};
const ENCOLS=['#f87171','#facc15','#4ade80','#c084fc'];
function homePos(e){const sway=Math.sin(t*0.015+e.seed)*2.2;return [-7+e.col*3.5+sway,6.5+e.row*2.4,30+e.row*4]}
function spawnWave(){
  enemies=[];
  for(let r=0;r<3;r++)for(let col=0;col<5;col++)
    enemies.push({col,row:r,seed:r*5+col,mode:'home',x:0,y:0,z:0,alive:true,vt:0});
  waveEl.textContent=wave;}
function reset(){score=0;lives=3;wave=1;px=0;bolts=[];ebul=[];run=true;t=0;shake=0;spawnWave();hud()}
function hud(){scoreEl.textContent=score;livesEl.textContent='♥'.repeat(Math.max(0,lives))||'-';if(score>best){best=score;localStorage.setItem('gal3d_best',best);bestEl.textContent=best}}
function fire(){if(!run)return;if(bolts.length<3)bolts.push({x:px,z:3})}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key===' ')fire()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});
function bindHold(id,on,off){const b=document.getElementById(id);
  const s=e=>{e.preventDefault();on()},e2=e=>{e.preventDefault();off&&off()};
  b.addEventListener('touchstart',s,{passive:false});b.addEventListener('touchend',e2);
  b.addEventListener('mousedown',s);b.addEventListener('mouseup',e2);b.addEventListener('mouseleave',e2)}
bindHold('leftB',()=>keys.l=true,()=>keys.l=false);
bindHold('rightB',()=>keys.r=true,()=>keys.r=false);
bindHold('fireB',()=>fire());
let dragging=false;
c.addEventListener('touchstart',e=>{e.preventDefault();dragging=true},{passive:false});
c.addEventListener('touchmove',e=>{if(!dragging)return;const r=c.getBoundingClientRect();const mx=(e.changedTouches[0].clientX-r.left)/r.width;px=Math.max(-4,Math.min(4,(mx-0.5)*22))},{passive:false});
c.addEventListener('touchend',()=>dragging=false);
function loseLife(){lives--;hud();shake=28;if(lives<=0){run=false;document.getElementById('finalText').textContent=`צברתם ${score} נקודות והגעתם לגל ${wave}. שיא: ${best}.`;document.getElementById('over').style.display='flex'}}
function update(){
  if(!run)return;
  t++;
  if(keys.l)px-=0.26;if(keys.r)px+=0.26;px=Math.max(-4,Math.min(4,px));
  for(let i=bolts.length-1;i>=0;i--){bolts[i].z+=1.1;if(bolts[i].z>75)bolts.splice(i,1)}
  for(let i=ebul.length-1;i>=0;i--){const b=ebul[i];b.z-=0.55;if(b.z<3.4&&Math.abs(b.x-px)<1.1){ebul.splice(i,1);loseLife();if(!run)return}else if(b.z<2)ebul.splice(i,1)}
  // enemy logic
  const alive=enemies.filter(e=>e.alive);
  if(!alive.length){wave++;spawnWave();return}
  if(t%Math.max(30,80-wave*4)===0){
    const homes=alive.filter(e=>e.mode==='home');
    if(homes.length){const e=homes[Math.floor(Math.random()*homes.length)];e.mode='dive';const[hx,hy,hz]=homePos(e);e.x=hx;e.y=hy;e.z=hz;e.vt=0}}
  for(const e of alive){
    if(e.mode==='home'){const[hx,hy,hz]=homePos(e);e.x=hx;e.y=hy;e.z=hz;
      if(t%Math.max(50,110-wave*5)===e.seed%40&&Math.random()<0.5)ebul.push({x:e.x,z:e.z-1})}
    else if(e.mode==='dive'){
      e.vt+=0.008;
      const dir=px>e.x?1:-1;
      e.x+=dir*0.05+e.vt*dir*0.6;
      e.z-=0.32+e.vt*1.1;e.y=Math.max(1.2,e.y-0.06);
      if(e.z<3.5&&Math.abs(e.x-px)<1.3){e.alive=false;loseLife();if(!run)return}
      if(e.z<1.5||e.y<=1.25){e.mode='return'}}
    else{ // return home
      const[hx,hy,hz]=homePos(e);
      e.x+=(hx-e.x)*0.04;e.y+=(hy-e.y)*0.04;e.z+=(hz-e.z)*0.04;
      if(Math.abs(hz-e.z)<1)e.mode='home';}
    // bullet hits
    for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];
      if(Math.abs(b.x-e.x)<1.4&&Math.abs(b.z-e.z)<1.6){bolts.splice(i,1);e.alive=false;score+=10*(4-e.row)+(e.mode!=='home'?30:0);hud();break}}
  }
}
function draw(){
  faces=[];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020617');g.addColorStop(1,'#082f3a');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#e2e8f0';for(let i=0;i<50;i++){x.globalAlpha=0.3+((i*37)%50)/100;x.fillRect((i*83)%W,(i*61)%Math.floor(H*0.5),1.6,1.6)}x.globalAlpha=1;
  for(let gx=-12;gx<=12;gx+=3){const a=proj(gx,0,3),b=proj(gx,0,72);if(a&&b){x.strokeStyle='#164e6355';x.lineWidth=1;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}}
  for(let gz=6;gz<=72;gz+=6){const a=proj(-12,0,gz),b=proj(12,0,gz);if(a&&b){x.strokeStyle='#164e6355';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}}
  for(const e of enemies){if(!e.alive)continue;const col=ENCOLS[e.row];
    box3(faces,e.x,e.y,e.z,1.6,col);
    box3(faces,e.x-1.3,e.y+0.5,e.z,0.7,col);
    box3(faces,e.x+1.3,e.y+0.5,e.z,0.7,col);}
  for(const b of bolts)box3(faces,b.x,1.4,b.z,0.5,'#f8fafc');
  for(const b of ebul)box3(faces,b.x,1.2,b.z,0.7,'#fb7185');
  box3(faces,px,1,3,1.9,'#22d3ee');
  box3(faces,px,2,3.5,0.9,'#a5f3fc');
  box3(faces,px-1.8,0.7,3,1,'#0e7490');
  box3(faces,px+1.8,0.7,3,1,'#0e7490');
  faces.sort((a,b)=>b.z-a.z);
  for(const f of faces){const ps=f.pts.map(p=>proj(p[0],p[1],p[2]));if(ps.some(p=>!p))continue;
    x.fillStyle=f.col;x.beginPath();x.moveTo(ps[0][0],ps[0][1]);for(let i=1;i<4;i++)x.lineTo(ps[i][0],ps[i][1]);x.closePath();x.fill()}
  if(shake>0){shake--;if(shake%4<2){x.fillStyle='#ef444422';x.fillRect(0,0,W,H)}}
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();run=false;draw();
document.getElementById('startBtn').onclick=()=>{document.getElementById('start').style.display='none';reset();loop()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('over').style.display='none';reset();loop()};
</script>
</body>
</html>
