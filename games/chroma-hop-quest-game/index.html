<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>קמה והפירמידה הבוהקת</title>
<style>
html,body{margin:0;padding:0;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:15px;background:linear-gradient(180deg,#141b33,#0b1020)}
#hud b{font-size:17px}
#cv{flex:1;display:block;width:100%;touch-action:none}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,26,.92);text-align:center;padding:24px;z-index:5}
.ovl h1{font-size:30px;margin:0 0 10px;color:#ffd75e;text-shadow:0 2px 12px #ff9d0088}
.ovl p{font-size:15px;line-height:1.7;color:#cdd6f4;margin:0 0 22px;max-width:320px}
button{background:linear-gradient(180deg,#ffd75e,#ff9d00);border:0;border-radius:999px;padding:14px 42px;font-size:19px;font-weight:700;color:#3a2500;box-shadow:0 4px 18px #ff9d0055;cursor:pointer}
button:active{transform:scale(.96)}
.hide{display:none!important}
#hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#5b6a94;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<div id="hud"><div>ניקוד: <b id="sc">0</b></div><div>שלב <b id="lv">1</b></div><div id="lives">♥♥♥</div></div>
<canvas id="cv"></canvas>
<div id="hint">החליקו באלכסון כדי לקפוץ בין הקוביות</div>
<div class="ovl" id="startOvl">
<h1>קמה והפירמידה הבוהקת</h1>
<p>קמה הזיקית אובדת בפירמידת קריסטלים עתיקה. קפצו על כל קוביה כדי להדליק אותה בזהב, אבל היזהרו מנחש הצללים המזדחל במורד! החליקו באלכסון לכל כיוון.</p>
<button id="startBtn">שחקו</button>
</div>
<div class="ovl hide" id="overOvl">
<h1 id="overT">נגמר המשחק</h1>
<p id="overP"></p>
<button id="againBtn">שחקו שוב</button>
</div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),x=cv.getContext('2d');
const scEl=document.getElementById('sc'),lvEl=document.getElementById('lv'),livesEl=document.getElementById('lives');
let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);x.direction='ltr'}
window.addEventListener('resize',rs);
const ROWS=7;
let grid=[],level=1,score=0,lives=3,run=false;
let pr=0,pc=0,px=0,py=0,hopA=null,snake=null,flash=0,deadT=0,winAll=false;
function pos(r,c){return{x:W/2+(c-r/2)*46,y:60+r*50}}
function colAt(r){return 60+r*50}
function mkGrid(){grid=[];for(let r=0;r<ROWS;r++){const row=[];for(let c=0;c<=r;c++)row.push(0);grid.push(row)}}
function target(){return level>=3?3:level}
function start(){score=0;level=1;lives=3;run=true;winAll=false;newLevel();upd()}
function newLevel(){mkGrid();pr=0;pc=0;const p=pos(0,0);px=p.x;py=p.y;hopA=null;snake=null;flash=0;snakeTimer=4}
let snakeTimer=4,last=0;
function hopDir(k){ // 0=up-left 1=up-right 2=down-left 3=down-right (screen)
if(!run||hopA||deadT>0)return;
let nr=pr,nc=pc;
if(k===0){nr=pr-1;nc=pc-1}else if(k===1){nr=pr-1;nc=pc}else if(k===2){nr=pr+1;nc=pc}else{nr=pr+1;nc=pc+1}
if(nr<0||nr>=ROWS||nc<0||nc>nr){fall();return}
const a=pos(pr,pc),b=pos(nr,nc);
hopA={t:0,ax:a.x,ay:a.y-14,bx:b.x,by:b.y-14,nr,nc}}
function fall(){hopA={t:0,ax:px,ay:py-14,bx:px+(px<W/2?-60:60),by:H+40,nr:-1,nc:-1,falling:true}}
function upd(){scEl.textContent=score;lvEl.textContent=level;livesEl.textContent='♥'.repeat(Math.max(0,lives))}
function life(){lives--;upd();flash=1;deadT=1.2;hopA=null;snake=null;snakeTimer=4;if(lives<=0){setTimeout(()=>{run=false;document.getElementById('overT').textContent='נגמר המשחק';document.getElementById('overP').textContent='קמה אספה '+score+' נקודות בדרך דרך הקריסטלים.';document.getElementById('overOvl').classList.remove('hide')},900)}else{pr=0;pc=0;const p=pos(0,0);px=p.x;py=p.y}}
function step(dt){
if(flash>0)flash-=dt*2;
if(deadT>0){deadT-=dt;return}
if(hopA){hopA.t+=dt/0.2;if(hopA.t>=1){if(hopA.falling){life();return}
pr=hopA.nr;pc=hopA.nc;const p=pos(pr,pc);px=p.x;py=p.y;
if(grid[pr][pc]<target()){grid[pr][pc]++;score+=25;if(grid[pr][pc]===target())score+=15;upd()}
if(snake&&snake.r===pr&&snake.c===pc){life();return}
if(grid.every(row=>row.every(v=>v===target()))){score+=300;upd();flash=1.4;if(level>=3){run=false;winAll=true;document.getElementById('overT').textContent='כל הכבוד!';document.getElementById('overP').textContent='קמה הדליקה את כל הפירמידות! ניקוד סופי: '+score;document.getElementById('overOvl').classList.remove('hide')}else setTimeout(()=>{level++;newLevel();upd()},900)}
hopA=null}else{const t=hopA.t,arc=Math.sin(t*Math.PI)*26;px=hopA.ax+(hopA.bx-hopA.ax)*t;py=hopA.ay+(hopA.by-hopA.ay)*t-arc}}
if(!snake){snakeTimer-=dt;if(snakeTimer<=0){snake={r:0,c:0,t:0,px:0,py:0};const p=pos(0,0);snake.px=p.x;snake.py=p.y-90;snake.drop=true}}
else{const s=snake;s.t+=dt/0.55;
if(s.t>=1){s.t=0;
if(s.drop){s.drop=false}else{
const opts=[];if(s.r+1<ROWS){opts.push([s.r+1,s.c],[s.r+1,s.c+1])}
if(opts.length){const o=opts[Math.floor(Math.random()*opts.length)];s.r=o[0];s.c=o[1]}
else{s.r=0;s.c=0;s.drop=true;const p0=pos(0,0);s.px=p0.x;s.py=p0.y-90}}
const p=pos(s.r,s.c);s.px=p.x;s.py=p.y;
if(!s.drop&&s.r===pr&&s.c===pc&&!hopA)life()}
}
}
function cube(cx,cy,v){
const top=v===target()?'#ffd75e':(v>0?'#7fd4ff':'#3b4a72');
const left=v===target()?'#d9a92e':(v>0?'#4fa3d8':'#2a3757');
const right=v===target()?'#b8891f':(v>0?'#3a86b8':'#212c46');
x.beginPath();x.moveTo(cx,cy-12);x.lineTo(cx+23,cy+1);x.lineTo(cx,cy+14);x.lineTo(cx-23,cy+1);x.closePath();x.fillStyle=top;x.fill();
x.beginPath();x.moveTo(cx-23,cy+1);x.lineTo(cx,cy+14);x.lineTo(cx,cy+34);x.lineTo(cx-23,cy+21);x.closePath();x.fillStyle=left;x.fill();
x.beginPath();x.moveTo(cx+23,cy+1);x.lineTo(cx,cy+14);x.lineTo(cx,cy+34);x.lineTo(cx+23,cy+21);x.closePath();x.fillStyle=right;x.fill();
if(v===target()){x.strokeStyle='#fff3c4';x.lineWidth=1.5;x.beginPath();x.moveTo(cx,cy-12);x.lineTo(cx+23,cy+1);x.lineTo(cx,cy+14);x.lineTo(cx-23,cy+1);x.closePath();x.stroke()}
}
function drawKama(cx,cy,t){
x.save();x.translate(cx,cy-16);
x.fillStyle='#2fae5f';
x.beginPath();x.ellipse(0,0,11,9,0,0,7);x.fill();
const g=x.createLinearGradient(-8,-8,8,8);g.addColorStop(0,'#5fe08b');g.addColorStop(1,'#1e8f4a');
x.fillStyle=g;x.beginPath();x.ellipse(0,-1,10,8,0,0,7);x.fill();
x.strokeStyle='#2fae5f';x.lineWidth=3;x.beginPath();x.arc(9,4,7,-0.4,1.6*Math.PI);x.stroke();
x.fillStyle='#2fae5f';x.beginPath();x.ellipse(-6,-9,6,6,0,0,7);x.fill();
x.fillStyle='#fff';x.beginPath();x.arc(-7,-10,3.4,0,7);x.fill();
x.fillStyle='#123';x.beginPath();x.arc(-7.6,-10,1.6,0,7);x.fill();
x.strokeStyle='#1e8f4a';x.lineWidth=2;
for(const lx of[-6,0,6]){x.beginPath();x.moveTo(lx,7);x.lineTo(lx-2,12);x.stroke()}
x.fillStyle='#ffd75e';x.beginPath();x.arc(-10,-14,1.5+Math.sin(t*6)*.5,0,7);x.fill();
x.restore()}
function drawSnake(s){
x.save();x.translate(s.px,s.py-16);
for(let i=2;i>=0;i--){x.fillStyle=i?'#7b3fd4':'#a06bff';x.beginPath();x.arc(0,i*7,7-i*1.4,0,7);x.fill()}
x.fillStyle='#ffd75e';x.beginPath();x.arc(-2.5,-2,1.6,0,7);x.arc(2.5,-2,1.6,0,7);x.fill();
x.restore()}
function draw(t){
x.clearRect(0,0,W,H);
const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101736');bg.addColorStop(1,'#070a18');x.fillStyle=bg;x.fillRect(0,0,W,H);
x.fillStyle='#ffffff14';for(let i=0;i<26;i++){x.fillRect((i*97)%W,(i*53)%Math.max(1,H*.5),2,2)}
for(let r=ROWS-1;r>=0;r--)for(let c=0;c<=r;c++){const p=pos(r,c);cube(p.x,p.y+10,grid[r][c])}
if(snake)drawSnake(snake);
if(deadT<=0||Math.floor(deadT*8)%2===0)drawKama(px,py,t);
if(flash>0){x.fillStyle='rgba(255,215,94,'+Math.max(0,flash*.35)+')';x.fillRect(0,0,W,H)}
}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw(ts/1000);requestAnimationFrame(loop)}
let ts0=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];ts0={x:t.clientX,y:t.clientY}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!ts0)return;const t=e.changedTouches[0];const dx=t.clientX-ts0.x,dy=t.clientY-ts0.y;ts0=null;
if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
if(dy<0){hopDir(dx<0?0:1)}else{hopDir(dx<0?2:3)}},{passive:false});
window.addEventListener('keydown',e=>{const k=e.key;
if(k==='q')hopDir(0);else if(k==='e')hopDir(1);else if(k==='a'||k==='z')hopDir(2);else if(k==='d'||k==='x')hopDir(3)});
document.getElementById('startBtn').onclick=()=>{document.getElementById('startOvl').classList.add('hide');rs();start()};
document.getElementById('againBtn').onclick=()=>{document.getElementById('overOvl').classList.add('hide');start()};
window.hopDir=hopDir;Object.defineProperty(window,'score',{get:()=>score});Object.defineProperty(window,'run',{get:()=>run});
rs();mkGrid();requestAnimationFrame(loop);
</script>
</body>
</html>
