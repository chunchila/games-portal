<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>סיימון - זיכרון צבעים וצלילים</title><style>*{margin:0;box-sizing:border-box}body{background:#14122b;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;touch-action:manipulation;user-select:none}h1{margin:12px;font-size:24px;color:#ff9ad5}#b{position:relative;width:min(88vw,330px);aspect-ratio:1;margin:14px;border-radius:50%;background:#222;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:0 0 30px #7b61ff55}.p{border:0;opacity:.55;transition:.1s}.p.a{opacity:1;filter:brightness(1.4);box-shadow:0 0 30px currentColor}#p0{background:#2ecc71;color:#2ecc71;border-radius:100% 0 0 0}#p1{background:#e74c3c;color:#e74c3c;border-radius:0 100% 0 0}#p2{background:#f1c40f;color:#f1c40f;border-radius:0 0 0 100%}#p3{background:#3498db;color:#3498db;border-radius:0 0 100% 0}#ctr{position:absolute;inset:34%;border-radius:50%;background:#14122b;border:4px solid #444;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}button.s{background:#ff9ad5;color:#222;border:0;border-radius:14px;padding:12px 28px;font-size:18px;font-weight:800;margin:8px}</style></head><body><h1>סיימון</h1><div id="st">לחצו התחל</div><div id="b"><button class="p" id="p0"></button><button class="p" id="p1"></button><button class="p" id="p2"></button><button class="p" id="p3"></button><div id="ctr">0</div></div><div>שיא: <b id="bs">0</b></div><button class="s" id="go">התחל</button>
<script>
let seq=[],pos=0,busy=true,best=+localStorage.simonBest||0;bs.textContent=best;const F=[330,415,247,520];let AC;
function tone(i,d=300){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=F[i];g.gain.setValueAtTime(.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d/1000);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d/1000)}catch(e){}}
function lit(i,d=300){const e=document.getElementById('p'+i);e.classList.add('a');tone(i,d);setTimeout(()=>e.classList.remove('a'),d)}
const sl=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){busy=true;st.textContent='צפו ברצף...';await sl(600);const d=Math.max(160,380-seq.length*12);for(const i of seq){lit(i,d);await sl(d+130)}busy=false;pos=0;st.textContent='תורכם!'}
function next(){seq.push(Math.random()*4|0);ctr.textContent=seq.length-1;play()}
async function press(i){if(busy)return;lit(i,200);if(i!==seq[pos]){busy=true;st.textContent='טעות! הגעתם לרצף '+(seq.length-1);if(seq.length-1>best){best=seq.length-1;localStorage.simonBest=best;bs.textContent=best}return}
 pos++;if(pos===seq.length){busy=true;ctr.textContent=seq.length;st.textContent='נכון!';await sl(700);next()}}
[0,1,2,3].forEach(i=>document.getElementById('p'+i).addEventListener('pointerdown',e=>{e.preventDefault();press(i)}));
go.onclick=()=>{seq=[];next()};
</script></body></html>
