<style>
:root{--bg:#0c1226;--card:#141c38;--accent:#818cf8;--accent2:#fbbf24;--good:#34d399;--text:#eef0ff;--muted:#9aa4cc;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;height:100%;}
body{font-family:'Rubik',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1000px 700px at 85% -10%,#818cf822,transparent),

.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1;}

.hero p{color:var(--muted);font-size:17px;max-width:330px;margin:0;line-height:1.65;}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:16px;color:#1e1b4b;
  background:linear-gradient(135deg,var(--accent),#c7d2fe);padding:15px 42px;font-size:19px;
  box-shadow:0 8px 24px #818cf844,inset 0 1px 0 #ffffff88;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid #ffffff22;font-weight:600;padding:12px 24px;font-size:15px;}
.hud{display:flex;gap:8px;margin:8px 0;}
.hud .pill{flex:1;text-align:center;}
.msg{min-height:30px;text-align:center;font-weight:800;font-size:17px;margin:4px 0;}
.msg.win{color:var(--good);}
.board-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 0 14px;}
#board{position:relative;background:linear-gradient(160deg,#1e2a52,#16204a);border-radius:20px;padding:12px;
  box-shadow:0 16px 44px #00000077,inset 0 2px 0 #ffffff14;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;cursor:pointer;overflow:hidden;}
.cell{aspect-ratio:1;border-radius:50%;background:#0c1226;box-shadow:inset 0 3px 8px #000000aa;position:relative;}
.disc{position:absolute;inset:0;border-radius:50%;transform:translateY(-640px);transition:transform .38s cubic-bezier(.34,1.4,.64,1);}
.disc.p1{background:radial-gradient(circle at 32% 28%,#fda4af,#e11d48);}
.disc.p2{background:radial-gradient(circle at 32% 28%,#fde68a,#d97706);}
.disc.drop{transform:translateY(0);}
.disc.winner{box-shadow:0 0 0 3px #fff,0 0 18px #fff;}
.controls{display:flex;gap:10px;justify-content:center;padding-bottom:20px;}
.controls .btn{padding:12px 26px;font-size:16px;}
.thinking{color:var(--muted);}

<body>
<div class="wrap">
  <header>
    <div class="logo">🔴 ארבע בשורה</div>
    <div class="pill" id="recordTop">0 : 0</div>
  </header>

  <section id="scrStart" class="screen active">
    <div class="hero">
      <h1>🔴 ארבע בשורה 🟡</h1>
      <p>אתם האדומים, המחשב הצהוב. הורידו דיסקיות לעמודות ורשמו ארבעה ברצף - אופקי, אנכי או אלכסוני. המחשב לא מרשה לעצמו.</p>
      <button class="btn" id="btnStart">התחילו ▶</button>
    </div>
  </section>

  <section id="scrGame" class="screen">
    <div class="hud">
      <div class="pill">🔴 אתם: <span id="myWins">0</span></div>
      <div class="pill">🤖 מחשב: <span id="aiWins">0</span></div>
    </div>
    <div class="msg" id="msg">תורכם - בחרו עמודה</div>
    <div class="board-zone"><div id="board"></div></div>
    <div class="controls">
      <button class="btn ghost" id="btnRestart">↺ משחק חדש</button>
    </div>
  </section>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const ROWS=6,COLS=7,DEPTH=6;
let grid,over,lock,cells;
let rec=JSON.parse(ArcadiaStorage.getItem('c4_rec')||'{"w":0,"l":0}');
function updRec(){$('recordTop').textContent=rec.w+' : '+rec.l;$('myWins').textContent=rec.w;$('aiWins').textContent=rec.l;}
updRec();
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function start(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  over=false;lock=false;
  const b=$('board');b.innerHTML='';cells=[];
  const size=Math.min(innerWidth-56,430);
  b.style.width=size+'px';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=document.createElement('div');d.className='cell';d.dataset.c=c;
    b.appendChild(d);cells.push(d);
  }
  $('msg').textContent='תורכם - בחרו עמודה';$('msg').className='msg';
  show('scrGame');
}
function cellEl(r,c){return cells[r*COLS+c];}
function dropRow(g,c){for(let r=ROWS-1;r>=0;r--)if(g[r][c]===0)return r;return -1;}
function placeDisc(r,c,p){
  const d=document.createElement('div');d.className='disc p'+p;
  cellEl(r,c).appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('drop')));
}
function winLine(g,p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(g[r][c]!==p)continue;
    for(const[dr,dc]of dirs){
      let line=[[r,c]];
      for(let k=1;k<4;k++){
        const nr=r+dr*k,nc=c+dc*k;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS||g[nr][nc]!==p){line=null;break;}
        line.push([nr,nc]);
      }
      if(line)return line;
    }
  }
  return null;
}
function full(g){return g[0].every(v=>v!==0);}
// --- AI: minimax with alpha-beta ---
function scoreWindow(w,p){
  const o=p===2?1:2;
  const mine=w.filter(v=>v===p).length,opp=w.filter(v=>v===o).length,empty=w.filter(v=>v===0).length;
  if(mine===4)return 100000;
  if(mine===3&&empty===1)return 60;
  if(mine===2&&empty===2)return 8;
  if(opp===3&&empty===1)return -90;
  if(opp===2&&empty===2)return -6;
  return 0;
}
function evalBoard(g,p){
  let s=0;
  for(let r=0;r<ROWS;r++)if(g[r][3]===p)s+=4;
  for(let r=0;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=scoreWindow([g[r][c],g[r][c+1],g[r][c+2],g[r][c+3]],p);
  for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS-4;r++)s+=scoreWindow([g[r][c],g[r+1][c],g[r+2][c],g[r+3][c]],p);
  for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++)s+=scoreWindow([g[r][c],g[r+1][c+1],g[r+2][c+2],g[r+3][c+3]],p);
  for(let r=3;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=scoreWindow([g[r][c],g[r-1][c+1],g[r-2][c+2],g[r-3][c+3]],p);
  return s;
}
function minimax(g,depth,alpha,beta,maxing){
  if(winLine(g,2))return[null,1000000+depth];
  if(winLine(g,1))return[null,-1000000-depth];
  if(full(g)||depth===0)return[null,evalBoard(g,2)];
  const order=[3,2,4,1,5,0,6];
  let bestCol=order[0];
  if(maxing){
    let val=-Infinity;
    for(const c of order){
      const r=dropRow(g,c);if(r<0)continue;
      g[r][c]=2;
      const sc=minimax(g,depth-1,alpha,beta,false)[1];
      g[r][c]=0;
      if(sc>val){val=sc;bestCol=c;}
      alpha=Math.max(alpha,val);if(alpha>=beta)break;
    }
    return[bestCol,val];
  }else{
    let val=Infinity;
    for(const c of order){
      const r=dropRow(g,c);if(r<0)continue;
      g[r][c]=1;
      const sc=minimax(g,depth-1,alpha,beta,true)[1];
      g[r][c]=0;
      if(sc<val){val=sc;bestCol=c;}
      beta=Math.min(beta,val);if(alpha>=beta)break;
    }
    return[bestCol,val];
  }
}
$('board').addEventListener('click',e=>{
  if(over||lock)return;
  const cell=e.target.closest('.cell');if(!cell)return;
  const c=+cell.dataset.c;
  const r=dropRow(grid,c);if(r<0)return;
  grid[r][c]=1;placeDisc(r,c,1);
  const w=winLine(grid,1);
  if(w)return finish(1,w);
  if(full(grid))return finish(0,null);
  lock=true;$('msg').textContent='המחשב חושב...';$('msg').className='msg thinking';
  setTimeout(()=>{
    const [ac]=minimax(grid,DEPTH,-Infinity,Infinity,true);
    const ar=dropRow(grid,ac);
    grid[ar][ac]=2;placeDisc(ar,ac,2);
    const w2=winLine(grid,2);
    if(w2)return finish(2,w2);
    if(full(grid))return finish(0,null);
    lock=false;$('msg').textContent='תורכם - בחרו עמודה';$('msg').className='msg';
  },350);
});
function finish(winner,line){
  over=true;lock=false;
  if(line)line.forEach(([r,c])=>cellEl(r,c).firstChild?.classList.add('winner'));
  if(winner===1){rec.w++;$('msg').textContent='ניצחתם! 🔴🎉';$('msg').className='msg win';}
  else if(winner===2){rec.l++;$('msg').textContent='המחשב ניצח 🤖 עוד ניסיון?';}
  else{$('msg').textContent='תיקו! הלוח מלא 🤝';}
  ArcadiaStorage.setItem('c4_rec',JSON.stringify(rec));updRec();
}
$('btnStart').onclick=start;
$('btnRestart').onclick=start;
</script>
