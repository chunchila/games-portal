<head><script>const ArcadiaStorage=(()=>{const s=window.localStorage,p='arcadia:neon-breaker:';return{getItem:k=>s.getItem(p+k),setItem:(k,v)=>s.setItem(p+k,v),removeItem:k=>s.removeItem(p+k),clear:()=>Object.keys(s).filter(k=>k.startsWith(p)).forEach(k=>s.removeItem(k)),key:i=>Object.keys(s).filter(k=>k.startsWith(p))[i]?.slice(p.length),get length(){return Object.keys(s).filter(k=>k.startsWith(p)).length}}})();</script>

<style>
:root{--bg:#070714;--card:#12122b;--accent:#22d3ee;--accent2:#f472b6;--text:#eef2ff;--muted:#94a3c8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;height:100%;overflow:hidden;}
body{font-family:'Rubik',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1000px 700px at 85% -10%,#22d3ee18,transparent),
             radial-gradient(800px 600px at -10% 110%,#f472b615,transparent),var(--bg);
  display:flex;flex-direction:column;align-items:center;min-height:100%;
  padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);}
.wrap{width:100%;max-width:540px;display:flex;flex-direction:column;flex:1;min-height:0;}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 4px;}
.logo{font-weight:900;font-size:23px;background:linear-gradient(90deg,var(--accent),#a5f3fc,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.pill{background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:4px 13px;font-weight:600;font-size:14px;}
.screen{display:none;flex-direction:column;flex:1;min-height:0;animation:fade .3s ease;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:16px 0 36px;}
.hero h1{font-size:48px;margin:0;background:linear-gradient(135deg,var(--accent),#a5f3fc 50%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px #22d3ee44);}
.hero p{color:var(--muted);font-size:16px;max-width:330px;margin:0;line-height:1.65;}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:16px;color:#06222b;
  background:linear-gradient(135deg,var(--accent),#a5f3fc);padding:15px 42px;font-size:19px;
  box-shadow:0 8px 24px #22d3ee44,inset 0 1px 0 #ffffff88;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid #ffffff22;font-weight:600;padding:12px 24px;font-size:15px;}
.best-chip{color:var(--accent2);font-weight:700;font-size:14px;}
.hud{display:flex;gap:8px;margin:4px 0 8px;}
.hud .pill{flex:1;text-align:center;}
#game{flex:1;min-height:0;display:flex;}
canvas{flex:1;border-radius:16px;background:#0a0a1f;touch-action:none;box-shadow:0 10px 40px #00000077,inset 0 0 60px #22d3ee11;}
.overlay-msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:#070714cc;backdrop-filter:blur(6px);}
.overlay-msg.show{display:flex;}
.ov-card{background:linear-gradient(160deg,#141434,#0c0c22);border:1px solid #ffffff1c;border-radius:24px;padding:28px 34px;text-align:center;max-width:320px;box-shadow:0 24px 60px #000000aa;}
.ov-card h2{margin:0 0 6px;font-size:28px;}
.ov-card .score-big{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--accent2),#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ov-card p{color:var(--muted);margin:6px 0 16px;}
.ov-card .row{display:flex;gap:10px;justify-content:center;margin-top:14px;}
.ov-card .btn{padding:12px 22px;font-size:16px;}
</style>

<style id="arc-v2">
@font-face{font-family:'Rubik';font-weight:400;font-display:swap;src:url(/assets/fonts/rubik-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}

@font-face{font-family:'Rubik';font-weight:600;font-display:swap;src:url(/assets/fonts/rubik-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:600;font-display:swap;src:url(/assets/fonts/rubik-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Rubik';font-weight:800;font-display:swap;src:url(/assets/fonts/rubik-hebrew-800-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-weight:800;font-display:swap;src:url(/assets/fonts/rubik-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

body{background:radial-gradient(1100px 620px at 85% -10%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 62%),radial-gradient(900px 620px at -12% 112%,color-mix(in srgb,var(--accent2) 11%,transparent),transparent 62%),radial-gradient(#ffffff08 1px,transparent 1.4px) 0 0/32px 32px,var(--bg)}
.logo{letter-spacing:-.5px}
.pill{border-color:#ffffff21;box-shadow:inset 0 1px 0 #ffffff0f,0 4px 14px -6px #00000088;backdrop-filter:blur(8px)}
.hero h1{letter-spacing:-1.5px}
.btn{position:relative;overflow:hidden;transition:transform .15s cubic-bezier(.34,1.4,.4,1),box-shadow .25s,filter .2s}
.btn:not(.ghost){box-shadow:0 10px 30px -8px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 1px 0 #ffffff52}

.btn:not(.ghost):hover::after{transform:translateX(-130%)}
.btn.ghost{transition:transform .15s,background .2s,border-color .2s}
.btn.ghost:hover{background:#ffffff10;border-color:#ffffff3a;color:var(--text)}
.overlay-msg{background:#04050ed2;backdrop-filter:blur(12px)}
.ov-card{border-color:#ffffff26;box-shadow:0 30px 90px -18px #000,inset 0 1px 0 #ffffff12}
canvas{border:1px solid #22d3ee22}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">💥 שובר הניאון</div>
    <div class="pill">🏆 <span id="bestTop">0</span></div>
  </header>

  <section id="scrStart" class="screen active">
    <div class="hero">
      <h1>💥 שובר הניאון</h1>
      <p>גררו את המשטח, שברו את כל לבני הניאון ותפסו שדרוגים: ⤢ משטח רחב · ⚡ כדורים · 🐌 האטה. 3 חיים, הרמות רק נעשות קשות יותר.</p>
      <button class="btn" id="btnStart">שחקו ▶</button>
      <div class="best-chip" id="bestChip"></div>
    </div>
  </section>

  <section id="scrGame" class="screen">
    <div class="hud">
      <div class="pill">⭐ <span id="score">0</span></div>
      <div class="pill">שלב <span id="level">1</span></div>
      <div class="pill">❤️ <span id="lives">3</span></div>
    </div>
    <div id="game"><canvas id="cv"></canvas></div>
  </section>
</div>

<div class="overlay-msg" id="overlay">
  <div class="ov-card">
    <h2 id="ovTitle">סוף המשחק</h2>
    <div class="score-big" id="ovScore">0</div>
    <p id="ovText"></p>
    <div class="row">
      <button class="btn" id="btnAgain">עוד פעם 🔁</button>
      <button class="btn ghost" id="btnShare">שתפו 📤</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let W=0,H=0,DPR=2,running=false;
let paddle,balls,bricks,pups,score,lives,level,best=+ArcadiaStorage.getItem('neon_best')||0;
$('bestTop').textContent=best;if(best)$('bestChip').textContent='השיא שלכם: '+best+' נקודות';
const COLS=['#22d3ee','#a78bfa','#f472b6','#fbbf24','#34d399'];
function resize(){
  const r=cv.getBoundingClientRect();
  W=r.width;H=r.height;
  cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(()=>{resize();}).observe(cv);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');requestAnimationFrame(resize);}
function start(){
  score=0;lives=3;level=1;
  $('score').textContent=0;$('lives').textContent=3;$('level').textContent=1;
  show('scrGame');
  setTimeout(()=>{resize();setupLevel();running=true;requestAnimationFrame(step);},60);
}
function setupLevel(){
  paddle={w:Math.min(W*.22,110),h:12,x:W/2,y:H-34,wide:0};
  pups=[];
  spawnBall(W/2,H-60);
  buildBricks();
}
function spawnBall(x,y){
  const sp=4.6+level*.35;
  const ang=-Math.PI/2+(Math.random()*.6-.3);
  balls=[{x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:6}];
}
function buildBricks(){
  bricks=[];
  const cols=7,rows=4+Math.min(level,4);
  const gap=6,m=14,top=20;
  const bw=(W-m*2-gap*(cols-1))/cols,bh=20;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(level>=2&&Math.random()<.14)continue;
    bricks.push({x:m+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:(level>=3&&r<2)?2:1,col:COLS[r%COLS.length]});
  }
}
function dropPup(x,y){
  const t=['wide','multi','slow'][Math.floor(Math.random()*3)];
  pups.push({x,y,vy:1.6,t});
}
function step(){
  if(!running)return;
  cx.clearRect(0,0,W,H);
  // bricks
  for(const b of bricks){
    cx.fillStyle=b.col;cx.shadowColor=b.col;cx.shadowBlur=10;
    cx.globalAlpha=b.hp===2?.55:1;
    roundRect(b.x,b.y,b.w,b.h,5);cx.fill();
    cx.globalAlpha=1;cx.shadowBlur=0;
  }
  // paddle
  const pw=paddle.w*(paddle.wide>0?1.5:1);
  cx.fillStyle='#e2e8f0';cx.shadowColor='#22d3ee';cx.shadowBlur=16;
  roundRect(paddle.x-pw/2,paddle.y,pw,paddle.h,7);cx.fill();cx.shadowBlur=0;
  if(paddle.wide>0)paddle.wide--;
  // powerups
  pups=pups.filter(p=>{
    p.y+=p.vy;
    cx.font='18px sans-serif';cx.textAlign='center';
    cx.fillText(p.t==='wide'?'⤢':p.t==='multi'?'⚡':'🐌',p.x,p.y);
    if(p.y>paddle.y-6&&p.y<paddle.y+paddle.h+8&&Math.abs(p.x-paddle.x)<pw/2+10){
      if(p.t==='wide')paddle.wide=600;
      if(p.t==='multi'&&balls.length<3){const b=balls[0];balls.push({x:b.x,y:b.y,vx:-b.vx,vy:b.vy,r:b.r});}
      if(p.t==='slow')balls.forEach(b=>{b.vx*=.7;b.vy*=.7;});
      score+=5;$('score').textContent=score;
      return false;
    }
    return p.y<H+20;
  });
  // balls
  for(const b of balls){
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);}
    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);}
    // paddle bounce
    if(b.vy>0&&b.y+b.r>paddle.y&&b.y<paddle.y+paddle.h+6&&Math.abs(b.x-paddle.x)<pw/2+b.r){
      const off=(b.x-paddle.x)/(pw/2);
      const sp=Math.hypot(b.vx,b.vy)*(1.005);
      const ang=-Math.PI/2+off*1.05;
      b.vx=Math.cos(ang)*Math.min(sp,9);b.vy=Math.sin(ang)*Math.min(sp,9);
      b.y=paddle.y-b.r-1;
    }
    // bricks
    for(let i=bricks.length-1;i>=0;i--){
      const br=bricks[i];
      if(b.x+b.r>br.x&&b.x-b.r<br.x+br.w&&b.y+b.r>br.y&&b.y-b.r<br.y+br.h){
        const overlapX=Math.min(b.x+b.r-br.x,br.x+br.w-(b.x-b.r));
        const overlapY=Math.min(b.y+b.r-br.y,br.y+br.h-(b.y-b.r));
        if(overlapX<overlapY)b.vx*=-1;else b.vy*=-1;
        br.hp--;
        if(br.hp<=0){bricks.splice(i,1);score+=10;if(Math.random()<.14)dropPup(br.x+br.w/2,br.y);}
        else score+=5;
        $('score').textContent=score;
        break;
      }
    }
    cx.fillStyle='#fff';cx.shadowColor='#a5f3fc';cx.shadowBlur=14;
    cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill();cx.shadowBlur=0;
  }
  balls=balls.filter(b=>b.y<H+30);
  if(!balls.length){
    lives--;$('lives').textContent=lives;
    if(lives<=0){gameOver();return;}
    spawnBall(paddle.x,paddle.y-20);
  }
  if(!bricks.length){
    level++;$('level').textContent=level;score+=50;$('score').textContent=score;
    setupLevel();
  }
  requestAnimationFrame(step);
}
function roundRect(x,y,w,h,r){cx.beginPath();cx.roundRect(x,y,w,h,r);}
function movePaddle(clientX){
  const r=cv.getBoundingClientRect();
  paddle.x=Math.max(0,Math.min(W,clientX-r.left));
}
cv.addEventListener('pointermove',e=>movePaddle(e.clientX));
cv.addEventListener('pointerdown',e=>movePaddle(e.clientX));
function gameOver(){
  running=false;
  const nb=score>best;
  if(nb){best=score;ArcadiaStorage.setItem('neon_best',best);$('bestTop').textContent=best;}
  $('ovTitle').textContent='סוף המשחק 💥';
  $('ovScore').textContent=score;
  $('ovText').textContent=(nb?'🏆 שיא חדש! ':'')+'הגעתם לשלב '+level;
  $('overlay').classList.add('show');
}
$('btnStart').onclick=start;
$('btnAgain').onclick=()=>{$('overlay').classList.remove('show');start();};
$('btnShare').onclick=async()=>{
  const txt='שברתי '+score+' נקודות בשובר הניאון 💥 הגעתי לשלב '+level+'. מי מנצח?';
  if(navigator.share){try{await navigator.share({text:txt,url:location.href});}catch(e){}}
  else{try{await navigator.clipboard.writeText(txt+' '+location.href);$('btnShare').textContent='הועתק! ✅';setTimeout(()=>$('btnShare').textContent='שתפו 📤',1800);}catch(e){}}
};
</script>
