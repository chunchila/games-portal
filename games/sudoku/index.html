<style>
:root{--bg:#101318;--card:#1a1f2b;--accent:#fbbf24;--accent2:#60a5fa;--good:#34d399;--bad:#fb7185;--text:#f5f7fa;--muted:#98a2b8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;height:100%;}
body{font-family:'Rubik',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1000px 700px at 85% -10%,#fbbf2418,transparent),
             radial-gradient(800px 600px at -10% 110%,#60a5fa12,transparent),var(--bg);
  display:flex;flex-direction:column;align-items:center;min-height:100%;
  padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1;}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 4px;}
.logo{font-weight:900;font-size:23px;background:linear-gradient(90deg,var(--accent),#fde68a,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.pill{background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px;}
.screen{display:none;flex-direction:column;flex:1;animation:fade .3s ease;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding:16px 0 36px;}
.hero h1{font-size:48px;margin:0;background:linear-gradient(135deg,var(--accent),#fde68a 50%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--muted);font-size:16px;max-width:330px;margin:0;line-height:1.65;}
.diff-row{display:flex;gap:10px;}
.diff{background:var(--card);border:1.5px solid #ffffff1c;color:var(--text);border-radius:14px;padding:14px 22px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s;}
.diff small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.diff:active{transform:scale(.95);}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:16px;color:#2b1c02;
  background:linear-gradient(135deg,var(--accent),#fde68a);padding:14px 36px;font-size:18px;
  box-shadow:0 8px 24px #fbbf2444,inset 0 1px 0 #ffffff88;transition:transform .12s;}
.btn:active{transform:scale(.96);}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid #ffffff22;font-weight:600;padding:11px 20px;font-size:15px;}
.hud{display:flex;gap:8px;margin:6px 0;}
.hud .pill{flex:1;text-align:center;font-size:13px;}
.grid-zone{flex:0 0 auto;display:flex;justify-content:center;padding:4px 0;}
#grid{display:grid;grid-template-columns:repeat(9,1fr);width:min(94vw,420px);aspect-ratio:1;
  background:#39415a;border:2px solid #39415a;gap:1px;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px #00000066;}
.cell{background:#171c28;display:grid;place-items:center;font-size:clamp(15px,4.6vw,22px);font-weight:600;cursor:pointer;position:relative;color:#dbe4f5;}
.cell:nth-child(3n){border-left:2px solid #39415a;}
.cell:nth-child(9n){border-left:0;}
.cell.box-b{border-bottom:2px solid #39415a;}
.cell.given{color:#8b94ab;font-weight:800;}
.cell.sel{background:#31406b !important;}
.cell.same{background:#232c47;}
.cell.rel{background:#1c2334;}
.cell.err{background:#4b1f2d !important;color:#fda4af;}
.notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(7px,2vw,10px);color:#7ea0e0;padding:1px;}
.notes span{display:grid;place-items:center;}
.pad-zone{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:min(94vw,420px);margin:10px auto 0;}
.num{background:var(--card);border:1px solid #ffffff16;border-radius:10px;aspect-ratio:.82;color:var(--text);font-size:clamp(16px,4.6vw,22px);font-weight:800;cursor:pointer;font-family:inherit;transition:transform .1s;}
.num:active{transform:scale(.92);}
.tools{display:flex;gap:8px;justify-content:center;padding:12px 0 16px;}
.tool{background:var(--card);border:1px solid #ffffff16;border-radius:12px;color:var(--text);padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.tool.on{border-color:var(--accent2);color:var(--accent2);box-shadow:0 0 12px #60a5fa44;}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-bottom:40px;}
.end h2{margin:0;font-size:30px;}
.end .score-big{font-size:52px;font-weight:900;background:linear-gradient(135deg,var(--accent),#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo">9️⃣ סודוקו מאסטר</div>
    <div class="pill">⏱️ <span id="timer">0:00</span></div>
  </header>

  <section id="scrStart" class="screen active">
    <div class="hero">
      <h1>סודוקו מאסטר</h1>
      <p>לוח חדש בכל משחק, תמיד עם פתרון יחיד. מלאו את הלוח כך שכל שורה, עמודה וריבוע 3×3 יכילו את הספרות 1-9. מצב עיפרון לרשימות, 3 טעויות מותרות.</p>
      <div class="diff-row">
        <button class="diff" data-d="0">קל<small id="best0"></small></button>
        <button class="diff" data-d="1">בינוני<small id="best1"></small></button>
        <button class="diff" data-d="2">קשה<small id="best2"></small></button>
      </div>
    </div>
  </section>

  <section id="scrGame" class="screen">
    <div class="hud">
      <div class="pill" id="diffName">קל</div>
      <div class="pill">❌ <span id="mistakes">0</span>/3</div>
      <div class="pill">⏱️ <span id="timer2">0:00</span></div>
    </div>
    <div class="grid-zone"><div id="grid"></div></div>
    <div class="pad-zone" id="pad"></div>
    <div class="tools">
      <button class="tool" id="btnNotes">✏️ רשימות: כבוי</button>
      <button class="tool" id="btnErase">⌫ מחיקה</button>
      <button class="tool" id="btnNew">↺ לוח חדש</button>
    </div>
  </section>

  <section id="scrEnd" class="screen">
    <div class="end">
      <h2 id="endTitle">הלוח הושלם! 🎉</h2>
      <div class="score-big" id="endTime">0:00</div>
      <div class="pill" id="endBest"></div>
      <button class="btn" id="btnAgain">לוח חדש 🔁</button>
      <button class="btn ghost" id="btnHome">🏠 רמות</button>
    </div>
  </section>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const DIFFS=[{n:'קל',remove:38},{n:'בינוני',remove:46},{n:'קשה',remove:52}];
let solution,puzzle,given,notes,sel=null,notesMode=false,mistakes=0,diff=0,seconds=0,tick=null,over=false;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
// --- generator ---
function emptyGrid(){return Array.from({length:9},()=>Array(9).fill(0));}
function valid(g,r,c,v){
  for(let i=0;i<9;i++)if(g[r][i]===v||g[i][c]===v)return false;
  const br=r-r%3,bc=c-c%3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(g[br+i][bc+j]===v)return false;
  return true;
}
function fillGrid(g){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    if(g[r][c]===0){
      const nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
      for(const v of nums){if(valid(g,r,c,v)){g[r][c]=v;if(fillGrid(g))return true;g[r][c]=0;}}
      return false;
    }
  }
  return true;
}
function countSolutions(g,cap){
  let count=0;
  (function solve(){
    if(count>=cap)return;
    let br=-1,bc=-1;
    outer:for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(g[r][c]===0){br=r;bc=c;break outer;}
    if(br<0){count++;return;}
    for(let v=1;v<=9;v++){
      if(valid(g,br,bc,v)){g[br][bc]=v;solve();g[br][bc]=0;if(count>=cap)return;}
    }
  })();
  return count;
}
function generate(remove){
  const g=emptyGrid();fillGrid(g);
  const sol=g.map(r=>[...r]);
  const cells=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)cells.push([r,c]);
  cells.sort(()=>Math.random()-.5);
  let removed=0;
  for(const [r,c] of cells){
    if(removed>=remove)break;
    const bak=g[r][c];g[r][c]=0;
    const copy=g.map(row=>[...row]);
    if(countSolutions(copy,2)!==1)g[r][c]=bak;
    else removed++;
  }
  return {puzzle:g,solution:sol};
}
// --- UI ---
function start(d){
  diff=d;
  $('diffName').textContent=DIFFS[d].n;
  show('scrGame');
  $('grid').innerHTML='<div style="grid-column:1/-1;display:grid;place-items:center;color:var(--muted);background:#171c28">מכינים לוח... 🧩</div>';
  setTimeout(()=>{
    const gen=generate(DIFFS[d].remove);
    solution=gen.solution;puzzle=gen.puzzle;
    given=puzzle.map(r=>r.map(v=>v!==0));
    notes=Array.from({length:9},()=>Array.from({length:9},()=>new Set()));
    sel=null;notesMode=false;mistakes=0;over=false;seconds=0;
    $('mistakes').textContent=0;
    $('btnNotes').textContent='✏️ רשימות: כבוי';$('btnNotes').classList.remove('on');
    buildGrid();buildPad();startTimer();
  },30);
}
function startTimer(){
  clearInterval(tick);
  const upd=()=>{$('timer').textContent=fmt(seconds);$('timer2').textContent=fmt(seconds);};
  upd();
  tick=setInterval(()=>{seconds++;upd();},1000);
}
function buildGrid(){
  const g=$('grid');g.innerHTML='';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const el=document.createElement('div');
    el.className='cell'+((r%3===2&&r<8)?' box-b':'');
    el.dataset.r=r;el.dataset.c=c;
    el.onclick=()=>{if(!over){sel=[r,c];render();}};
    g.appendChild(el);
  }
  render();
}
function cellEl(r,c){return $('grid').children[r*9+c];}
function render(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const el=cellEl(r,c),v=puzzle[r][c];
    el.classList.toggle('given',given[r][c]);
    el.classList.remove('sel','same','rel','err');
    if(v!==0){el.textContent=v;}
    else if(notes[r][c].size){
      el.innerHTML='<div class="notes">'+[1,2,3,4,5,6,7,8,9].map(n=>`<span>${notes[r][c].has(n)?n:''}</span>`).join('')+'</div>';
    }else el.textContent='';
    if(!given[r][c]&&v!==0&&v!==solution[r][c])el.classList.add('err');
  }
  if(sel){
    const [sr,sc]=sel;
    const sv=puzzle[sr][sc];
    cellEl(sr,sc).classList.add('sel');
    for(let r=0;r<9;r++)for(let c=0;c<9;c++){
      const el=cellEl(r,c);
      if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))el.classList.add('rel');
      if(sv!==0&&puzzle[r][c]===sv)el.classList.add('same');
    }
  }
}
function buildPad(){
  const p=$('pad');p.innerHTML='';
  for(let n=1;n<=9;n++){
    const b=document.createElement('button');b.className='num';b.textContent=n;
    b.onclick=()=>enter(n);p.appendChild(b);
  }
}
function enter(n){
  if(!sel||over)return;
  const [r,c]=sel;
  if(given[r][c])return;
  if(notesMode){
    notes[r][c].has(n)?notes[r][c].delete(n):notes[r][c].add(n);
    render();return;
  }
  if(puzzle[r][c]===n)return;
  puzzle[r][c]=n;notes[r][c].clear();
  if(n!==solution[r][c]){
    mistakes++;$('mistakes').textContent=mistakes;
    if(navigator.vibrate)navigator.vibrate(120);
    if(mistakes>=3){
      over=true;clearInterval(tick);
      render();
      setTimeout(()=>{
        alert('3 טעויות! הלוח נחשף - נסו לוח חדש 💡');
        puzzle=solution.map(r=>[...r]);render();
      },400);
      return;
    }
  }
  render();
  checkWin();
}
function checkWin(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(puzzle[r][c]!==solution[r][c])return;
  over=true;clearInterval(tick);
  const key='sudoku_best_'+diff;
  const prev=+ArcadiaStorage.getItem(key)||null;
  const nb=!prev||seconds<prev;
  if(nb)ArcadiaStorage.setItem(key,seconds);
  $('endTime').textContent=fmt(seconds);
  $('endBest').textContent=nb?'🏆 שיא חדש ברמה '+DIFFS[diff].n+'!':'השיא ברמה זו: '+fmt(prev);
  renderBests();
  show('scrEnd');
}
function renderBests(){
  for(let i=0;i<3;i++){
    const b=+ArcadiaStorage.getItem('sudoku_best_'+i);
    $('best'+i).textContent=b?'שיא: '+fmt(b):'';
  }
}
renderBests();
$('btnNotes').onclick=()=>{
  notesMode=!notesMode;
  $('btnNotes').textContent='✏️ רשימות: '+(notesMode?'פעיל':'כבוי');
  $('btnNotes').classList.toggle('on',notesMode);
};
$('btnErase').onclick=()=>{
  if(!sel||over)return;
  const [r,c]=sel;
  if(given[r][c])return;
  puzzle[r][c]=0;notes[r][c].clear();render();
};
$('btnNew').onclick=()=>start(diff);
$('btnAgain').onclick=()=>start(diff);
$('btnHome').onclick=()=>{renderBests();show('scrStart');};
document.querySelectorAll('.diff').forEach(b=>b.onclick=()=>start(+b.dataset.d));
document.addEventListener('keydown',e=>{
  if(!$('scrGame').classList.contains('active'))return;
  if(/^[1-9]$/.test(e.key))enter(+e.key);
  if(e.key==='Backspace'||e.key==='Delete')$('btnErase').click();
  if(sel&&e.key.startsWith('Arrow')){
    let[r,c]=sel;
    if(e.key==='ArrowUp')r=Math.max(0,r-1);
    if(e.key==='ArrowDown')r=Math.min(8,r+1);
    if(e.key==='ArrowLeft')c=Math.min(8,c+1);
    if(e.key==='ArrowRight')c=Math.max(0,c-1);
    sel=[r,c];render();e.preventDefault();
  }
});
</script>
