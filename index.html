<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ארקדיה | כל המשחקים במקום אחד</title>
<meta name="description" content="ארקדיה - בית לכל ה-27 משחקים שבנינו: מילים, פאזלים, ארקייד, טייקון, משחקי ילדים ועוד. כנסו ושחקו.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070912;
    --surface: rgba(255,255,255,0.045);
    --surface-2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.09);
    --text: #f2f4ff;
    --muted: #98a1c6;
    --accent: #7c6cff;
    --accent-2: #22d3ee;
    --accent-3: #f472b6;
    --radius: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Heebo', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::selection { background: rgba(124,108,255,.4); }

  /* Animated aurora background */
  .bg-blob {
    position: fixed; border-radius: 50%; filter: blur(120px);
    opacity: .4; pointer-events: none; z-index: 0;
    animation: drift 26s ease-in-out infinite alternate;
    will-change: transform;
  }
  .bg-blob.b1 { width: 62vmax; height: 62vmax; background: #352a8f; top: -28vmax; right: -22vmax; }
  .bg-blob.b2 { width: 52vmax; height: 52vmax; background: #0b4a60; bottom: -22vmax; left: -16vmax; animation-delay: -9s; }
  .bg-blob.b3 { width: 38vmax; height: 38vmax; background: #6d1f5e; top: 42%; left: 28%; opacity: .2; animation-delay: -16s; }
  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(7vmax, 5vmax) scale(1.15); }
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 75%);
  }

  .wrap { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 0 18px 90px; }

  /* ===== Hero ===== */
  header.hero { text-align: center; padding: clamp(48px, 9vw, 88px) 0 6px; position: relative; }
  .hero .joystick {
    font-size: 40px; display: inline-block;
    animation: bob 3.2s ease-in-out infinite;
    filter: drop-shadow(0 10px 24px rgba(124,108,255,.45));
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-7deg);} 50% { transform: translateY(-10px) rotate(7deg);} }
  .hero .logo {
    font-size: clamp(58px, 14vw, 108px);
    font-weight: 900;
    line-height: 1.02;
    background: linear-gradient(115deg, #c3ccff 0%, #7c6cff 28%, #22d3ee 60%, #7cf5d3 88%);
    background-size: 180% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1.5px;
    animation: sheen 9s ease-in-out infinite alternate;
    filter: drop-shadow(0 6px 40px rgba(124,108,255,.35));
  }
  @keyframes sheen { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  .hero .logo-en {
    font-size: clamp(12px, 2.6vw, 16px);
    letter-spacing: 15px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 4px;
    padding-right: 15px; /* optical centering vs letter-spacing */
  }
  .hero p.tagline {
    margin: 18px auto 0;
    max-width: 560px;
    color: var(--muted);
    font-size: clamp(15px, 3.8vw, 19px);
    font-weight: 400;
    line-height: 1.7;
  }
  .hero p.tagline b { color: var(--text); font-weight: 700; }

  .hero-stats {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
    margin-top: 26px;
  }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 13.5px; font-weight: 600;
    color: var(--muted);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .stat-pill b { color: var(--text); font-weight: 800; font-size: 15px; }
  .stat-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ===== Controls ===== */
  .controls {
    position: sticky; top: 0; z-index: 20;
    padding: 14px 0 10px;
    margin: 30px -18px 6px;
    padding-inline: 18px;
    background: linear-gradient(to bottom, rgba(7,9,18,.97) 75%, rgba(7,9,18,0));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search-box {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 13px 16px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,108,255,.2); }
  .search-box svg { flex: none; opacity: .6; }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: inherit; font-size: 16px;
  }
  .search-box input::placeholder { color: var(--muted); }
  .sort-btn {
    flex: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 16px;
    padding: 13px 15px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: all .2s;
  }
  .sort-btn.active { color: #070912; background: linear-gradient(120deg, #7cf5d3, #22d3ee); border-color: transparent; }

  .chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 2px 6px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 15px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .chip .n { opacity: .55; font-size: 12px; margin-inline-start: 4px; font-weight: 500; }
  .chip:hover { background: var(--surface-2); color: var(--text); }
  .chip.active {
    color: #070912;
    background: var(--chip-color, var(--text));
    border-color: transparent;
    box-shadow: 0 4px 18px -4px var(--chip-color, transparent);
  }
  .chip.active .n { opacity: .7; }

  .result-count { color: var(--muted); font-size: 13px; padding: 6px 4px 0; min-height: 22px; }

  /* ===== Grid + cards ===== */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    margin-top: 16px;
  }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 22px; } }

  .card {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-decoration: none; color: inherit;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.34,1.56,.64,1), border-color .28s, box-shadow .28s;
    animation: pop .5s cubic-bezier(.34,1.4,.64,1) backwards;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.96); } }
  .card:hover, .card:focus-visible {
    transform: translateY(-6px);
    border-color: var(--cat-color);
    box-shadow: 0 22px 46px -16px var(--cat-glow-strong), 0 0 0 1px var(--cat-color);
  }
  .card:active { transform: translateY(-2px) scale(.99); }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: linear-gradient(140deg, var(--cat-glow), rgba(255,255,255,0.02));
    border-bottom: 1px solid var(--border);
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    display: block;
    transform: scale(1.02);
    transition: transform .5s cubic-bezier(.2,.7,.3,1);
    opacity: 0;
  }
  .thumb img.loaded { opacity: 1; transition: transform .5s cubic-bezier(.2,.7,.3,1), opacity .45s ease; }
  .card:hover .thumb img { transform: scale(1.07); }
  .thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(7,9,18,.55), transparent 45%);
    pointer-events: none;
  }
  .thumb .cat-tag {
    position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2;
    font-size: 11.5px; font-weight: 700;
    color: #070912;
    background: var(--cat-color);
    padding: 4px 11px; border-radius: 999px;
    box-shadow: 0 4px 14px -3px var(--cat-glow-strong);
  }
  .thumb .play-fab {
    position: absolute; bottom: 12px; inset-inline-end: 12px; z-index: 2;
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(10,13,26,.72);
    border: 1px solid rgba(255,255,255,.22);
    color: #fff;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all .25s;
  }
  .card:hover .play-fab {
    background: var(--cat-color);
    color: #070912;
    border-color: transparent;
    transform: scale(1.12) rotate(-8deg);
    box-shadow: 0 8px 22px -6px var(--cat-glow-strong);
  }

  .card-body { padding: 15px 17px 17px; }
  .card-body h3 { font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
  .card-body p {
    color: var(--muted); font-size: 13.5px; font-weight: 400;
    margin-top: 4px; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .new-badge {
    position: absolute; top: 12px; inset-inline-end: 12px; z-index: 3;
    background: linear-gradient(120deg, #7cf5d3, #22d3ee);
    color: #062a2e;
    font-size: 11px; font-weight: 800;
    padding: 4px 11px;
    border-radius: 999px;
    letter-spacing: .4px;
    box-shadow: 0 4px 16px -3px rgba(34,211,238,.6);
    animation: glowpulse 2.6s ease-in-out infinite;
  }
  @keyframes glowpulse {
    0%,100% { box-shadow: 0 4px 16px -3px rgba(34,211,238,.55); }
    50%     { box-shadow: 0 4px 24px -2px rgba(34,211,238,.95); }
  }

  .empty {
    text-align: center; padding: 70px 20px; color: var(--muted);
  }
  .empty .big { font-size: 46px; margin-bottom: 12px; }
  .empty button {
    margin-top: 14px; background: none; border: 1px solid var(--border);
    color: var(--text); border-radius: 999px; padding: 9px 20px;
    font-family: inherit; font-size: 14px; cursor: pointer;
  }

  footer {
    margin-top: 72px; text-align: center; color: var(--muted);
    font-size: 13px; line-height: 1.9;
  }
  footer .foot-logo { font-weight: 800; color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .bg-blob, .hero .joystick, .hero .logo, .new-badge { animation: none; }
    .card { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <div class="bg-blob b1"></div>

const NEW_THRESHOLD = 23; // added rank >= this gets the "חדש" ribbon
const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const searchInput = document.getElementById('search');
const sortBtn = document.getElementById('sort-new');
const countEl = document.getElementById('result-count');
const emptyEl = document.getElementById('empty');

let activeCat = 'הכל';
let query = '';
let sortNew = false;

document.getElementById('total-count').textContent = GAMES.length;
document.getElementById('stat-games').textContent = GAMES.length;
document.getElementById('stat-cats').textContent = new Set(GAMES.map(g => g.cat)).size;

function buildChips() {
  const cats = ['הכל', ...Object.keys(CATEGORIES)];
  chipsEl.innerHTML = '';
  cats.forEach(cat => {
    const n = cat === 'הכל' ? GAMES.length : GAMES.filter(g => g.cat === cat).length;
    const btn = document.createElement('button');
    btn.className = 'chip' + (cat === activeCat ? ' active' : '');
    btn.innerHTML = `${cat}<span class="n">${n}</span>`;
    if (cat !== 'הכל') btn.style.setProperty('--chip-color', CATEGORIES[cat].color);
    else btn.style.setProperty('--chip-color', '#f2f4ff');
    btn.onclick = () => { activeCat = cat; buildChips(); render(); };
    chipsEl.appendChild(btn);
  });
}

function matches(g) {
  if (activeCat !== 'הכל' && g.cat !== activeCat) return false;
  if (query) {
    const q = query.toLowerCase();
    return g.name.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q) || g.cat.includes(q);
  }
  return true;
}

function render() {
  let list = GAMES.filter(matches);
  if (sortNew) list = [...list].sort((a, b) => b.added - a.added);

  grid.innerHTML = '';
  list.forEach((g, i) => {
    const c = CATEGORIES[g.cat];
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.setProperty('--cat-color', c.color);
    a.style.setProperty('--cat-glow', c.glow);
    a.style.setProperty('--cat-glow-strong', c.strong);
    a.style.animationDelay = Math.min(i * 45, 400) + 'ms';
    a.innerHTML = `
      ${g.added >= NEW_THRESHOLD ? '<span class="new-badge">חדש ✦</span>' : ''}
      <div class="thumb">
        <img src="${g.shot}" alt="תצוגה מקדימה של ${g.name}" loading="lazy" width="760" height="473" onload="this.classList.add('loaded')">
        <span class="cat-tag">${g.cat}</span>
        <span class="play-fab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.54.84l10-6.5a1 1 0 0 0 0-1.68l-10-6.5A1 1 0 0 0 8 5.5Z"/></svg>
        </span>
      </div>
      <div class="card-body">
        <h3>${g.name}</h3>
        <p>${g.desc}</p>
      </div>`;
    grid.appendChild(a);
  });

  emptyEl.hidden = list.length > 0;
  countEl.textContent = list.length === GAMES.length
    ? ''
    : list.length === 0 ? '' : `מציג ${list.length} מתוך ${GAMES.length} משחקים`;
}

searchInput.addEventListener('input', e => { query = e.target.value.trim(); render(); });
sortBtn.addEventListener('click', () => {
  sortNew = !sortNew;
  sortBtn.classList.toggle('active', sortNew);
  sortBtn.setAttribute('aria-pressed', sortNew);
  render();
});
document.getElementById('clear-search').onclick = () => {
  searchInput.value = ''; query = ''; activeCat = 'הכל'; buildChips(); render(); searchInput.focus();
};

buildChips();
render();
</script>
